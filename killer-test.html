  if(dialog==="confirm" && confirmAct) return `<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfh">
      <h2 id="cfh">Are you sure?</h2><div class="hint">${esc(confirmAct.text)}</div>
      <div class="btns"><button type="button" class="primary" data-act="doConfirm">${esc(confirmAct.button)}</button>
      <button type="button" class="secondary" data-act="closeDlg">Cancel</button></div></div></div>`;
  return "";
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const firstTo = n => Math.floor(n/2) + 1;
const is01 = g => /^\d+$/.test(g);
const NAMES = { c121:"121 Ladder", catch40:"Catch 40", medley:"Medley", cricket:"Cricket", cutthroat:"Cut-Throat", hammer:"Hammer Cricket", killer:"Killer", halveit:"Halve-It", shanghai:"Shanghai", baseball:"Baseball", golf:"Golf", atc:"Around the Clock", bobs:"Bob's 27", countup:"Count-Up" };
const shortName = g => NAMES[g] || g;
const RG = ["shanghai","baseball","golf","atc","bobs","countup","hammer"];
/* checkout practice: 121 Ladder and Catch 40 (typed visits, double out) */
const CO = ["c121","catch40"];
const isCO = g => CO.includes(g);
const coStart = g => g==="c121" ? 121 : 61;
const coMaxDarts = g => g==="c121" ? 9 : 6;
const coAttempts = m => m.game==="c121" ? Infinity : 40;
const C121_TOP = 170;
const coPts = d => d<=2 ? 3 : d===3 ? 2 : d<=6 ? 1 : 0;
const HAMMER_BASE = [20,19,18,"W",17,16,15,"W"], WILD_POOL = [12,13,14,15,16,17,18,19,20,25];
const segVal = (n,m) => n===25 ? 25*m : n*m;
const isRG = g => RG.includes(g);
const isCricket = g => g==="cricket" || g==="cutthroat";
const oneGame = g => g==="killer" || g==="halveit" || isRG(g) || isCO(g);
const ATC_T = [...Array(20).keys()].map(k=>k+1).concat([25]);
const HALVE = [20,"EVEN",19,"ODD",18,"TRIPLE",17,"DOUBLE",16,"CHOICE",15,"BULL"];
const halveLabel = t => typeof t==="number" ? String(t) : t.charAt(0)+t.slice(1).toLowerCase();
function dartLabel(n,m){ if(n===0) return "Miss"; if(n===25) return m===2 ? "Bull" : "25"; return (m===3?"T":m===2?"D":"") + n; }
function gameName(g, o){
  if(g==="cricket") return o.points ? "Cricket" : "Cricket · No points";
  if(g==="killer") return `Killer · ${o.lives} lives`;
  if(g==="halveit") return "Halve-It";
  if(g==="cutthroat") return "Cut-Throat Cricket";
  if(g==="medley") return "Medley: 501 & Cricket";
  if(g==="shanghai") return `Shanghai · ${o.shRounds} rounds`;
  if(g==="hammer") return `Hammer Cricket · ${o.hammerMode==="masters" ? "Masters" : "Open"}`;
  if(g==="countup") return `Count-Up · ${o.cuRounds} rounds`;
  if(g==="c121") return "121 Ladder";
  if(g==="catch40") return "Catch 40";
  if(isRG(g)) return NAMES[g];
  return `${g} · ${o.inMode==="double"?"Double in":"Straight in"}, ${o.outMode==="double"?"double out":"straight out"}`;
}
const POSSIBLE = (() => { const d=[0,25,50]; for(let i=1;i<=20;i++) d.push(i,2*i,3*i);
  const s=new Set(); for(const a of d) for(const b of d) for(const c of d) s.add(a+b+c); return s; })();

/* ---------- checkout suggestions ---------- */
const ALL = (() => { const a=[]; for(let i=20;i>=1;i--) a.push({l:"T"+i,v:3*i}); a.push({l:"Bull",v:50}); a.push({l:"25",v:25});
  for(let i=20;i>=1;i--) a.push({l:""+i,v:i}); for(let i=20;i>=1;i--) a.push({l:"D"+i,v:2*i}); return a; })();
const DOUBLES = [20,16,18,12,10,8,14,6,4,2,19,17,15,13,11,9,7,5,3,1].map(i=>({l:"D"+i,v:2*i})).concat([{l:"Bull",v:50}]);
function oneDart(r){ if(r<=0) return null; if(r<=20) return ""+r; if(r===25) return "25"; if(r===50) return "Bull";
  if(r%3===0 && r<=60) return "T"+r/3; if(r%2===0 && r<=40) return "D"+r/2; return null; }
function checkout(s, left, dbl){
  if(s<=0 || s>180 || left<1) return null;
  const fins = dbl ? DOUBLES : ALL;
  if(!dbl){ const a = oneDart(s); if(a) return [a]; }
  for(const f of fins) if(f.v===s) return [f.l];
  if(left<2) return null;
  for(const f of fins){ const a = oneDart(s-f.v); if(a) return [a,f.l]; }
  if(left<3) return null;
  for(const f of fins) for(const a of ALL){ const b = oneDart(s-f.v-a.v); if(b) return [a.l,b,f.l]; }
  return null;
}

/* ---------- match engine ---------- */
function newLeg(){
  const g = match.game;
  const p = match.players.map(() => isCO(g)
    ? { target:coStart(g), left:coStart(g), used:0, att:0, banker:0, best:0, fin:0, pts:0, darts:0, turns:0, out:false, hist:[] }
    : is01(g)
    ? { score:+g, isIn: match.opts.inMode==="straight", darts:0, turns:0 }
    : g==="halveit"
    ? { total:0, darts:0, turns:0, hist:[] }
    : isRG(g)
    ? { total: g==="bobs" ? 27 : 0, darts:0, turns:0, hist:[], out:false, pos:0 }
    : g==="killer"
    ? { num:null, lives:0, out:false, darts:0, turns:0, taken:0, last:null }
    : { marks:{20:0,19:0,18:0,17:0,16:0,15:0,25:0}, points:0, darts:0, hits:0, turns:0, last:null });
  return { p, log:[], phase: g==="killer" ? "pick" : "play", round:0 };
}
function tl(e){ if(!match.tlog) match.tlog = []; e.s = match.setNo; e.l = match.legNo;
  if(match.teams && ["01","cr","hv","rg","ki","co"].includes(e.k)){ const w = upIdx(e.p); if(w!==null) e.w = w; }
  match.tlog.push(e); return match.tlog.length-1; }
/* ---------- teams: each side is one "player"; partners take turns (A1, B1, A2, B2) ---------- */
const teamable = g => !["killer","bobs","c121","catch40"].includes(g);
const TEAM_L = ["A","B","C","D"];
function teamsOn(){ const k = +settings.teams||0; return k>=2 && teamable(settings.game) && settings.players.length>k; }
const teamOfP = i => { const k = +settings.teams||0, t = (settings.teamOf||[])[i]; return Number.isInteger(t) && t<k ? t : i % k; };
function teamGroups(){ const k = +settings.teams||0, g = [...Array(k)].map(()=>[]); settings.players.forEach((_,i)=>g[teamOfP(i)].push(i)); return g; }
function upIdx(i){
  const p = match && match.players[i]; if(!p || !p.members) return null;
  const tc = (match.leg && match.leg.tc && match.leg.tc[i]) || 0, legsDone = (match.tlog||[]).filter(e=>e.k==="leg").length;
  return (tc + legsDone) % p.members.length;
}
function whoName(i){ if(i===undefined) i = match.cur; const p = match.players[i]; if(!p) return ""; const k = upIdx(i); return k===null ? p.name : p.members[k].name; }
function sideName(i){ const p = match.players[i]; return p.members ? p.members.map(m=>m.name).join(" & ") : p.name; }
const keepOf = P => P.map(p=>({ name:p.name, pid:p.pid||null, members:p.members ? p.members.map(m=>({ name:m.name, pid:m.pid||null })) : null }));
function startMatch(keep){
  const nm = i => settings.players[i].trim() || `Player ${i+1}`, pd = i => (settings.pids || [])[i] || null;
  let sides;
  if(keep) sides = keep;
  else if(settings.game==="c121" && settings.players.length>1){
    const all = settings.players.map((_,i)=>({ name:nm(i), pid:pd(i) })), ft = String(settings.firstThrow||"0");
    const k = ft==="random" ? Math.floor(Math.random()*all.length) : (+ft < all.length ? +ft : 0);
    const order = all.slice(k).concat(all.slice(0,k));
    sides = [{ name: order.map(m=>m.name).join(" & "), pid:null, members: order }];
  }
  else if(teamsOn()) sides = teamGroups().filter(g=>g.length).map(g=>({ name:g.map(nm).join(" & "), pid:null, members:g.map(i=>({ name:nm(i), pid:pd(i) })) }));
  else sides = settings.players.map((_,i)=>({ name:nm(i), pid:pd(i) }));
  /* 121 Ladder is never head-to-head: everyone climbs one shared ladder (also on Rematch / Same as last time) */
  if(settings.game==="c121" && sides.length>1){
    const all = sides.flatMap(x=>x.members ? x.members : [{ name:x.name, pid:x.pid||null }]);
    sides = [{ name: all.map(m=>m.name).join(" & "), pid:null, members: all }];
  }
  const names = sides.map(x=>x.name), pids = sides.map(x=>x.pid||null);
  match = {
    game: settings.game==="medley" ? "501" : settings.game,
    base: settings.game==="medley" ? "medley" : null,
    opts: { inMode:settings.inMode, outMode:settings.outMode, points: settings.game==="cutthroat" ? true : settings.points, lives:settings.lives, shRounds:settings.shRounds, cuRounds:settings.cuRounds, coAttempts:settings.coAttempts||10, hammerMode:settings.hammerMode||"open",
      cutthroat: settings.game==="cutthroat",
      sets: oneGame(settings.game) ? 1 : settings.sets, legs: oneGame(settings.game) ? 1 : settings.game==="medley" ? Math.max(3, settings.legs|1) : settings.legs },
    players: names.map((name,i) => Object.assign({ name, pid: pids[i] || null, sets:0, legs:0, legsTotal:0, cDarts:0, cScore:0 }, sides[i].members ? { members: sides[i].members } : {})),
    teams: sides.some(x=>x.members),
    setNo:1, legNo:1, legStarter:0, cur:0, turn:[], turnMarks:0, over:null,
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), started: Date.now(), tlog: []
  };
  if(match.game==="hammer"){
    match.hTargets = HAMMER_BASE.map(t=>t==="W" ? WILD_POOL[Math.floor(Math.random()*WILD_POOL.length)] : t);
    match.hWild = HAMMER_BASE.map(t=>t==="W");
  }
  const ft = String(settings.firstThrow || "0"), n = match.players.length;
  if(ft==="random") match.legStarter = Math.floor(Math.random()*n);
  else if(ft!=="bull" && +ft < n) match.legStarter = +ft;
  match.cur = match.legStarter;
  match.leg = newLeg();
  if(ft==="bull" && n>1) match.cork = { stage:"who", start:true };
  hist = []; entry = ""; pending = null; screen = "game"; save(); render();
}
function snapshot(){ hist.push(JSON.stringify(match)); if(hist.length>400) hist.shift(); match.by = deviceId; }
function undo(){ if(!hist.length) return; match = JSON.parse(hist.pop()); entry = ""; pending = null; coAsk = null; save(); render(); }
function nextPlayer(){
  const n = match.players.length;
  if(match.teams){ const L = match.leg; L.tc = L.tc || []; L.tc[match.cur] = (L.tc[match.cur]||0) + 1; }
  for(let k=0;k<n;k++){
    match.cur = (match.cur+1) % n;
    if((match.game!=="killer" && match.game!=="bobs" && !isCO(match.game)) || !match.leg.p[match.cur].out) return;
  }
}

/* killer: throw for numbers, then dart-by-dart */
function pickNumber(n){
  const L = match.leg;
  if(L.p.some(q=>q.num===n)){ msg(`${n===25?"Bull":n} is taken. Throw again.`); return; }
  snapshot();
  L.p[match.cur].num = n;
  advancePick(); save(); render();
}
function advancePick(){
  const L = match.leg, n = match.players.length;
  for(let k=0;k<n;k++){ const i = (match.legStarter+k) % n; if(L.p[i].num===null){ match.cur = i; return; } }
  L.phase = "play"; match.cur = match.legStarter;
}
function randomPick(){
  const used = match.leg.p.map(q=>q.num);
  const free = [...Array(20).keys()].map(k=>k+1).concat([25]).filter(n=>!used.includes(n));
  pickNumber(free[Math.floor(Math.random()*free.length)]);
}
function reuseNumbers(){
  snapshot();
  match.leg.p.forEach((q,i)=>q.num = match.lastNums[i]);
  advancePick(); save(); render();
}
function killerDart(n, m){
  if(!match || match.over || match.leg.phase!=="play") return;
  if(match.turn.length>=3){ msg("All 3 darts are in. Tap END TURN."); render(); return; }
  snapshot();
  const L = match.leg, idx = match.cur, p = L.p[idx], max = match.opts.lives;
  p.darts++;
  let counted = false;
  const o = n ? L.p.findIndex(q=>q.num===n && !q.out) : -1;
  if(o>=0 && o!==idx && (p.lives!==max || L.p[o].turns===0)){ { const prev = hist.pop(); match.by = JSON.parse(prev).by; } p.darts--; return; }
  if(o===idx){
    counted = true;
    if(p.lives===max){
      p.lives = -1; p.out = true; tl({ k:"out", p:idx, why:"hit own number", dth:Math.floor(Math.random()*Reaper.count()) }); toast(`${match.players[idx].name} killed themselves!`, true);
    } else if(p.lives + m > max){
      p.lives = -1; p.out = true; tl({ k:"out", p:idx, why:`went over ${max}`, dth:Math.floor(Math.random()*Reaper.count()) }); toast(`${match.players[idx].name} went over ${max}. Out!`, true);
    } else {
      p.lives += m;
      if(p.lives===max) toast("KILLER!");
    }
  } else if(o>=0 && p.lives===max){
    counted = true;
    const q = L.p[o]; q.lives -= m; p.taken += m;
    if(q.lives<0){ q.out = true; tl({ k:"out", p:o, by:idx, dth:Math.floor(Math.random()*Reaper.count()) }); toast(`${match.players[o].name} is out!`, true); }
  }
  match.turn.push({ n, m, counted });
  const alive = L.p.map((q,i)=>i).filter(i=>!L.p[i].out);
  if(alive.length===1){
    const w = alive[0];
    p.turns++; p.last = match.turn.map(d=>dartLabel(d.n,d.m)); tl({ k:"ki", p:idx, d:p.last });
    endLeg(w, { darts:L.p[w].darts });
  } else if(p.out) killerEndTurn();
  save(); render();
}

/* 01: whole-turn score entry */
let coAsk = null;   // { opts:[darts] } how many darts the checkout took
function coVisit(v){
  entry = "";
  const i = match.cur, P = match.leg.p[i], left = P.left, room = coMaxDarts(match.game) - P.used;
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  if(v===left){
    if(!checkout(left,3,true)){ msg(`${left} can't be finished on a double in 3 darts`); render(); return; }
    let min = 1; while(min<3 && !checkout(left,min,true)) min++;
    const opts = [1,2,3].filter(d=>d>=min && d<=room);
    if(opts.length===1){ coFinish(opts[0]); return; }
    coAsk = { opts }; render(); return;
  }
  snapshot();
  const bust = v>left || left-v===1;
  P.darts += 3; P.turns++; P.used += 3;
  if(!bust) P.left -= v; else toast("Bust", true);
  tl({ k:"co", p:i, v: bust ? 0 : v, bust, start:left, left:P.left, target:P.target });
  if(P.used >= coMaxDarts(match.game)) coAttemptEnd(i, false, 0);
  coNext(); save(); render();
}
function coFinish(d){
  coAsk = null; snapshot();
  const i = match.cur, P = match.leg.p[i], total = P.used + d;
  P.darts += d; P.turns++;
  tl({ k:"co", p:i, v:P.left, co:true, darts:d, total, start:P.left, left:0, target:P.target });
  coAttemptEnd(i, true, total);
  coNext(); save(); render();
}
function coAttemptEnd(i, ok, total){
  const g = match.game, P = match.leg.p[i], t = P.target;
  let note = "";
  if(g==="c121"){
    /* skip numbers that can't be checked out in 3 darts (159, 162, 163, 165, 166, 168, 169) */
    const step = (n,d)=>{ do n += d; while(n<C121_TOP && n>coStart(g) && !checkout(n,3,true)); return n; };
    if(ok){ P.fin++; P.best = Math.max(P.best, t); if(total<=3 && t>P.banker){ P.banker = t; note = "banker"; } P.target = t>=C121_TOP ? t : step(t,1); if(t>=C121_TOP) P.top = true; }
    else P.target = Math.max(P.banker || coStart(g), step(t,-1));
  } else {
    const pts = ok ? coPts(total) : 0; P.pts += pts; if(ok) P.fin++; P.target = t+1; note = pts;
  }
  P.hist.push({ t, ok, total, note });
  P.att++; P.used = 0; P.left = P.target;
  const last = match.tlog[match.tlog.length-1]; if(last && last.k==="co"){ last.end = true; last.ok = ok; if(note==="banker") last.banker = true; if(g==="catch40") last.pts = note; }
  if(ok) toast(g==="catch40" ? `+${note} pt${note===1?"":"s"}` : note==="banker" ? `Banker ${t}!` : `${t} ✓`);
  if(P.att >= coAttempts(match) || P.top) P.out = true;
  if(P.top) toast("170 done! Ladder complete");
}
function coNext(force){
  const P = match.leg.p;
  if(force || P.every(q=>q.out)){
    const key = q => match.game==="c121" ? q.best*1000 + q.fin : q.pts;
    const b = Math.max(...P.map(key)), winners = P.map((q,i)=>i).filter(i=>key(P[i])===b);
    winners.forEach(w=>match.players[w].legsTotal++);
    match.over = { type:"match", winner:winners[0], tie: winners.length>1 ? winners : null, legScore: match.players.map(p=>p.legs), darts:P[winners[0]].darts };
    match.turn = []; return;
  }
  nextPlayer();
}
function submitScore(v){
  if(!match || match.over) return;
  if(isCO(match.game)) return coVisit(v);
  if(match.game==="halveit") return halveTotal(v);
  if(match.game==="countup") return countupTotal(v);
  entry = "";
  const L = match.leg, i = match.cur, p = L.p[i], rem = p.score, dbl = match.opts.outMode==="double";
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  if(!p.isIn && v===1){ msg("Double in: the lowest starting score is 2"); render(); return; }
  if(v===rem){
    if(dbl && !checkout(rem,3,true)){ msg(`${rem} can't be finished on a double in 3 darts`); render(); return; }
    let min = 1; while(min<3 && !checkout(rem,min,dbl)) min++;
    if(min===3){ finish(3); return; }
    pending = { score:rem, opts:[1,2,3].filter(d=>d>=min) }; render(); return;
  }
  snapshot();
  p.darts += 3; p.turns++;
  let li;
  if(v>rem || (dbl && rem-v===1)){
    L.log.push({ i, v:0, left:rem, bust:true }); toast("Bust", true);
    li = tl({ k:"01", p:i, v:0, bust:true, start:rem, left:rem });
  } else {
    p.score -= v; if(v>0) p.isIn = true;
    L.log.push({ i, v, left:p.score });
    li = tl({ k:"01", p:i, v, start:rem, left:p.score });
    if(v===180) toast("180!"); else if(v>=140) toast(v+"!");
  }
  if(dbl && rem<=50 && checkout(rem,3,true) && profilesOn() && prefs.ddAsk) ddAsk = { li, max:3, min:0 };
  nextPlayer(); save(); render();
}
function finish(darts){
  const L = match.leg, i = match.cur, p = L.p[i];
  snapshot();
  const co = p.score;
  p.darts += darts; p.turns++; L.log.push({ i, v:co, left:0 }); p.score = 0; p.isIn = true;
  pending = null;
  const li = tl({ k:"01", p:i, v:co, start:co, left:0, co:true, darts });
  if(match.opts.outMode==="double" && profilesOn() && prefs.ddAsk) ddAsk = { li, max:darts, min:1 };
  endLeg(i, { checkout:co, darts:p.darts });
  save(); render();
}

/* cricket: dart-by-dart */
function throwDart(n, m){
  if(!match || match.over) return;
  if(match.turn.length>=3){ msg("All 3 darts are in. Tap END TURN."); render(); return; }
  snapshot();
  const L = match.leg, idx = match.cur, p = L.p[idx];
  p.darts++;
  let counted = false, win = false;
  if(TARGETS.includes(n)){
    const cur = p.marks[n], need = 3-cur, extra = Math.max(0, m-need);
    p.marks[n] = Math.min(3, cur+m);
    let scored = 0;
    const open = L.p.filter((o,i)=>i!==idx && o.marks[n]<3);
    if(extra && match.opts.points && open.length){
      scored = extra;
      if(match.opts.cutthroat) open.forEach(o=>o.points += extra*n); else p.points += extra*n;
    }
    const add = Math.min(m,need) + scored;
    p.hits += add; match.turnMarks += add; counted = add > 0;
    const closed = TARGETS.every(t=>p.marks[t]===3);
    if(closed && (!match.opts.points || L.p.every((o,i)=>i===idx || (match.opts.cutthroat ? p.points<=o.points : p.points>=o.points)))) win = true;
  }
  match.turn.push({n, m, counted});
  if(win){ p.turns++; p.last = cricketSummary(); tl({ k:"cr", p:idx, marks:match.turnMarks, d:p.last.darts, pts:L.p.map(q=>q.points) }); endLeg(idx, { darts:p.darts }); }
  save(); render();
}
/* halve-it */
function halveTarget(){ return HALVE[match.leg.round]; }
function dartValue(n,m){ return n===25 ? 25*m : n*m; }
function dartCounts(d, t, choice){
  if(d.n===0) return false;
  if(typeof t==="number") return d.n===t;
  if(t==="TRIPLE") return d.m===3;
  if(t==="DOUBLE") return d.m===2;
  if(t==="BULL") return d.n===25;
  if(t==="CHOICE") return d.n===choice;
  return true; // EVEN / ODD: every dart adds to the total
}
function halveScore(darts, t, choice){
  const total = darts.filter(d=>dartCounts(d,t,choice)).reduce((a,d)=>a+dartValue(d.n,d.m),0);
  if(t==="EVEN") return total>0 && total%2===0 ? total : 0;
  if(t==="ODD") return total%2===1 ? total : 0;
  return total;
}
function pickChoice(n){
  snapshot(); match.choice = n; save(); render();
}
function halveDart(n, m){
  if(!match || match.over) return;
  if(match.turn.length>=3){ msg("All 3 darts are in. Tap END TURN."); render(); return; }
  const t = halveTarget();
  if(t==="CHOICE" && !match.choice) return;
  snapshot();
  const p = match.leg.p[match.cur];
  p.darts++;
  const d = { n, m };
  d.counted = t==="EVEN" || t==="ODD" ? n>0 : dartCounts(d, t, match.choice);
  match.turn.push(d);
  mod = 1; save(); render();
}
function halveTotal(v){
  entry = "";
  if(!["EVEN","ODD"].includes(halveTarget())) return;
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  snapshot();
  match.leg.p[match.cur].darts += 3; match.turn = [];
  const t = halveTarget();
  const sc = t==="EVEN" ? (v>0 && v%2===0 ? v : 0) : (v%2===1 ? v : 0);
  endHalveTurn(sc); save(); render();
}
function endHalveTurn(override){
  const L = match.leg, i = match.cur, p = L.p[i], t = halveTarget();
  const sc = override!==undefined ? override : halveScore(match.turn, t, match.choice);
  const before = p.total;
  if(sc>0) p.total += sc; else { p.total = Math.ceil(p.total/2); toast("Halved!", true); }
  p.hist.push({ score:sc, halved:sc===0, total:p.total, before, choice: t==="CHOICE" ? match.choice : null });
  tl({ k:"hv", p:i, r:L.round, score:sc, halved:sc===0, total:p.total });
  p.turns++; match.turn = []; match.choice = null;
  nextPlayer();
  if(match.cur===match.legStarter){
    L.round++;
    if(L.round>=HALVE.length){ finishHalve(); return; }
  }
}
function finishHalve(){
  const L = match.leg, best = Math.max(...L.p.map(q=>q.total));
  const winners = L.p.map((q,i)=>i).filter(i=>L.p[i].total===best);
  winners.forEach(w=>match.players[w].legsTotal++);
  match.over = { type:"match", winner:winners[0], tie: winners.length>1 ? winners : null, legScore: match.players.map(p=>p.legs), darts: L.p[winners[0]].darts };
  match.turn = [];
}
function halveLast(i){
  const h = match.leg.p[i].hist, last = h[h.length-1];
  if(!last) return "";
  return last.halved ? `<span class="avg">½</span>` : `<span>+${last.score}</span>`;
}
/* ---------- round games: shanghai, baseball, golf, around the clock, bob's 27, count-up ---------- */
function rgRounds(){
  const g = match.game, o = match.opts, seq = n => [...Array(n).keys()].map(k=>k+1);
  if(g==="shanghai") return seq(o.shRounds);
  if(g==="hammer") return match.hTargets;
  if(g==="baseball" || g==="golf") return seq(9);
  if(g==="bobs") return seq(20).concat([25]);
  if(g==="countup") return seq(o.cuRounds);
  return null;
}
function rgTarget(){ const r = rgRounds(); return r ? r[Math.min(match.leg.round, r.length-1)] : ATC_T[Math.min(match.leg.p[match.cur].pos, ATC_T.length-1)]; }
function rgRowLabel(t, r){
  const g = match.game;
  if(g==="hammer"){ const wild = match.hWild && match.hWild[r]; if(wild && r>match.leg.round) return "Wild ?"; return (wild ? "Wild " : "") + (t===25 ? "Bull" : t); }
  if(g==="bobs") return t===25 ? "D-Bull" : "D"+t;
  if(g==="countup") return "R"+t;
  if(g==="golf") return "Hole "+t;
  if(g==="baseball") return "Inn "+t;
  return String(t);
}
const GOLF = { 2:{v:1,l:"Double",s:"Dbl"}, 3:{v:2,l:"Triple",s:"Trp"}, 1:{v:3,l:"Single",s:"Sgl"}, 0:{v:5,l:"Miss",s:"Miss"} };
function rgDart(n, m){
  if(!match || match.over) return;
  if(match.turn.length>=3){ msg("All 3 darts are in. Tap END TURN."); render(); return; }
  const g = match.game, L = match.leg, idx = match.cur, p = L.p[idx];
  snapshot();
  p.darts++;
  const t = rgTarget();
  if(g==="atc"){
    const hit = n>0;
    match.turn.push({ n:hit?t:0, m:1, counted:hit });
    if(hit){ p.pos++; if(p.pos>=ATC_T.length){ p.turns++; tl({ k:"rg", p:idx, tag: match.turn.map(d=>d.counted ? (d.n===25?"B":d.n) : "–").join(" ") }); match.turn=[]; finishRG([idx]); save(); render(); return; } }
  } else if(g==="golf"){
    match.turn.push({ n:m?t:0, m:m||1, counted:m>0, golf:GOLF[m] });
  } else if(g==="hammer"){
    const k = match.turn.length, mult = hammerMult(k);
    const ok = n===t && n>0 && (match.opts.hammerMode!=="masters" || m===3 || (t===25 && m===2));
    match.turn.push({ n, m:m||1, counted:ok, v: ok ? segVal(n,m)*mult : 0, x:mult });
  } else {
    match.turn.push({ n, m:m||1, counted:n===t && n>0 });
  }
  save(); render();
}
function rgEndTurn(override){
  const g = match.game, L = match.leg, idx = match.cur, p = L.p[idx], t = rgTarget();
  let sc = 0, tag = "";
  if(g==="shanghai"){
    const hits = match.turn.filter(d=>d.n===t);
    sc = hits.reduce((a,d)=>a+t*d.m,0); tag = "+"+sc;
    const ms = new Set(hits.map(d=>d.m));
    if(ms.has(1) && ms.has(2) && ms.has(3)){
      p.total += sc; p.hist.push({score:sc,total:p.total,tag:"SHANGHAI"}); p.turns++; match.turn=[];
      tl({ k:"rg", p:idx, r:L.round, score:sc, tag:"SHANGHAI", total:p.total });
      toast("SHANGHAI!"); finishRG([idx], true); return;
    }
  } else if(g==="baseball"){ sc = match.turn.filter(d=>d.n===t).reduce((a,d)=>a+d.m,0); tag = sc ? `+${sc}` : "0"; }
  else if(g==="golf"){ const last = match.turn[match.turn.length-1]; sc = last.golf.v; tag = last.golf.l; }
  else if(g==="bobs"){
    const val = t===25 ? 50 : 2*t;
    sc = override>0 ? override*val : -val; tag = (sc>0?"+":"")+sc;
  }
  else if(g==="countup"){ sc = override; tag = "+"+sc; }
  else if(g==="hammer"){
    sc = match.turn.reduce((a,d)=>a+(d.v||0),0);
    if(sc>0) tag = "+"+sc;
    else { sc = -3*segVal(t,1); tag = "Hammer "+sc; toast("HAMMER!", true); }
  }
  if(g!=="atc"){
    p.total += sc;
    p.hist.push({ score:sc, total:p.total, tag });
    tl({ k:"rg", p:idx, r:L.round, score:sc, tag, total:p.total });
    if(g==="bobs" && p.total<0){ p.out = true; tl({ k:"out", p:idx }); toast(`${match.players[idx].name} is out!`, true); }
  } else tl({ k:"rg", p:idx, tag: match.turn.map(d=>d.counted ? (d.n===25?"B":d.n) : "–").join(" ") });
  p.turns++; match.turn = [];
  const alive = L.p.filter(q=>!q.out);
  if(!alive.length){ finishRG(); return; }
  nextPlayer();
  const r = rgRounds();
  if(r && alive.every(q=>q.turns>L.round)){
    L.round++;
    if(L.round>=r.length){ finishRG(); return; }
    if(g==="hammer" && match.hWild[L.round]) setTimeout(()=>toast(`Wild: ${r[L.round]===25 ? "Bull" : r[L.round]}`), 900);
  }
}
function hammerMult(k){ const last = match.leg.round>=match.hTargets.length-1; return (last ? [1,3,5] : [1,2,3])[k] || 1; }
function rgRest(){
  if(!match || match.over) return;
  if(match.game==="golf"){ if(match.turn.length){ snapshot(); rgEndTurn(); save(); render(); } return; }
  const who = match.cur;
  while(match.cur===who && match.turn.length<3 && !match.over){ const before = match.turn.length; rgDart(0,0); if(match.turn.length===before) break; }
  if(match.over || match.cur!==who || !match.turn.length) return;
  snapshot(); rgEndTurn(); save(); render();
}
function bobsHits(h){
  if(!match || match.over) return;
  snapshot(); match.leg.p[match.cur].darts += 3; match.turn = [];
  rgEndTurn(h); save(); render();
}
function countupTotal(v){
  entry = "";
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  snapshot(); match.leg.p[match.cur].darts += 3; match.turn = [];
  if(v===180) toast("180!");
  rgEndTurn(v); save(); render();
}
function finishRG(winners, instant){
  const g = match.game, L = match.leg, P = L.p;
  if(!winners){
    const idx = P.map((q,i)=>i);
    if(g==="golf"){ const b = Math.min(...P.map(q=>q.total)); winners = idx.filter(i=>P[i].total===b); }
    else if(g==="bobs"){
      const alive = idx.filter(i=>!P[i].out);
      if(alive.length){ const b = Math.max(...alive.map(i=>P[i].total)); winners = alive.filter(i=>P[i].total===b); }
      else { const b = Math.max(...P.map(q=>q.turns)); winners = idx.filter(i=>P[i].turns===b); }
    }
    else { const b = Math.max(...P.map(q=>q.total)); winners = idx.filter(i=>P[i].total===b); }
  }
  winners.forEach(w=>match.players[w].legsTotal++);
  match.over = { type:"match", winner:winners[0], tie: winners.length>1 ? winners : null, legScore: match.players.map(p=>p.legs), darts:P[winners[0]].darts, instant:!!instant };
  match.turn = [];
}
function rgLast(i){
  const P = match.leg.p[i];
  if(match.game==="atc") return `<span>${P.darts}d</span>`;
  if(P.out) return `<span class="avg">OUT</span>`;
  const h = P.hist[P.hist.length-1];
  return h ? `<span class="${h.score<0?"avg":""}">${esc(h.tag)}</span>` : "";
}
function cricketSummary(){ return { darts: match.turn.map(d=>dartLabel(d.n,d.m)), marks: match.turnMarks }; }
function endCricketTurn(){
  const p = match.leg.p[match.cur];
  p.turns++; p.last = cricketSummary();
  tl({ k:"cr", p:match.cur, marks:match.turnMarks, d:p.last.darts, pts:match.leg.p.map(q=>q.points) });
  if(match.turnMarks>=5) toast(match.turnMarks+" marks!");
  match.turn = []; match.turnMarks = 0; nextPlayer();
}
function killerEndTurn(){
  const p = match.leg.p[match.cur];
  p.turns++; p.last = match.turn.map(d=>dartLabel(d.n,d.m)); tl({ k:"ki", p:match.cur, d:p.last });
  match.turn = []; nextPlayer();
}
function cricketRest(){
  if(!match || match.over) return;
  const g = match.game, fn = g==="killer" ? killerDart : g==="halveit" ? halveDart : throwDart, who = match.cur;
  while(match.cur===who && match.turn.length<3 && !match.over){ const before = match.turn.length; fn(0,1); if(match.turn.length===before) break; }
  if(match.over || match.cur!==who || !match.turn.length) return;
  snapshot();
  if(g==="killer") killerEndTurn(); else if(g==="halveit") endHalveTurn(); else endCricketTurn();
  save(); render();
}

/* ---------- camera scoring: darts sent by camera.html on a phone ----------
   The tablet makes a code (games/{CODE}/cam). The phone writes the live visit to cam/visit
   and each finished visit to cam/turns; we apply finished visits to the current game here. */
const CAM_KEY = "dartsScorer.cam";
let cam = null;          // { code }
let camVisit = null;     // what the camera sees this turn (live)
let camRefs = [], camInfoLast = "";
function camSaved(){ try{ return JSON.parse(localStorage.getItem(CAM_KEY) || "null"); }catch(e){ return null; } }
async function camLink(){
  try{ await fbInit(); }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  if(!user){ msg("Log in first"); return; }
  let code = newCode();
  try{
    for(let k=0;k<6;k++){ const s = await fb.ref(`games/${code}`).get(); if(!s.exists()) break; code = newCode(); }
    await fb.ref(`games/${code}/cam`).set({ host: deviceId, created: firebase.database.ServerValue.TIMESTAMP });
  }catch(e){ msg("Couldn't set up the camera link. Check your connection."); return; }
  cam = { code }; try{ localStorage.setItem(CAM_KEY, JSON.stringify(cam)); }catch(e){}
  await camListen(); render();
}
function camUnlink(){
  camStop();
  if(cam && fb) fb.ref(`games/${cam.code}/cam`).remove().catch(()=>{});
  cam = null; camVisit = null; try{ localStorage.removeItem(CAM_KEY); }catch(e){}
  render();
}
function camStop(){ camRefs.forEach(r=>r.off()); camRefs = []; }
async function camListen(){
  camStop(); if(!cam || !fb) return;
  const base = fb.ref(`games/${cam.code}/cam`), turns = base.child("turns"), live = base.child("visit");
  try{ await turns.remove(); }catch(e){}          // drop anything left over from before
  live.on("value", s=>{ camVisit = s.val(); if(screen==="game") render(); });
  turns.on("child_added", s=>{ const t = s.val(); s.ref.remove().catch(()=>{}); camVisit = null; if(t) camApply(Object.values(t.darts || {})); });
  camRefs = [live, turns]; camInfoLast = "";
}
cam = camSaved();
(function camWait(){ if(!cam) return; if(fb && user) camListen(); else setTimeout(camWait, 1000); })();

// tell the camera phone who is up
function camInfo(){
  if(!cam || !fb || !user) return;
  const o = { name:"", line:"" };
  try{
    if(screen==="game" && match && !match.over){
      const g = match.game; o.name = whoName();
      if(match.cork) o.line = "Bull-off: enter on the scoreboard";
      else if(is01(g)) o.line = `${match.leg.p[match.cur].score} left`;
      else if(isCO(g)) o.line = `${match.leg.p[match.cur].left} left`;
      else if(g==="killer") o.line = match.leg.phase==="play" ? "Killer" : "Throw for your number";
      else if(g==="halveit") o.line = `Target ${halveTarget()}`;
      else if(isRG(g)){ const t = rgTarget(); o.line = `${shortName(g)} · aiming at ${t===25 ? "Bull" : t}`; }
      else o.line = shortName(g);
    } else o.line = match && match.over ? "Game over" : "No game running";
  }catch(e){}
  const k = JSON.stringify(o); if(k===camInfoLast) return; camInfoLast = k;
  fb.ref(`games/${cam.code}/cam/info`).set(o).catch(()=>{});
}
function camChip(){
  if(!cam) return "";
  const ds = camVisit && camVisit.darts ? Object.values(camVisit.darts) : [];
  const tn = camVisit && camVisit.turn ? `#${camVisit.turn} ` : "";
  return ` <span class="camchip">📷 ${tn}${ds.length ? ds.map(d=>dartLabel(+d.n, +d.m)).join(" ") : "ready"}</span>`;
}
function camSettingsHtml(){
  const url = location.href.split("#")[0].split("?")[0].replace(/[^/]*$/, "") + "camera.html";
  return `<div class="label">Camera scoring (beta)</div>
    <div class="card">
      ${cam ? `<strong>Linked · code ${esc(cam.code)}</strong>
        <div class="hint">On the camera phone, open the camera page and enter this code. The darts it sees go into the game on this device when the darts are pulled out or Next is tapped on the phone. You can still fix anything here with Undo.</div>
        <button type="button" class="secondary" data-act="camOff">Unlink camera</button>`
      : `<div class="hint">Score automatically with a phone's camera pointed at the board. Tap below to get a code, then open the camera page on the phone (logged in to the same account) and type it in.</div>
        <button type="button" class="primary" data-act="camLink">Link a camera</button>`}
      <div class="hint">Camera page: <a href="camera.html" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\//, ""))}</a></div>
    </div>`;
}
// apply one finished camera visit (up to 3 darts {n,m}) to whatever game is on
function camApply(darts){
  if(screen!=="game" || !match || match.over){ msg("Camera darts arrived, but no game is running"); return; }
  if(online && !isMyTurn()){ msg("Camera darts ignored: it isn't this device's turn"); return; }
  if(match.cork || pending || coAsk || ddAsk){ msg("Answer the question on screen, then enter that turn by hand"); return; }
  if(match.turn && match.turn.length){ msg("Darts already entered by hand this turn, so the camera's turn was skipped"); return; }
  if(entry){ entry = ""; }
  const ds = darts.slice(0,3).map(d=>({ n:+d.n||0, m:+d.m||0 })).map(d=>d.n && d.m ? d : { n:0, m:0 });
  const sum = ds.reduce((a,d)=>a+segVal(d.n,d.m), 0);
  const g = match.game, who = match.cur;
  const rest = fn => { if(!match.over && match.cur===who) fn(); save(); render(); };
  if(is01(g)){
    const p = match.leg.p[who], dbl = match.opts.outMode==="double", rem = p.score;
    let isIn = p.isIn, total = 0, atDbl = 0;
    // darts at the double: thrown while what's left could be finished with one double
    const dd = fn => { fn(); if(ddAsk && match){ answerDD(Math.max(ddAsk.min, Math.min(ddAsk.max, atDbl))); } };
    for(let k=0;k<ds.length;k++){
      const d = ds[k], now = rem - total;
      if(isIn && (now===50 || (now<=40 && now%2===0))) atDbl++;
      if(!isIn){ if(d.m===2) isIn = true; else continue; }
      total += segVal(d.n, d.m);
      const left = rem - total;
      if(left===0){ if(dbl && d.m!==2) return camBust(atDbl); return dd(()=>finish(k+1)); }
      if(left<0 || (dbl && left===1)) return camBust(atDbl);
    }
    return dd(()=>submitScore(total));
  }
  if(isCO(g)){
    const left = match.leg.p[who].left, room = coMaxDarts(g) - match.leg.p[who].used;
    let total = 0;
    for(let k=0;k<ds.length;k++){
      total += segVal(ds[k].n, ds[k].m);
      if(total===left){ if(ds[k].m===2 && k+1<=room) return coFinish(k+1); return coVisit(180); }
      if(total>left || left-total===1) return coVisit(180);
    }
    return coVisit(total);
  }
  if(g==="killer"){
    if(match.leg.phase!=="play"){ const d = ds.find(x=>x.n); if(d) pickNumber(d.n); else msg("No number seen. Throw again or pick it on screen."); return; }
    for(const d of ds){ if(match.over || match.cur!==who) break; killerDart(d.n, d.m||1); }
    return rest(cricketRest);
  }
  if(g==="halveit"){
    const t = halveTarget();
    if(t==="EVEN" || t==="ODD") return halveTotal(sum);
    if(t==="CHOICE" && !match.choice){ msg("Pick the Choice number on screen, then enter the darts"); return; }
    for(const d of ds){ if(match.cur!==who) break; halveDart(d.n, d.m||1); }
    return rest(cricketRest);
  }
  if(isRG(g)){
    const t = rgTarget();
    if(g==="bobs") return bobsHits(ds.filter(d=>d.n===t && d.m===2).length);
    if(g==="countup") return countupTotal(sum);
    for(const d of ds){
      if(match.over || match.cur!==who) break;
      if(g==="golf") rgDart(d.n===t ? t : 0, d.n===t ? d.m : 0);
      else if(g==="atc"){ const tt = rgTarget(); rgDart(d.n===tt ? tt : 0, 1); }
      else rgDart(d.n, d.m||1);
    }
    return rest(rgRest);
  }
  for(const d of ds){ if(match.over || match.cur!==who) break; throwDart(d.n, d.m||1); }   // cricket, cut-throat
  rest(cricketRest);
}
function camBust(atDbl){
  const L = match.leg, i = match.cur, p = L.p[i], rem = p.score;
  snapshot();
  p.darts += 3; p.turns++;
  L.log.push({ i, v:0, left:rem, bust:true }); toast("Bust", true);
  const li = tl({ k:"01", p:i, v:0, bust:true, start:rem, left:rem });
  if(match.opts.outMode==="double" && rem<=50 && checkout(rem,3,true) && profilesOn() && prefs.ddAsk && match.tlog[li]) match.tlog[li].dd = Math.min(3, atDbl||0);
  nextPlayer(); save(); render();
}

/* legs, sets, match */
function endLeg(w, info){
  const L = match.leg;
  tl({ k:"leg", p:w, darts: L.p[w].darts, g: match.game });
  match.players.forEach((pl,i)=>{
    pl.cDarts += L.p[i].darts;
    pl.cScore += is01(match.game) ? (+match.game - L.p[i].score) : match.game==="killer" ? L.p[i].taken : L.p[i].hits;
  });
  if(match.game==="killer") match.lastNums = L.p.map(q=>q.num);
  const pl = match.players[w];
  pl.legs++; pl.legsTotal++;
  const result = Object.assign({ type:"leg", winner:w, legScore: match.players.map(p=>p.legs) }, info);
  if(pl.legs >= firstTo(match.opts.legs)){
    pl.sets++; result.type = "set"; result.setScore = match.players.map(p=>p.sets);
    match.players.forEach(p=>p.legs=0);
    if(pl.sets >= firstTo(match.opts.sets)) result.type = "match";
  }
  match.over = result; match.turn = []; match.turnMarks = 0;
}
function medleyKind(legNo){ const max = match.opts.legs; return legNo>=max ? "choice" : legNo%2 ? "501" : "cricket"; }
function nextLeg(){
  if(!match.over || match.over.type==="match") return;
  snapshot();
  if(match.over.type==="set"){ match.setNo++; match.legNo = 1; } else match.legNo++;
  match.legStarter = (match.legStarter+1) % match.players.length;
  match.cur = match.legStarter;
  if(match.base==="medley"){
    const kind = medleyKind(match.legNo);
    if(kind==="choice"){ match.cork = { stage:"who" }; save(); render(); return; }
    match.game = kind;
  }
  match.leg = newLeg(); match.over = null; match.turn = []; match.turnMarks = 0;
  save(); render();
}
function corkWinner(i){
  if(!match.cork) return;
  snapshot();
  if(match.cork.start){
    match.cork = null; match.legStarter = i; match.cur = i;
    match.leg = newLeg(); match.turn = []; match.turnMarks = 0;
    if(match.game==="killer") advancePick();
    toast(`${match.players[i].name} throws first`);
  } else match.cork = { stage:"pick", winner:i };
  save(); render();
}
function corkGame(g){
  if(!match.cork || match.cork.winner===undefined) return;
  snapshot();
  const w = match.cork.winner;
  match.game = g; match.legStarter = w; match.cur = w; match.cork = null;
  match.leg = newLeg(); match.over = null; match.turn = []; match.turnMarks = 0;
  save(); render();
}

/* ---------- stats ---------- */
function avgFor(i){
  const pl = match.players[i], P = match.leg.p[i], live = !match.over;
  if(match.game==="c121") return P.best ? `Best ${P.best}` : "–";
  if(match.game==="catch40") return `${P.pts}/120`;
  const darts = pl.cDarts + (live ? P.darts : 0);
  if(match.game==="killer") return pl.cScore + (live ? P.taken : 0);
  if(match.game==="halveit") return P.total;
  if(match.game==="atc") return P.pos>=ATC_T.length ? `${P.darts} darts` : `${P.pos}/21`;
  if(match.game==="bobs" && P.out) return "Out";
  if(isRG(match.game)) return P.total;
  const score = pl.cScore + (live ? (is01(match.game) ? (+match.game - P.score) : P.hits) : 0);
  return darts ? score/darts*3 : 0;
}

/* ---------- rules ---------- */
function rulesFor(g, o){
  const lives = o.lives || 3;
  if(g==="c121") return [
    "A checkout ladder. Start on 121. You get 9 darts (3 visits) to check it out, finishing on a double.",
    "Finish it and you move up one (122, 123…). Miss and you drop back one.",
    "Banker: check out in 3 darts or fewer and that number is locked in. You can never drop below it.",
    "Bust (going below 0 or leaving 1) scores nothing for that visit and uses its 3 darts.",
    "Keep climbing until you check out 170 or tap End game. Your score is the highest number you checked out.",
    "Solo or as a team: with more than one player, everyone shares one ladder and takes turns, one visit each."
  ];
  if(g==="catch40") return [
    "Check out every number from 61 to 100 in order: 40 checkouts, each finishing on a double.",
    "You get 6 darts (2 visits) for each number, then move on whether you finished it or not.",
    "Points for each finish: 2 darts = 3 points, 3 darts = 2 points, 4 to 6 darts = 1 point, not finished = 0.",
    "Bust (going below 0 or leaving 1) scores nothing for that visit and uses its 3 darts.",
    "The maximum is 120. Most points wins."
  ];
  if(is01(g)) return [
    `Everyone starts on ${g}. Each turn you throw 3 darts and their total comes off your score.`,
    o.inMode==="double" ? "Double in: your score doesn't start dropping until you hit a double. That double and everything after it counts." : "Straight in: every dart counts from the first throw.",
    o.outMode==="double" ? "Double out: you must finish on exactly 0, and the last dart must be a double (the bull counts as a double)." : "Straight out: finish on exactly 0 with any dart.",
    o.outMode==="double" ? "Bust: go below 0, land on exactly 1, or reach 0 without a double, and the turn scores nothing." : "Bust: go below 0 and the turn scores nothing.",
    "First to 0 wins the leg. Win the most legs to take the set, and the most sets to take the match."
  ];
  if(g==="cricket") return [
    "The numbers in play are 15 through 20 and the bull. Hit a number 3 times to close it: a single is 1 mark, a double 2, a triple 3. Outer bull is 1 mark, inner bull 2.",
    o.points ? "Once you've closed a number, extra hits score its value as points for you, as long as at least one opponent hasn't closed it yet." : "No points: extra hits on a closed number don't score.",
    o.points ? "Close all 7 targets with at least as many points as everyone else to win." : "First to close all 7 targets wins."
  ];
  if(g==="cutthroat") return [
    "Marks work like Cricket: close 15 through 20 and the bull by hitting each 3 times.",
    "Once you've closed a number, extra hits add points to every opponent who hasn't closed it. Points are bad in this game.",
    "Close all 7 targets with points equal to or lower than everyone else to win. Lowest score wins."
  ];
  if(g==="killer") return [
    "Each player throws for a number at the start of the game (1–20 or the bull). No two players can share one.",
    `Every hit on your own number builds lives: a single is 1, a double 2, a triple 3. Single and double bull both count for the bull.`,
    `Land on exactly ${lives} lives to become a killer. Going over ${lives} knocks you out, killer or not.`,
    "Killers attack by hitting other players' numbers, taking 1, 2 or 3 lives. A killer can't attack a player who hasn't had their first turn yet.",
    `A killer who hits their own number is out. Drop below ${lives} and you lose killer status until you build back up.`,
    "You're out once you're taken below 0 lives (a player on 2 lives needs 3 hits to be out). Last player standing wins."
  ];
  if(g==="halveit") return [
    "12 rounds, in order: 20, Even, 19, Odd, 18, Triple, 17, Double, 16, Choice, 15, Bull. Everyone starts on 0.",
    "Number rounds: score what you hit on that number (single, double or triple).",
    "Even and Odd: your whole 3-dart total counts if it's even (or odd).",
    "Triple and Double: any triple (or any double) scores its value.",
    "Choice: call a number before you throw. Only that number counts.",
    "Score nothing in a round and your total is cut in half, rounded up. Highest total after the Bull round wins."
  ];
  if(g==="medley") return [
    `A match of 501 and Cricket legs, best of ${Math.max(3, (o.legs||3)|1)} legs${(o.sets||1)>1 ? ` per set, best of ${o.sets} sets` : ""}.`,
    "Leg 1 is 501, leg 2 is Cricket, and they keep alternating.",
    "If it comes down to the last leg, everyone throws one dart at the bull. Closest wins, chooses 501 or Cricket, and throws first.",
    `501 legs: ${o.inMode==="double" ? "double in" : "straight in"}, ${o.outMode==="double" ? "double out" : "straight out"}. Cricket legs: ${o.points===false ? "no points" : "with points"}.`,
    "Win the most legs to take the match."
  ];
  if(g==="hammer") return [
    "8 rounds of 3 darts: 20, 19, 18, Wild, 17, 16, 15, Wild. Wild rounds pick a random target from 12 to 20 or the bull.",
    o.hammerMode==="masters" ? "Masters: only triples on the round's number count (the double bull on a bull round)." : "Open: singles, doubles and triples on the round's number all count. Outer bull is 25, inner bull 50.",
    "Your darts count in the order you throw them: dart 1 scores what it hits, dart 2 scores double that, dart 3 triple. A triple 20 with your third dart is worth 180.",
    "Final round: dart 2 is worth ×3 and dart 3 is worth ×5.",
    "Miss with all three darts and the hammer falls: you lose three times the round's number (60 on the 20s, 75 on a bull).",
    "Highest total after 8 rounds wins."
  ];
  if(g==="shanghai") return [
    `${o.shRounds} rounds. Round 1 aims at 1, round 2 at 2, and so on up to ${o.shRounds}.`,
    "Only the round's number scores: a single is face value, a double twice that, a triple three times.",
    "Hit a single, a double and a triple of the number in one turn (a Shanghai) and you win on the spot.",
    "Otherwise the highest total after the last round wins."
  ];
  if(g==="baseball") return [
    "9 innings. Inning 1 aims at 1, inning 2 at 2, and so on up to 9.",
    "Each hit on the inning's number scores runs: a single is 1, a double 2, a triple 3.",
    "Most runs after 9 innings wins. Equal runs end as a tie."
  ];
  if(g==="golf") return [
    "9 holes. Hole 1 aims at 1, hole 2 at 2, and so on up to 9.",
    "Throw up to 3 darts per hole. Your last dart is your score: double 1, triple 2, single 3, miss 5.",
    "You can stop after any dart to keep that score, so a double on your first dart is worth keeping.",
    "Lowest total after 9 holes wins."
  ];
  if(g==="atc") return [
    "Hit 1 through 20 in order, then the bull.",
    "A single, double or triple of your target all count, and move you on to the next number.",
    "First to hit the bull wins. On your own, try to finish in as few darts as you can."
  ];
  if(g==="bobs") return [
    "A doubles drill. Everyone starts on 27.",
    "21 rounds: D1, D2 and so on up to D20, then the double bull. Throw 3 darts at the round's double.",
    "Each hit adds the double's value (a hit on D5 adds 10, double bull adds 50).",
    "Miss with all 3 darts and you lose the double's value instead.",
    "Drop below 0 and you're out. Highest score at the end wins."
  ];
  if(g==="countup") return [
    `${o.cuRounds} rounds of 3 darts. Add up everything you score.`,
    "Highest total wins. A good way to practise scoring on the treble 20."
  ];
  return [];
}

function modeText(){
  const o = match.opts;

  if(isRG(match.game)){
    if(match.game==="countup") return "ANY";
    if(match.game==="hammer"){ const r = Math.min(match.leg.round, match.hTargets.length-1); return (match.hWild[r] ? "WILD " : "") + (rgTarget()===25 ? "BULL" : rgTarget()); }

    if(match.game==="bobs") return t===25 ? "D-BULL" : "D"+t;
    if(match.game==="atc") return t===25 ? "BULL" : String(t);
    return match.game==="golf" ? "HOLE" : match.game==="baseball" ? "INNING" : "TARGET";
  }
  if(match.game==="halveit"){ const t = HALVE[Math.min(match.leg.round,11)]; return t==="CHOICE" && match.choice ? `CHOICE: ${match.choice===25?"BULL":match.choice}` : String(t); }
  if(!is01(match.game)) return o.points ? "PTS" : "NO PTS";
  return (o.inMode==="double"?"DI":"SI") + (o.outMode==="double"?" · DO":" · SO");
}
function roundNo(){ if(isCO(match.game)) return Math.min(match.leg.p[match.cur].att+1, coAttempts(match));
  if(isRG(match.game)){ const r = rgRounds(); return r ? Math.min(match.leg.round, r.length-1)+1 : match.leg.p[match.cur].turns+1; }

function overText(){

/* Killer: the Reaper plays a random death over a knocked-out player's row (dth is picked by the device that scored it, so online players see the same one) */
let deathSeen = null;
function deathCheck(){
  if(!match){ deathSeen = null; return; }
  const n = (match.tlog||[]).length, now = { id:match.id, n }, prev = deathSeen; deathSeen = now;
  if(!prev || prev.id!==now.id || !prefs.deaths || match.game!=="killer" || n<=prev.n || n-prev.n>3) return;
  match.tlog.slice(prev.n).forEach(e=>{
    if(e.k!=="out" || e.dth===undefined || !match.leg.p[e.p]) return;
    const p = e.p, num = match.leg.p[p].num;
    setTimeout(()=>Reaper.play(num, e.dth, ()=>{ const el = document.querySelector(`.kr[data-ki="${p}"]`); return el && el.getBoundingClientRect(); }), 0);
  });
}
let callSeen = null;
function callerCheck(){
  if(!match){ callSeen = null; return; }
  const n = (match.tlog||[]).length;
  const overKey = match.over ? `${match.setNo}.${match.legNo}.${match.over.type}.${match.over.winner}` : "";
  const now = { id:match.id, n, overKey, cur:match.cur, leg:`${match.setNo}.${match.legNo}` };
  const prev = callSeen; callSeen = now;
  if(!prev || prev.id!==now.id || prefs.caller==="off") return;
  const said = [];
  if(n>prev.n && n-prev.n<=3) match.tlog.slice(prev.n).forEach(e=>{ const t = callText(e, prefs.caller); if(t) said.push(t); });
  if(overKey && overKey!==prev.overKey) said.push(overText());
  else if(!match.over && is01(match.game) && (now.cur!==prev.cur || now.leg!==prev.leg)){
    const P = match.leg.p[match.cur], dbl = match.opts.outMode==="double";
    if(P && P.isIn!==false && P.score<=170 && checkout(P.score,3,dbl)) said.push(`${whoName()}, you require ${P.score}`);
  }
  speak(said);
}

function render(){
  if(cam) setTimeout(camInfo, 0);
  if(screen==="setup" && lastScreen!=="setup" && lastScreen!=="settings") setupStep = 1;
  lastScreen = screen;
  if(screen==="game" && match){
    renderGame();
    fitGame();
    callerCheck();
    deathCheck();
    if(online && !match.over && !isMyTurn()){
      const dock = app.querySelector(".dock");
      if(dock){ dock.classList.add("locked"); dock.insertAdjacentHTML("beforeend", `<div class="lockmsg">Waiting for ${esc(whoName())}…</div>`); }
    }
  } else if(screen==="loading") app.innerHTML = `<div class="wrap narrow"><h1><span class="ring" aria-hidden="true"></span>Darts Scorer</h1><div class="hint">Loading…</div></div>`;
  else if(screen==="auth") renderAuth();
  else if(screen==="home" && profilesOn()) renderHome();
  else if(screen==="players" && profilesOn()) renderPlayers();
  else if(screen==="settings") renderSettings();
  else renderSetup();
}

/* ---------- events ---------- */
app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  const d = b.dataset;
  if(d.theme!==undefined){
    if(d.theme==="custom"){ if(theme.preset!=="custom") theme = { preset:"custom", custom:{...themeColors(theme)} }; }
    else theme = { preset:d.theme, custom:theme.custom };
    if(theme.custom) delete theme.custom.neon, delete theme.custom.id, delete theme.custom.name, delete theme.custom.note;
    saveTheme(); render(); return;
  }
  if(d.act==="settings"){ settingsFrom = screen; screen = "settings"; window.scrollTo(0,0); render(); return; }
  if(d.act==="settingsBack"){ screen = settingsFrom==="settings" ? "setup" : settingsFrom; render(); return; }
  if(d.act==="camLink"){ camLink(); return; }
  if(d.act==="camOff"){ camUnlink(); return; }
  if(d.act==="deathPreview"){ const nums=[...Array(20).keys()].map(k=>k+1).concat([25]); Reaper.play(nums[Math.floor(Math.random()*21)], Math.floor(Math.random()*Reaper.count()), ()=>{ const b=document.querySelector('[data-act="deathPreview"]'); return b && b.getBoundingClientRect(); }); return; }
  if(d.act==="themeReset"){ theme = { preset:"icon" }; saveTheme(); render(); return; }
  if(d.pref!==undefined){
    const v = d.val==="true" ? true : d.val==="false" ? false : d.val;
    if(d.pref==="startWith" && v==="default" && !prefs.defaults){ msg("Save a default setup first"); return; }
    prefs[d.pref] = v; savePrefs(); render();
    if(d.pref==="caller" && v!=="off") speak(["Caller on"]);
    if(d.pref==="rate" || d.pref==="pitch") speak(["One hundred and forty"]);
    if(d.pref==="sound" || d.pref==="vibrate") tapFeedback();
    return;
  }
  if(d.act==="testVoice"){ if(!("speechSynthesis" in window)){ msg("This device doesn't support a voice"); return; } speak(["One hundred and eighty!", `${(settings.players[0]||"Ryan").trim() || "Ryan"}, you require 40`]); return; }
  if(d.act==="quickReset"){ prefs.quick = null; savePrefs(); render(); return; }
  if(d.act==="saveDefault"){ prefs.defaults = JSON.parse(JSON.stringify(settings)); savePrefs(); render(); msg("Saved as your default setup"); return; }
  if(d.act==="clearDefault"){ prefs.defaults = null; prefs.startWith = "last"; savePrefs(); render(); return; }
  if(prefs.wake && !wakeLock) syncWake();
  if(screen==="game" && (prefs.sound || prefs.vibrate) && b.closest(".dock,.board,.cg,.ov")) tapFeedback();
  if(d.claim!==undefined){
    const i = +d.claim;
    if(dialog==="join" && joinState){
      const owner = joinState.claims[i]; if(owner && owner!==deviceId) return;
      if(joinState.pick.includes(i)){ joinState.pick = joinState.pick.filter(x=>x!==i); delete joinState.links[i]; }
      else { joinState.pick = joinState.pick.concat([i]); if(!Object.values(joinState.links).includes(meKey())) joinState.links[i] = meKey(); }
      render();
    } else toggleClaim(i);
    return;
  }
  if(d.dd!==undefined){ answerDD(+d.dd); return; }
  if(d.career){ showCareer(d.career); return; }
  if(d.tab){ authTab = d.tab; authMsg = ""; render(); return; }
  if(d.edit){ const p = personByKey(d.edit); editing = { key:d.edit, name:p.name, email:p.email }; dialog = "edit"; render(); return; }
  if(d.reset){ const p = personByKey(d.reset); askConfirm(`This deletes every saved session for ${p.name}. Their stats start again from zero.`, "Reset stats", async()=>{ await fb.ref(`${basePath(d.reset)}/history`).remove(); msg(`${p.name}'s stats were reset`); }); return; }
  if(d.del){ const p = personByKey(d.del); askConfirm(`This deletes ${p.name} and all of their stats.`, "Delete player", async()=>{ await fb.ref(basePath(d.del)).remove(); msg(`${p.name} was deleted`); }); return; }
  if(d.delhist){ const key = careerView.key, sid = d.delhist; askConfirm("This removes that session's games from these stats.", "Remove session", async()=>{ await fb.ref(`${basePath(key)}/history/${sid}`).remove(); await showCareer(key); }); return; }
  if(online && screen==="game" && match){
    const free = ["quit","rules","closeRules","closeDlg","toSetup","share","copyInvite","nextLeg","rematch","undo","endConfirm","endSession","closeSummary","nextGame","doConfirm","cancelEdit","home","corkWin","corkGame","rematchGo"];
    if(d.act==="undo" || (d.act==="back" && !entry)){
      if(match.by!==deviceId){ msg("Only the phone that entered the last score can undo it"); return; }
    } else if(!free.includes(d.act) && !match.over && !isMyTurn()){ msg(`It's ${match.players[match.cur].name}'s turn`); return; }
  }
  if(d.team!==undefined){ const t = settings.teamOf = settings.teamOf || []; settings.players.forEach((_,i)=>{ if(!Number.isInteger(t[i])) t[i] = teamOfP(i); }); t[+d.team] = +d.tv; save(); render(); return; }
  if(d.step!==undefined){ setupStep = +d.step; window.scrollTo(0,0); render(); return; }
  if(d.quick){
    const base = { sets:1, legs:3, inMode:"straight", outMode:"double", points:true };
    if(d.quick==="default" && prefs.defaults) Object.assign(settings, JSON.parse(JSON.stringify(prefs.defaults)));
    else if(d.quick!=="last") Object.assign(settings, base, { game:d.quick });
    setupStep = 3; save(); window.scrollTo(0,0); render(); return;
  }
  if(d.set==="game"){ settings.game = d.val; save(); setupStep = hasOptionsStep(d.val) ? 2 : 3; window.scrollTo(0,0); render(); return; }
  if(d.set==="teams"){ settings.teams = d.val; settings.teamOf = []; if(!["bull","random"].includes(settings.firstThrow)) settings.firstThrow = "0"; save(); render(); return; }
  if(d.set){ settings[d.set] = d.set==="points" ? d.val==="true" : ["lives","shRounds","cuRounds","coAttempts"].includes(d.set) ? +d.val : d.val; save(); render(); return; }
  if(d.cat){ const c = CATS.find(x=>x[0]===d.cat); if(catOf(settings.game)!==d.cat) settings.game = c[2][0]; save(); render(); return; }
  if(d.rg!==undefined){ rgDart(+d.rg, +d.m); return; }
  if(d.bobs!==undefined){ bobsHits(+d.bobs); return; }
  if(d.pick){ pickNumber(+d.pick); return; }
  if(d.kn!==undefined){ killerDart(+d.kn, +d.m); return; }
  if(d.hm){ mod = +d.hm; render(); return; }
  if(d.hd!==undefined){ halveDart(+d.hd, d.hmm ? +d.hmm : mod); return; }
  if(d.ch){ pickChoice(+d.ch); return; }
  if(d.step){
    if(d.step==="legs" && settings.game==="medley") settings.legs = Math.min(15, Math.max(3, (settings.legs|1) + 2*(+d.d)));
    else settings[d.step] = Math.min(15, Math.max(1, settings[d.step] + +d.d));
    save(); render(); return;
  }
  if(d.rm){
    const rm = +d.rm, ft = settings.firstThrow;
    settings.players.splice(rm,1); (settings.links||[]).splice(rm,1); (settings.teamOf||[]).splice(rm,1);
    if(ft!=="bull" && ft!=="random"){ if(+ft===rm) settings.firstThrow = "0"; else if(+ft>rm) settings.firstThrow = String(+ft-1); }
    save(); render(); return;
  }
  if(d.cofin!==undefined){ coFinish(+d.cofin); return; }
  if(d.digit!==undefined){ calcKey(d.digit); render(); return; }
  if(d.op!==undefined){ calcKey(d.op); render(); return; }
  if(d.score!==undefined){ submitScore(+d.score); return; }
  if(d.fin){ finish(+d.fin); return; }
  if(d.n!==undefined){ throwDart(+d.n, +d.m); return; }
  switch(d.act){
    case "addp": settings.players.push(`Player ${settings.players.length+1}`); (settings.links = settings.links || [])[settings.players.length-1] = null; save(); render();
      setTimeout(()=>{ const el=document.getElementById(`pl-${settings.players.length-1}`); if(el){ el.focus(); el.select(); } },0); break;
    case "start": goOffline(); preparePids().then(()=>startMatch()); break;
    case "startNext": { startMatch(keepOf(match.players)); break; }
    case "backToGame": screen = "game"; render(); break;
    case "nextGame": dialog = null; screen = "setup"; render(); break;
    case "endConfirm": dialog = "endConfirm"; render(); break;
    case "endSession": endSession(); break;
    case "stepBack": setupStep = setupStep===3 && !hasOptionsStep(settings.game) ? 1 : Math.max(1, setupStep-1); if(setupStep===0) setupStep = 1; window.scrollTo(0,0); render(); break;
    case "endSessionKeep": endKeep = true; endSession(); break;
    case "endSessionDrop": endKeep = false; endSession(); break;
    case "abandon": dialog = "abandon"; render(); break;
    case "abandonKeep": case "abandonDrop": { const keep = d.act==="abandonKeep"; abandonMatch(keep); dialog = null; screen = profilesOn() ? "home" : "setup"; render(); msg(keep ? "Stats saved to tonight's session" : "Match ended"); break; }
    case "closeSummary": dialog = null; summaryHtml = null; screen = profilesOn() ? "home" : "setup"; render(); break;
    case "resume": goOffline(); screen = "game"; render(); break;
    case "forgot": doAuth("forgot"); break;
    case "google": googleLogin(); break;
    case "logout": askConfirm("You'll need your email and password to log back in.", "Log out", async()=>{ goOffline(); await firebase.auth().signOut(); }); break;
    case "home": dialog = null; screen = "home"; render(); break;
    case "modeLocal": mode = "local"; goOffline(); screen = "setup"; if(!(settings.links||[]).some(Boolean) && meKey()) setLink(0, meKey()); render(); break;
    case "modeOnline": mode = "online"; screen = "setup"; if(!(settings.links||[]).some(Boolean) && meKey()) setLink(0, meKey()); render(); break;
    case "players": screen = "players"; render(); break;
    case "newGuest": editing = { key:null, name:"", email:"" }; dialog = "edit"; render(); break;
    case "cancelEdit": editing = null; dialog = joinState ? "join" : null; render(); break;
    case "doConfirm": { const c = confirmAct; confirmAct = null; dialog = null; render(); if(c) Promise.resolve(c.run()).catch(()=>msg("Couldn't do that. Check your connection.")).then(()=>render()); break; }
    case "host": hostOnline(); break;
    case "join": { const el = document.getElementById("joincode"); lookupGame(el ? el.value : ""); break; }
    case "confirmJoin": confirmJoin(); break;
    case "rejoin": rejoinOnline(); break;
    case "forget": goOffline(); render(); break;
    case "share": dialog = "share"; render(); break;
    case "copyInvite": {
      const text = `Join my darts game: ${location.href.split("#")[0]} (code ${online ? online.code : ""})`;
      try{ navigator.clipboard.writeText(text).then(()=>msg("Invite copied"), ()=>msg(text)); }catch(err){ msg(text); }
      break;
    }
    case "undo": undo(); break;
    case "back": if(entry){ entry = entry.slice(0,-1); render(); } else undo(); break;
    case "enter": if(entry){ const v = entryValue(); if(v!==null) submitScore(v); } break;
    case "crest": if(isRG(match.game)) rgRest(); else cricketRest(); break;
    case "rules": dialog = "rules"; render(); break;
    case "closeRules": dialog = screen==="game" ? "quit" : null; render(); break;
    case "rand": randomPick(); break;
    case "reuse": reuseNumbers(); break;
    case "cancelFin": pending = null; render(); break;
    case "cancelCo": coAsk = null; render(); break;
    case "coEnd": askConfirm(`End the game now? ${match.teams ? "Your team's" : "Your"} highest checkout is the score. It counts as a finished game.`, "End game", ()=>{ snapshot(); coNext(true); save(); render(); }); break;
    case "nextLeg": nextLeg(); break;
    case "corkWin": corkWinner(+d.i); break;
    case "corkGame": corkGame(d.g); break;
    case "quit": dialog = "quit"; render(); break;
    case "closeDlg": dialog = null; render(); break;
    case "toSetup": dialog = null; screen = profilesOn() ? "home" : "setup"; stopListening(); online = null; remoteClaims = {}; render(); break;
    case "rematch": dialog = "rematch"; render(); break;
    case "rematchGo": {
      const pv = match;
      Object.assign(settings, { game:pv.base||pv.game, inMode:pv.opts.inMode, outMode:pv.opts.outMode, points:pv.opts.points, lives:pv.opts.lives||3, hammerMode:pv.opts.hammerMode||"open", shRounds:pv.opts.shRounds||settings.shRounds, cuRounds:pv.opts.cuRounds||settings.cuRounds, sets:pv.opts.sets, legs:pv.opts.legs, players:pv.players.map(p=>p.name), firstThrow:d.ft });
      if(pv.teams){ const flat = pv.players.flatMap((p,k)=>(p.members||[{ name:p.name }]).map(m=>({ name:m.name, k })));
        Object.assign(settings, { players: flat.map(x=>x.name), teams: String(pv.players.length), teamOf: flat.map(x=>x.k) }); }
      dialog = null;
      startMatch(keepOf(pv.players)); break;
    }
  }
});
app.addEventListener("input", e=>{
  const t = e.target, d = t.dataset;
  if(d.tc!==undefined){
    if(theme.preset!=="custom"){ const c = themeColors(theme); theme = { preset:"custom", custom:{ accent:c.accent, hl:c.hl, bg:c.bg } }; }
    theme.custom[d.tc] = t.value; saveTheme();
    app.querySelectorAll(".theme").forEach(x=>x.classList.toggle("on", x.dataset.theme==="custom"));
    const cs = app.querySelector('.theme[data-theme="custom"] .sws'); if(cs){ const k = ["accent","hl","bg"]; cs.querySelectorAll(".sw").forEach((x,i)=>x.style.background = theme.custom[k[i]]); }
    const w = app.querySelector("#tcwarn"); if(w) w.textContent = lumHex(theme.custom.accent) > .4 ? "This main colour is very light, so white text on it may be hard to read." : "";
    return;
  }
  if(d.pl===undefined) return;
  settings.players[+d.pl] = t.value;
  const chip = app.querySelector(`.seg.first button[data-val="${d.pl}"]`); if(chip) chip.textContent = t.value.trim() || `Player ${+d.pl+1}`;
  save();
});
app.addEventListener("change", e=>{
  const t = e.target, d = t.dataset;
  if(d.voice!==undefined){ prefs.voice = t.value; savePrefs(); speak(["One hundred and eighty!"]); return; }
  if(d.qs!==undefined){
    const i = +d.qs, v = Math.round(+t.value);
    if(t.value==="" || !POSSIBLE.has(v)){ msg(`${t.value || "That"} can't be scored with 3 darts`); t.value = qs(i); return; }
    prefs.quick = QS_DEF.map((x,k)=>qs(k)); prefs.quick[i] = v; savePrefs(); return;
  }
  if(d.link!==undefined){
    const i = +d.link;
    if(t.value==="new"){ editing = { key:null, name:"", email:"", forRow:i }; dialog = "edit"; render(); return; }
    setLink(i, t.value || null); render(); return;
  }
  if(d.jl!==undefined && joinState){
    const i = +d.jl;
    if(t.value==="new"){ editing = { key:null, name:"", email:"", forJoin:i }; dialog = "edit"; render(); return; }
    Object.keys(joinState.links).forEach(k=>{ if(t.value && joinState.links[k]===t.value && +k!==i) delete joinState.links[k]; });
    joinState.links[i] = t.value || null; render();
  }
});
app.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="authform") doAuth(authTab==="signup" ? "signup" : "login");
  if(e.target.id==="editform") saveEditing();
});
document.addEventListener("keydown", e=>{
  if(screen!=="game" || !match || dialog || e.target.tagName==="INPUT") return;
  if((e.ctrlKey||e.metaKey) && e.key==="z"){ e.preventDefault(); if(!online || match.by===deviceId) undo(); return; }
  if(online && !isMyTurn()) return;
  const totalEntry = is01(match.game) || isCO(match.game) || match.game==="countup" || (match.game==="halveit" && ["EVEN","ODD"].includes(halveTarget()));
  if(!totalEntry || match.over || pending) return;
  if(/^[0-9]$/.test(e.key)){ calcKey(e.key); render(); }
  else if(e.key==="+"){ calcKey("+"); render(); }
  else if(e.key==="*" || e.key==="x" || e.key==="X"){ calcKey("×"); render(); }
  else if(e.key==="Backspace"){ entry = entry.slice(0,-1); render(); }
  else if(e.key==="Enter" && entry){ const v = entryValue(); if(v!==null) submitScore(v); }
});

load();
if(prefs.startWith==="default" && prefs.defaults) settings = Object.assign(settings, JSON.parse(JSON.stringify(prefs.defaults)));
applyPrefs();
if(profilesOn()){ screen = "loading"; render(); startAuth(); }
else render();
})();
</script>
<script>if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }</script>
