/* Scoreboard look: black field, red active-player bar, white score panel; keypad docked at the bottom for thumbs. */
:root{
  --bg:#0b0b0c;
  --panel:#17141b;
  --panel-2:#29232f;
  --line:#3b3343;
  --chalk:#f4ecdf;
  --muted:#a39aab;
  /* taken from the app icon: neon ring + darts (purple), sisal (cream), board red and green */
  --accent:#9b22d6;
  --accent-hi:#b43cf0;
  --accent-lo:#5a0c84;
  --accent-dark:#3a0a55;
  --accent-tint:#211029;
  --neon:#e020f0;
  --neon-glow:rgba(224,32,240,.7);
  --accent-row:#2e1240;
  --accent-shadow:#2c0642;
  --banner:#1d0828;
  --hl2:#ffe1ad;
  --hl2-a50:rgba(255,225,173,.5);
  --hl2-a20:rgba(255,225,173,.2);
  --back-hi:#f2dcb4;
  --back-lo:#c9a876;
  --back-bd:#f8e8cc;
  --back-ink:#1a1208;
  --red:#e01414;
  --red-dark:#6f0606;
  --green:#0a7a2c;
  --gold:#f0d4a4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- setup ---------- */
.wrap{max-width:620px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:10px}

ain no-repeat}
.label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 0;min-width:64px;padding:12px 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:20px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.small button{font-size:17px;padding:10px 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:22px;font-weight:600}
.stepper output{min-width:42px;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:14px}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:12px;font:inherit;font-size:17px}
.prow .x{width:44px;height:44px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-size:20px}
.ghost{padding:12px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.primary{padding:16px;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.secondary{padding:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.resume{border-color:var(--gold)}
.resume strong{color:var(--gold);font-family:var(--display);font-size:20px}

/* ---------- game shell ---------- */
#app{height:100%}
.game{max-width:620px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}
.game > *{flex:none}
.game > .board{flex:1 1 auto;min-height:60px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;padding:8px 8px 6px;border-bottom:2px solid var(--chalk)}
.hdr.many{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.side{display:flex;flex-direction:column;min-width:0;container-type:inline-size}
.nmbar{background:transparent;color:var(--muted);font-family:var(--display);font-weight:800;font-size:calc(28px * var(--ts,1));line-height:1.15;text-align:center;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.active .nmbar{background:var(--accent);color:#fff}
.scorebox{display:flex;align-items:center;gap:6px;padding:2px 8px;min-height:84px}
.side.R .scorebox{flex-direction:row-reverse}
.side.active .scorebox{background:#ececec;color:#111}
.stk{display:flex;flex-direction:column;gap:2px;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:34px}
.side.R .stk{text-align:right}
.stk .avg{color:var(--red)}
.side.active .stk .avg{color:var(--accent)}
.big{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:min(calc(68px * var(--ts,1)),calc((100cqw - 62px) / 1.75));line-height:1;font-variant-numeric:tabular-nums}
.many .big{font-size:min(calc(52px * var(--ts,1)),calc((100cqw - 62px) / 1.75))}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.rnd{min-width:58px;height:58px;padding:0 8px;border-radius:10px;background:linear-gradient(var(--accent-hi),var(--accent-lo));display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:42px;color:#fff;box-shadow:0 2px 0 var(--accent-shadow)}
.mode{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);letter-spacing:.04em;text-align:center}
.roundline{display:flex;justify-content:center;gap:12px;align-items:center;padding:6px;font-family:var(--display);font-weight:700;font-size:18px}
.roundline .mode{font-size:16px}
.board{flex:1;overflow-y:auto;min-height:0;position:relative}

/* 01 history */
.hist{width:100%;border-collapse:collapse;font-family:var(--display);font-variant-numeric:tabular-nums;table-layout:fixed}
.hist td{padding:3px 6px;text-align:center;font-size:24px;font-weight:600}
.hist td.sc{color:var(--muted);font-size:20px}
.hist td.lf{font-weight:700}
.hist td.rn{width:64px;color:var(--muted);font-size:20px;border-left:3px solid #8c8c93;border-right:3px solid #8c8c93}
.hist td.bust{color:var(--red);font-size:18px;font-weight:700;letter-spacing:.04em}
.hist tr.start td{color:var(--muted)}
.hist th{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist td.cell{font-size:22px}
.hist td.cell small{display:block;color:var(--muted);font-size:15px;line-height:1}

/* cricket grid */
.cg{display:grid;gap:6px 6px;padding:10px 8px;align-items:center}
.cg .mk{display:grid;place-items:center;height:52px}
.cg .mk svg{width:40px;height:40px}
.cg .lbl{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum{height:56px;border-radius:8px;background:linear-gradient(var(--accent-hi),var(--accent-lo));color:#fff;font-family:var(--display);font-weight:800;font-size:calc(46px * var(--ts,1));line-height:1;
  box-shadow:0 2px 0 var(--accent-shadow);text-shadow:0 0 8px rgba(255,255,255,.35)}
.cmod{height:38px;border-radius:6px;background:linear-gradient(var(--accent-hi),var(--accent-lo));color:#fff;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 2px 0 var(--accent-shadow)}
.cg button.dead{background:linear-gradient(#3a3a40,#232327);color:#5f5f68;box-shadow:none;text-shadow:none}
.cg .pts{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}

/* killer */
.kl{display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kr.play{grid-template-columns:minmax(0,1fr) 50px 68px 50px}
.kr.active{border-color:var(--accent);box-shadow:inset 5px 0 0 var(--accent);background:var(--accent-tint)}
.kr.out{opacity:.35}
.kinfo{display:flex;flex-direction:column;gap:4px;min-width:0;padding-left:4px}
.kname{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ksub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid #6a6a72}
.pip.on{background:var(--gold);border-color:var(--gold)}
.skull{width:36px;height:40px;vertical-align:middle;margin-left:4px;filter:drop-shadow(0 0 4px rgba(255,90,0,.7))}
.skull circle{filter:drop-shadow(0 0 2px #ff0000)}
.kchip{font-size:13px;font-weight:700;letter-spacing:.08em;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;vertical-align:middle}
.kchip.out{background:#55555c}
.knum{font-family:var(--display);font-weight:800;font-size:calc(36px * var(--ts,1));min-width:56px;text-align:center;color:var(--gold)}
.pad.np{grid-template-columns:repeat(5,1fr)}
.pad.np .k{height:44px;font-size:28px}
.pad.np .bullk{grid-column:span 5;background:linear-gradient(#0d8a34,#05521d);color:#fff;border-color:#05521d}

/* halve-it */
.ht{width:100%;border-collapse:collapse;font-family:var(--display);font-variant-numeric:tabular-nums;table-layout:fixed}
.ht th{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);padding:8px 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht th.on{color:#fff;box-shadow:inset 0 -3px 0 var(--accent)}
.ht td{text-align:center;padding:4px;font-size:24px;font-weight:700;border-bottom:1px solid #222227}
.ht td small{display:block;font-size:14px;color:var(--muted);font-weight:600;line-height:1}
.ht td small i{font-style:normal}
.ht td small.half{color:#ff3b4f;font-size:16px}
.ht td.rt,.ht th.rt{width:84px;text-align:left;padding-left:10px;font-size:20px;color:var(--muted)}
.ht tr.cur td{background:var(--accent-tint)}
.ht tr.cur td.rt{color:var(--gold);box-shadow:inset 4px 0 0 var(--accent)}
.ht td.now{box-shadow:inset 0 0 0 2px var(--gold)}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mods button{height:40px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.mods button[data-hm="1"][aria-pressed="true"]{background:var(--chalk);color:#111}
.mods button[data-hm="2"][aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.mods button[data-hm="3"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.pad.big3{grid-template-columns:repeat(3,1fr)}
.pad.p3{grid-template-columns:repeat(3,1fr)}
.pad.big2{grid-template-columns:repeat(2,1fr)}
.pad.big3 .k,.pad.big2 .k{height:76px;font-size:36px;line-height:1}
.pad.big2 .k{font-size:26px}
.pad .k small{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.8}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{padding:10px 4px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:#fff;box-shadow:inset 0 -3px 0 var(--accent)}
.seg.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.seg.games button{font-size:18px;min-width:0}
.rulesbtn{align-self:flex-start;padding:8px 2px;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sheet.rules{max-height:85vh;overflow-y:auto}
.sheet.rules ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.45}
.atc{display:flex;flex-direction:column;gap:10px;padding:12px 10px}
.atc .pr{display:flex;flex-direction:column;gap:6px}
.atc .pn{font-weight:600}
.atc .pr.on .pn{color:#fff}
.atc .chips{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.atc .c{height:28px;border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--panel-2);color:var(--muted)}
.atc .c.done{background:var(--accent);color:#fff}
.atc .c.next{box-shadow:inset 0 0 0 2px var(--gold);color:#fff}
.pad.p4{grid-template-columns:repeat(4,1fr)}
.pad.p4 .k{height:76px;font-size:24px;line-height:1.05}
.pad.p4 .k small{font-size:13px}

.dock{position:relative}
.dock.locked > :not(.lockmsg){opacity:.25;pointer-events:none}
.lockmsg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:#fff;text-align:center;padding:12px}
.camchip{font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.3);border-radius:6px;padding:3px 8px;margin-left:4px;white-space:nowrap;vertical-align:middle}
.codechip{font-family:var(--display);font-weight:800;font-size:16px;color:#fff;background:rgba(0,0,0,.3);border-radius:6px;padding:3px 8px;letter-spacing:.08em;vertical-align:middle}
.codebig{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.2em;text-align:center;color:var(--gold);line-height:1}
.claims{display:flex;flex-direction:column;gap:6px}
.claim{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:17px}
.claim.on{background:var(--accent);border-color:var(--accent);color:#fff}
.claim .cs{font-size:13px;opacity:.85;font-weight:500}

.pblock{display:flex;flex-direction:column;gap:4px}
.pblock .em{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:9px 12px;font:inherit;font-size:15px}
.jform{display:flex;flex-direction:column;gap:6px}
.jform input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:11px 12px;font:inherit;font-size:16px}
.sheet.wide{max-width:680px;max-height:88vh;overflow-y:auto}
.mailview{background:#fff;color:#111;border-radius:8px;padding:12px;overflow-x:auto}
.statlist{display:flex;flex-wrap:wrap;gap:8px}

/* cricket board fills the space between header and scorer, so all 7 targets show without scrolling */
.board.fit{display:flex;flex-direction:column}
.board.fit .cg{flex:1 1 auto;min-height:0;width:100%;max-width:560px;margin:0 auto;padding:8px;gap:5px 6px}
.board.fit .cg > *{min-height:0}
.board.fit .cnum{height:100%;max-height:64px;font-size:calc(clamp(24px,5.2vh,46px) * var(--ts,1));align-self:center;width:100%}
.board.fit .cmod{height:72%;max-height:44px;min-height:26px;font-size:clamp(16px,3vh,22px);align-self:center;width:100%}
.board.fit .mk{height:100%;max-height:56px}
.board.fit .mk svg{height:min(40px,80%);width:auto}
.board.fit > .hint{flex:none}

.wrap.narrow{max-width:520px}
.ghost.small{padding:8px 12px;font-size:14px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px;border-radius:12px;background:var(--accent);color:#fff}
.choice b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.03em}
.choice span{opacity:.9;font-size:15px}
.choice.alt{background:var(--panel);border:1px solid var(--line)}
.choice.alt span{color:var(--muted)}
.aform{display:flex;flex-direction:column;gap:8px}
.aform label{font-size:14px;font-weight:600;color:var(--muted)}
.aform input,select.em,.jform select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:12px;font:inherit;font-size:16px;width:100%}
.amsg{background:var(--accent-dark);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:15px}
.tabs.two{grid-template-columns:1fr 1fr}
.pcard .pname{font-family:var(--display);font-weight:800;font-size:24px}
.wrapbtns{flex-wrap:wrap}
.wrapbtns button{flex:1 1 auto;padding:10px 12px;font-size:16px}
.danger{color:#ff6b7a !important;border-color:#7a2430 !important}
.hlist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}

.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{padding:14px;border-radius:10px;background:#fff;color:#1f1f1f;font-weight:600;font-size:17px;border:1px solid #dadce0}

.seg.first button{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tablets: landscape puts the board on the left and the scorer on the right */
.game.wide{max-width:1400px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(380px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:14px;flex-direction:initial}
.game.wide > .roundline{grid-column:1/-1;grid-row:1}
.game.wide > .hdr{grid-column:1/-1;grid-row:2}
.game.wide > .board{grid-column:1;grid-row:3/6;min-height:0}
.game.wide > .bar{grid-column:2;grid-row:4;align-self:end}
.game.wide > .dock{grid-column:2;grid-row:5}
.game.wide .pad button{height:clamp(50px,7.2vh,66px)}
.game.wide .pad.big2 .k,.game.wide .pad.big3 .k,.game.wide .pad.p4 .k{height:clamp(76px,12vh,110px)}

.bigtarget{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px 10px;text-align:center;
  background:linear-gradient(180deg,var(--banner) 0%,var(--bg) 100%);border-bottom:2px solid var(--accent);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.bt-label{font-family:var(--display);font-weight:600;font-size:clamp(16px,2.4vh,26px);color:var(--muted);letter-spacing:.03em}
.bt-label b{color:#fff}
.bt-val{font-family:var(--display);font-weight:800;font-size:calc(clamp(64px,10.5vh,150px) * var(--ts,1));line-height:.95;color:#fff;letter-spacing:.02em;text-shadow:0 0 22px var(--neon-glow)}
.bt-sub{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.2vh,24px);color:var(--gold);letter-spacing:.04em}
.ht tr.cur td{font-size:calc(30px * var(--ts,1));padding:9px 4px;background:var(--accent-row)}
.ht tr.cur td.rt{font-size:26px;color:#fff}
.ht tr.done td{opacity:.75}
.game.wide .bt-val{font-size:calc(clamp(64px,13vh,170px) * var(--ts,1))}

.cg .mk{display:flex;align-items:center;justify-content:center;gap:6px;height:56px}
.cg .mk svg{height:88%;width:auto;max-height:84px;flex:none}
.cg .mk .tm{min-width:22px;font-family:var(--display);font-weight:800;font-size:calc(clamp(22px,3.4vh,40px) * var(--ts,1));color:var(--hl2);text-align:center}
.board.fit .mk{height:100%;max-height:96px}
.board.fit .mk svg{height:88%;width:auto;max-height:84px}
.cg .mk{min-width:0}
.cg .mk svg,.board.fit .mk svg{flex:0 1 auto;min-width:0;max-width:100%}
.cg.many{gap:6px 4px;padding:8px 4px}
.cg.many .mk{gap:2px}
.cg.many .mk .tm{min-width:0;font-size:calc(clamp(18px,2.8vh,34px) * var(--ts,1))}
.cg.many .mk .tm:empty{display:none}
.miss.go{background:linear-gradient(var(--accent-hi),var(--accent-lo));box-shadow:0 0 0 3px var(--hl2),0 0 16px var(--hl2-a50);animation:gopulse 1.2s ease-in-out infinite}
@keyframes gopulse{50%{box-shadow:0 0 0 3px var(--hl2),0 0 4px var(--hl2-a20)}}
@media (prefers-reduced-motion:reduce){.miss.go{animation:none}}

.pad .k.op{background:linear-gradient(#3b3b42,#1d1d21);color:#fff;border-color:#55555e;font-size:38px}
.pad .k.clr{background:linear-gradient(#3b3b42,#1d1d21);color:var(--hl2);border-color:#55555e}
.pad .k:disabled{opacity:.35}
.pad .q:disabled{opacity:.25}
.disp .calceq{color:var(--hl2)}
.calcline{font-size:24px;font-weight:800;color:#fff;text-align:center;padding:2px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;unicode-bidi:plaintext}
.miss.ent{background:linear-gradient(#0d8a34,#05521d);border-color:#0d8a34}
.big .prev{color:var(--accent)}
.side:not(.active) .big .prev{color:var(--hl2)}

/* tablets: larger column names over the boards */
@media (min-width:700px){ .ht th{font-size:17px} .cg .lbl{font-size:16px} }
@media (min-width:700px) and (min-height:600px){ .ov .sheet:not(.wide):not(.rules){max-width:440px;transform:scale(1.1)} }
@media (min-width:700px) and (min-height:900px){ .ov .sheet:not(.wide):not(.rules){transform:scale(1.25)} }

/* settings */
.gear{display:inline-flex;align-items:center;gap:6px}
.gear svg{width:18px;height:18px}
.row h1{white-space:nowrap}
@media (max-width:520px){ .row h1{font-size:30px} .gear .gl{display:none} .gear{padding:10px} .gear svg{width:22px;height:22px} }
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:12px;background:var(--panel);border:2px solid var(--line);text-align:left;font-weight:700}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.theme .sws{display:flex;gap:6px}
.theme .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.theme small{font-weight:500;color:var(--muted);font-size:12px}
.tpick{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tpick input[type=color]{width:64px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.tprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.tprev .pc{background:#ececec;border-radius:8px;overflow:hidden;text-align:center}
.tprev .pc b{display:block;background:var(--accent);color:#fff;font-family:var(--display);font-size:20px;padding:2px}
.tprev .pc span{display:block;color:var(--accent);font-family:var(--display);font-weight:800;font-size:44px;line-height:1.1}
.tprev .pm{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.tprev .pm svg{width:46px;height:46px}
.tprev .pm .cn{width:52px;height:46px;border-radius:8px;background:linear-gradient(var(--accent-hi),var(--accent-lo));display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;color:#fff;box-shadow:0 2px 0 var(--accent-shadow)}
.tprev .back,.tprev .primary{width:100%}
.prow2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prow2>div:first-child{flex:1 1 180px}
.prow2 .seg{flex:1 1 220px;max-width:360px}
.prow2 select{flex:1 1 220px;max-width:360px}
.prow2 .seg button{min-width:0;font-size:16px;padding:10px 4px;overflow-wrap:anywhere}
.qsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qsgrid input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:10px;font-family:var(--display);font-weight:700;font-size:22px;text-align:center;width:100%}

/* teams */
.nmbar.team b{font-weight:800}
.nmbar.team small{font-size:.62em;font-weight:600;opacity:.7;margin:0 .15em}
.tchips{display:flex;gap:4px;flex:none}
.tchips button{width:38px;height:44px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:800;font-size:20px;padding:0}
.tchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.teamlist{display:grid;gap:4px;margin:6px 0 2px}
.teamlist div{font-size:14px;color:var(--chalk)}
.teamlist b{color:var(--gold);margin-right:6px}

/* setup steps */
.steps{display:flex;gap:6px;margin:2px 0 4px}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:15px}
.step span{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:13px;color:var(--chalk)}
.step.on{border-color:var(--accent);color:var(--chalk);box-shadow:inset 0 -3px 0 var(--accent)}
.step.on span{background:var(--accent);color:#fff}
.step.done span{background:var(--accent-dark);color:#fff}
.step:disabled{opacity:.55}
.qps{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.choice.qp{padding:14px 16px}
.choice.qp b{font-size:24px}

/* checkout practice */
.ht.co td small{display:block;font-size:12px;font-weight:600;opacity:.8}
.ht.co td.ok{color:#6fe39a}
.ht.co td.no{color:var(--muted)}
.ht.co td.now{color:var(--hl2);font-weight:800}
.big .lock{font-size:.35em;vertical-align:top;margin-left:2px}

/* bar + entry + keypad */
.bar{display:grid;grid-template-columns:44px 1fr auto 44px;align-items:center;gap:8px;margin:0 6px;padding:6px 8px;border-radius:10px 10px 0 0;background:linear-gradient(var(--accent),var(--accent-lo))}
.bar .ib{width:36px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:20px;font-weight:700;background:rgba(0,0,0,.25);color:#fff}
.bar .bt{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bs{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.dock{margin:0 6px 6px;background:#2b2b30;padding:6px;display:flex;flex-direction:column;gap:6px;border-radius:0 0 10px 10px}
.entry{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:6px}
.back{height:58px;border-radius:6px;background:linear-gradient(var(--back-hi),var(--back-lo));color:var(--back-ink);font-family:var(--display);font-weight:800;font-size:26px;border:1px solid var(--back-bd)}
.miss{height:58px;border-radius:6px;background:linear-gradient(#b80f0f,#6a0505);color:#fff;font-family:var(--display);font-weight:800;font-size:26px;border:1px solid #e01414}
.disp{height:58px;border-radius:6px;background:#000;border:1px solid #5a5a62;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;overflow:hidden;
  font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.disp.typed{font-size:42px;color:#fff}
.disp.co{font-size:26px}
.disp .dart{font-size:24px;color:#fff;background:var(--panel-2);border-radius:5px;padding:0 6px}
.disp .dart.void{color:var(--muted);text-decoration:line-through}
.disp .dart.empty{color:#55555c;background:transparent;border:1px dashed #44444b;min-width:44px;text-align:center}
.disp .dart{min-width:44px;text-align:center}
.throwing{text-align:center;font-size:15px;color:var(--muted)}
.throwing .tname{color:#fff;font-weight:700;font-size:17px}
.throwing b{color:var(--gold)}
.miss{line-height:1}
.disp .muted{color:var(--muted);font-size:20px;font-weight:600}
.pad{display:grid;grid-template-columns:.8fr 1fr 1fr 1fr .8fr;gap:4px}
.pad button{height:50px;border-radius:4px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pad .q{font-size:28px;color:#d6d6dc;background:transparent}
.pad .k{font-size:34px;color:#111;background:linear-gradient(#f4f4f4,#bdbdc2);border:1px solid #8d8d93}
.pad .k.g{background:linear-gradient(#0d8a34,#05521d);color:#fff;border-color:#05521d}
.pad .k.r{background:linear-gradient(#c81010,#6a0505);color:#fff;border-color:#6a0505}
.pad .enter{grid-column:span 2;font-size:26px;letter-spacing:.06em;background:linear-gradient(#0d8a34,#05521d);color:#fff;border:1px solid #05521d}
.pad button:active,.cnum:active,.cmod:active,.back:active,.miss:active{filter:brightness(1.25);transform:translateY(1px)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:32px;text-wrap:balance;line-height:1.1}
.sheet .bigl{font-family:var(--display);font-weight:700;font-size:22px;color:var(--gold)}
.stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.stats th,.stats td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats th{color:var(--muted);font-weight:500;font-size:13px}
.btns{display:flex;flex-direction:column;gap:8px}
.dchoice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dchoice button{height:64px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:34px}
.toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:60px;color:var(--gold);
  text-shadow:0 4px 24px #000;pointer-events:none;z-index:20;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.toast.bad{color:#ff3b4f}
.toast.msg{font-size:22px;font-weight:700;color:#fff;background:var(--accent-dark);border:1px solid var(--accent);padding:10px 16px;border-radius:10px;white-space:normal;max-width:90vw;text-align:center;animation-duration:2.2s}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.7)}12%{opacity:1;transform:translateX(-50%) scale(1.04)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media (max-width:380px){.big{font-size:min(calc(56px * var(--ts,1)),calc((100cqw - 62px) / 1.75))}.nmbar{font-size:24px}.pad button{height:46px}.cnum{height:50px;font-size:40px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Reaper deaths for Killer: plays a death animation over a knocked-out player's row.
   Reaper.play(num, deathIndex, getRect). num 1-20 or 25 (Bull). Same art as the "Reaper vs. the Numbers" page. */
const Reaper=(()=>{
const W=400,H=400,GY=305,NS=180,NX=272,NY=GY-46,RX=105,TAU=Math.PI*2;
let cv=null,ctx=null,scale=1,time=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,eout=t=>1-Math.pow(1-t,3),ein=t=>t*t*t,rnd=(a,b)=>a+Math.random()*(b-a);
const FX={shake:0,flash:0,fc:'#fff'};const lab=n=>n==='B'?'Bull':n;

/* ---------- numbers ---------- */
const cache={};
function numC(n,fill,dead,stroke){const key=[n,fill,dead,stroke].join('|');if(cache[key])return cache[key];
const c=document.createElement('canvas');c.width=c.height=NS*2;const g=c.getContext('2d');g.scale(2,2);
g.font='900 128px Impact,"Arial Black","Roboto Black",sans-serif';g.textAlign='center';g.textBaseline='alphabetic';
const by=NS/2+46;let m=g.measureText(String(n)),asc=m.actualBoundingBoxAscent||95;
if(n==='B'){const cy=by-46,plain=fill==='#f2e8d0'||fill==='#e4dccb';asc=92;m={width:92};
 g.lineWidth=5;g.strokeStyle=stroke||'#120c18';g.fillStyle=plain?(fill==='#f2e8d0'?'#1f9a4a':'#4f7a5c'):fill;g.beginPath();g.arc(NS/2,cy,44,0,TAU);g.fill();g.stroke();
 g.fillStyle=plain?(fill==='#f2e8d0'?'#d8262c':'#8c4a4c'):fill;g.globalAlpha=plain?1:.75;g.beginPath();g.arc(NS/2,cy,24,0,TAU);g.fill();g.globalAlpha=1;g.lineWidth=3;g.stroke();
 g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.beginPath();g.arc(NS/2,cy,34,0,TAU);g.stroke();}
else{g.lineJoin='round';g.lineWidth=10;g.strokeStyle=stroke||'#120c18';g.strokeText(n,NS/2,by);g.fillStyle=fill;g.fillText(n,NS/2,by);}
const fy=by-asc*.62,ex=Math.min(17,m.width*.2);
[NS/2-ex,NS/2+ex].forEach(x=>{g.fillStyle='#fff';g.strokeStyle='#120c18';g.lineWidth=2.5;g.beginPath();g.arc(x,fy,7,0,TAU);g.fill();g.stroke();
 if(dead){g.lineWidth=2.6;g.beginPath();g.moveTo(x-4,fy-4);g.lineTo(x+4,fy+4);g.moveTo(x+4,fy-4);g.lineTo(x-4,fy+4);g.stroke();}
 else{g.fillStyle='#120c18';g.beginPath();g.arc(x+1,fy+1,3.4,0,TAU);g.fill();}});
g.strokeStyle='#120c18';g.lineWidth=3;g.lineCap='round';g.beginPath();
if(dead){g.moveTo(NS/2-7,fy+19);g.quadraticCurveTo(NS/2,fy+14,NS/2+7,fy+19);}else{g.arc(NS/2,fy+12,7,.15*Math.PI,.85*Math.PI);}g.stroke();
c.hw=m.width/2;c.asc=asc;cache[key]=c;return c;}
function pixels(c,step=4){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,out=[];
for(let y=0;y<NS;y+=step)for(let x=0;x<NS;x+=step){const i=((y*2)*c.width+x*2)*4;if(d[i+3]>150)out.push({x:x-NS/2,y:y-NS/2,c:`rgb(${d[i]},${d[i+1]},${d[i+2]})`});}return out;}
function drawNum(c,o={}){ctx.save();ctx.globalAlpha*=(o.a??1);const px=o.px||0,py=o.py||0;
ctx.translate(NX+px+(o.x||0),NY+py+(o.y||0));ctx.rotate(o.r||0);ctx.scale(o.sx??1,o.sy??1);ctx.drawImage(c,-NS/2-px,-NS/2-py,NS,NS);ctx.restore();}
function drawPiece(c,poly,o={}){ctx.save();ctx.globalAlpha*=(o.a??1);const cx=o.cx||0,cy=o.cy||0;
ctx.translate(NX+cx+(o.x||0),NY+cy+(o.y||0));ctx.rotate(o.r||0);ctx.translate(-cx,-cy);
ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.clip();ctx.drawImage(c,-NS/2,-NS/2,NS,NS);ctx.restore();}
function makeShards(nx,ny,pow,up=1){const ps=[],pts=[],x0=-74,x1=74,y0=-60,y1=48;
for(let j=0;j<=ny;j++){pts[j]=[];for(let i=0;i<=nx;i++){let x=lerp(x0,x1,i/nx),y=lerp(y0,y1,j/ny);if(i>0&&i<nx)x+=rnd(-7,7);if(j>0&&j<ny)y+=rnd(-7,7);pts[j][i]=[x,y];}}
for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i+1],d=pts[j+1][i];
 const tr=Math.random()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]];
 for(const t of tr){const cx=(t[0][0]+t[1][0]+t[2][0])/3,cy=(t[0][1]+t[1][1]+t[2][1])/3,an=Math.atan2(cy+20,cx)+rnd(-.5,.5),sp=rnd(60,220)*pow;
  ps.push({poly:t,cx,cy,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-rnd(40,170)*pow*up,vr:rnd(-7,7)*Math.min(pow,1.2)});}}return ps;}
function drawShards(c,ps,k,o={}){const g=o.g??750;for(const p of ps){
 if(p.tl===undefined){const fy=Math.max(GY-4-(NY+p.cy),0);p.tl=(-p.vy+Math.sqrt(p.vy*p.vy+2*g*fy))/g;}
 const kk=o.floor===false?k:Math.min(k,p.tl);drawPiece(c,p.poly,{cx:p.cx,cy:p.cy,x:p.vx*kk,y:p.vy*kk+.5*g*kk*kk,r:p.vr*kk,a:o.a});}}
function landT(vy,g,fy){return(-vy+Math.sqrt(vy*vy+2*g*Math.max(fy,0)))/g;}

/* ---------- reaper ---------- */
function reaper(o={}){const x=o.x??RX,ang=o.ang??.25,bob=Math.sin(time*2.6)*3;
ctx.save();ctx.globalAlpha*=(o.a??1);ctx.translate(x,GY);
ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,0,42,7,0,0,TAU);ctx.fill();
ctx.translate(0,-8+bob);ctx.rotate(o.lean||0);
const rg=ctx.createLinearGradient(-40,-180,40,0);rg.addColorStop(0,'#30264a');rg.addColorStop(1,'#120d1a');ctx.fillStyle=rg;
ctx.beginPath();ctx.moveTo(-34,0);ctx.bezierCurveTo(-40,-60,-36,-120,-24,-150);ctx.bezierCurveTo(-14,-184,22,-186,28,-148);ctx.bezierCurveTo(34,-110,38,-50,40,0);
for(let i=0;i<6;i++){const px=40-(i+1)*74/6;ctx.lineTo(px+6,-(i%2?3:13)+Math.sin(time*4+i)*2.5);ctx.lineTo(px,0);}
ctx.closePath();ctx.fill();
ctx.fillStyle='#050308';ctx.beginPath();ctx.ellipse(6,-138,15,20,.1,0,TAU);ctx.fill();
const ec=o.eye||'#ff3b3b',es=o.eyeSize||1;ctx.fillStyle=ec;ctx.shadowColor=ec;ctx.shadowBlur=10*(o.glow??1);
ctx.beginPath();ctx.arc(1,-140,2.6*es,0,TAU);ctx.arc(12,-140,2.6*es,0,TAU);ctx.fill();ctx.shadowBlur=0;
ctx.save();ctx.translate(20,-88);ctx.rotate(ang);
if(!o.noScythe){ctx.strokeStyle='#5d3d22';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,75);ctx.lineTo(0,-92);ctx.stroke();
 const bl=ctx.createLinearGradient(0,-100,90,-60);bl.addColorStop(0,'#8e98a6');bl.addColorStop(1,'#eef2f7');ctx.fillStyle=bl;
 ctx.beginPath();ctx.moveTo(-4,-96);ctx.quadraticCurveTo(55,-118,98,-62);ctx.quadraticCurveTo(58,-90,0,-80);ctx.closePath();ctx.fill();ctx.strokeStyle='#2a2f38';ctx.lineWidth=1.5;ctx.stroke();}
ctx.restore();
ctx.fillStyle='#1f1830';ctx.beginPath();ctx.moveTo(4,-122);ctx.quadraticCurveTo(28,-112,26,-92);ctx.lineTo(13,-85);ctx.quadraticCurveTo(10,-104,0,-108);ctx.fill();
ctx.fillStyle='#e8dfc9';ctx.beginPath();ctx.arc(20,-88,5.5,0,TAU);ctx.fill();
ctx.restore();const by=GY-8+bob;return{x,hx:x+20,hy:by-88,e1:[x+1,by-140],e2:[x+12,by-140]};}
function swing(t,a,b,c,rest=.25){if(t<a)return rest;if(t<b)return lerp(rest,-1.1,eio(seg(t,a,b)));if(t<c)return lerp(-1.1,1.9,eout(seg(t,b,c)));return lerp(1.9,rest,eio(seg(t,c+.15,c+.35)));}
function approach(t,a,b,c,d,to=168){return lerp(RX,to,eio(seg(t,a,b)))-(to-RX)*eio(seg(t,c,d));}
function trail(r,k){if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha=1-k;ctx.strokeStyle='#fff';ctx.lineWidth=7*(1-k)+1;ctx.shadowColor='#bfe3ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(r.hx,r.hy,104,-1.7,.35);ctx.stroke();ctx.restore();}
function puff(x,y,k,n=6,col='200,190,180'){if(k<=0||k>=1)return;for(let i=0;i<n;i++){const a=i/n*Math.PI-Math.PI+.2,d=10+40*eout(k);ctx.fillStyle=`rgba(${col},${.6*(1-k)})`;ctx.beginPath();ctx.arc(x+Math.cos(a)*d*1.4,y+Math.sin(a)*d*.5-6,6+10*k,0,TAU);ctx.fill();}}
function flames(cx,base,w,inten){if(inten<=0)return;ctx.save();const n=9;for(let i=0;i<n;i++){const x=cx-w/2+w*(i+.5)/n,h=(28+22*Math.sin(time*13+i*1.9)+12*Math.sin(time*7+i))*inten;
 const g=ctx.createLinearGradient(0,base,0,base-h);g.addColorStop(0,'rgba(255,90,20,.95)');g.addColorStop(.6,'rgba(255,190,40,.8)');g.addColorStop(1,'rgba(255,240,150,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-10,base);ctx.quadraticCurveTo(x-8,base-h*.5,x+Math.sin(time*9+i)*5,base-h);ctx.quadraticCurveTo(x+8,base-h*.5,x+10,base);ctx.fill();}ctx.restore();}
function glowDot(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}

/* ---------- deaths ---------- */
const D=[];const def=(name,dur,init,draw)=>D.push({name,dur,init,draw});

// 1 Scythe Slice
def('Scythe Slice',3.2,null,(t,s,T)=>{const r=reaper({x:approach(t,0,.12,.6,.8),ang:swing(t,.1,.18,.3)});trail(r,seg(t,.21,.42));
 const cut=.27;if(t<cut){drawNum(s.alive);return;}const k=T-cut*3.2;
 drawPiece(s.dead,[[-95,38],[95,-34],[95,110],[-95,110]]);
 const sl=eout(clamp(k/.3))*16;let x=sl*.93,y=-sl*.36,rr=0;if(k>.35){const f=k-.35;x+=Math.min(f,.45)*90;y+=.5*900*f*f;rr=Math.min(1.2,f*4.5);}y=Math.min(y,46);
 drawPiece(s.dead,[[-95,38],[95,-34],[95,-110],[-95,-110]],{x,y,r:rr,cx:0,cy:-40});
 if(k<.18){ctx.save();ctx.globalAlpha=1-k/.18;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(NX-95,NY+38);ctx.lineTo(NX+95,NY-34);ctx.stroke();ctx.restore();}
 if(k>.55&&k<.75)FX.shake=3;});

// 2 Fireball
def('Fireball',3.6,s=>{s.char=numC(s.n,'#3b2b22',true,'#050302');s.pts=pixels(s.char,4).map(p=>({...p,vx:rnd(-15,45),vy:rnd(-70,-15),d:(p.y+60)/120*.5+rnd(0,.15)}));},(t,s,T)=>{
 const r=reaper({ang:lerp(.25,-.35,eio(seg(t,.03,.12)))-lerp(0,-.6,eio(seg(t,.4,.55))),eye:'#ffa020',glow:1+2*seg(t,.05,.15)*(1-seg(t,.35,.5))});
 const ft=seg(t,.14,.34);if(ft>0&&ft<1){const sx=r.hx+70,sy=r.hy-110,ex=NX-10,ey=NY-5;const p=k=>[lerp(sx,ex,k),lerp(sy,ey,k)-Math.sin(k*Math.PI)*40];
  for(let i=6;i>=0;i--){const q=p(Math.max(0,ft-i*.035));glowDot(q[0],q[1],(18-i*2),`rgba(255,${120+i*15},30,${.9-i*.1})`);}const q=p(ft);glowDot(q[0],q[1],10,'rgba(255,250,200,1)');}
 if(t<.34){if(ft>0)glowDot(r.hx+70,r.hy-110,22*(1-ft),'rgba(255,160,40,.8)');drawNum(s.alive);return;}
 const k=T-.34*3.6;if(k<.25){FX.flash=.7*(1-k/.25);FX.fc='#ffcf80';FX.shake=7*(1-k/.25);}
 const b=seg(t,.34,.5);if(t<.72){drawNum(s.alive,{a:1-b});drawNum(s.char,{a:b});}
 const inten=seg(t,.34,.42)*(1-seg(t,.62,.78));flames(NX,GY,130,inten*1.4);
 if(t>=.72){const k2=T-.72*3.6;for(const p of s.pts){const kk=k2-p.d;if(kk<0){ctx.fillStyle=p.c;ctx.fillRect(NX+p.x,NY+p.y,4,4);continue;}
  const a=1-kk/1.1;if(a<=0)continue;ctx.fillStyle=`rgba(${kk<.2?'255,140,40':'90,85,80'},${a})`;ctx.fillRect(NX+p.x+p.vx*kk+Math.sin(kk*6+p.y)*4,NY+p.y+p.vy*kk,3,3);}}});

// 3 Lightning
def('Lightning Strike',3.4,s=>{s.skel=numC(s.n,'#0c0c0c',true,'#ffffff');},(t,s,T)=>{
 const dk=seg(t,.04,.22)*(1-seg(t,.7,.9));FX.dim=dk*.55;
 reaper({ang:lerp(.25,-.15,eio(seg(t,.04,.18)))+lerp(0,.4,seg(t,.6,.75)),eye:'#9fd8ff',glow:1+2*dk});
 const fall=eio(seg(t,.62,.78)),hw=s.alive.hw;
 if(t<.3){drawNum(s.alive,{x:Math.sin(T*40)*seg(t,.18,.3)*2});return;}
 const strike=t<.48&&(Math.floor(T*14)%3!==2);
 if(strike){ctx.save();ctx.strokeStyle='#e9f6ff';ctx.shadowColor='#7fc8ff';ctx.shadowBlur=18;ctx.lineWidth=4;ctx.beginPath();let x=NX+rnd(-30,30),y=-5;ctx.moveTo(x,y);
  while(y<NY-30){y+=rnd(14,26);x+=rnd(-18,18);x=lerp(x,NX,.15);ctx.lineTo(x,y);}ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();
  FX.flash=.35;FX.fc='#dff1ff';FX.shake=5;}
 const c=(t<.48&&strike&&Math.floor(T*20)%2)?s.skel:s.dead;drawNum(c,{px:hw,py:46,r:fall*Math.PI/2,x:-50*fall});
 if(t>.45){for(let i=0;i<5;i++){const k=((T*.6+i/5)%1);ctx.fillStyle=`rgba(120,115,125,${.5*(1-k)})`;ctx.beginPath();ctx.arc(NX+lerp(-10,20,fall)+Math.sin(k*5+i)*10,NY-40+lerp(0,60,fall)-k*70,6+k*12,0,TAU);ctx.fill();}}
 if(t>.77&&t<.86){FX.shake=4;puff(NX+hw-10,GY,seg(t,.77,.95),6);}});

// 4 Anvil
def('Anvil Drop',3.0,null,(t,s,T)=>{reaper({ang:lerp(.25,-.4,eio(seg(t,.03,.12))),lean:-.05*seg(t,.03,.12)});
 const asc=s.alive.asc,top=GY-asc;let ay=lerp(-70,top,ein(seg(t,.15,.36)));const sq=eout(seg(t,.36,.42));const sy=lerp(1,.16,sq);
 if(t>=.36)ay=GY-asc*sy;
 drawNum(t<.36?s.alive:s.dead,{py:46,sy,sx:lerp(1,1.55,sq)});
 ctx.save();ctx.translate(NX,ay);ctx.fillStyle='#4a525e';ctx.strokeStyle='#15181d';ctx.lineWidth=2.5;ctx.beginPath();
 ctx.moveTo(-32,0);ctx.lineTo(32,0);ctx.lineTo(28,-10);ctx.lineTo(16,-14);ctx.lineTo(16,-28);ctx.lineTo(48,-32);ctx.lineTo(48,-48);ctx.lineTo(-30,-48);ctx.quadraticCurveTo(-60,-46,-74,-34);ctx.quadraticCurveTo(-46,-32,-16,-28);ctx.lineTo(-16,-14);ctx.lineTo(-28,-10);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(-28,-46,74,5);ctx.restore();
 if(t>.36){const k=seg(t,.36,.62);puff(NX-70,GY,k);puff(NX+70,GY,k);if(t<.45)FX.shake=10*(1-seg(t,.36,.45));}
 if(t>.42){ctx.fillStyle='#f5e27a';for(let i=0;i<3;i++){const a=T*3+i*TAU/3;ctx.beginPath();ctx.arc(NX+Math.cos(a)*34,ay-62+Math.sin(a)*8,3.5,0,TAU);ctx.fill();}}});

// 5 Glass Shatter
def('Glass Shatter',3.0,s=>{s.glass=numC(s.n,'#cdeeff',true,'#3b7fa8');s.sh=makeShards(7,6,1.05);s.cr=[...Array(7)].map(()=>{const a=rnd(0,TAU),pts=[[0,0]];let x=0,y=0;for(let i=0;i<4;i++){x+=Math.cos(a+rnd(-.4,.4))*rnd(8,16);y+=Math.sin(a+rnd(-.4,.4))*rnd(8,16);pts.push([x,y]);}return pts;});},(t,s,T)=>{
 const r=reaper({x:approach(t,0,.12,.55,.75),ang:swing(t,.1,.18,.29)});trail(r,seg(t,.2,.4));
 if(t<.28){drawNum(s.alive);return;}
 if(t<.46){const shk=(1-seg(t,.28,.46))*3;drawNum(s.glass,{x:rnd(-shk,shk)});const g=eout(seg(t,.28,.42));

const r1 = n => Math.round(n*10)/10, r2 = n => Math.round(n*100)/100;

function playerStats(m, i){

    const a = playerStats(Object.assign({}, m, { base:null, game:"501", tlog:(m.tlog||[]).filter(e=>e.k!=="leg" || is01(e.g||"501")) }), i);
    const b = playerStats(Object.assign({}, m, { base:null, game:"cricket", tlog:(m.tlog||[]).filter(e=>e.k!=="leg" || e.g==="cricket") }), i);
    const skip = ["Legs won","Sets won","Darts thrown"];

    const byLeg = {}; t.forEach(e=>{ const k=e.s+"-"+e.l; (byLeg[k]=byLeg[k]||[]).push(e); });
    let f9p=0, f9d=0; Object.values(byLeg).forEach(a=>a.slice(0,3).forEach(e=>{ f9p += e.bust?0:e.v; f9d += e.co?e.darts:3; }));
    const c180 = t.filter(e=>!e.bust && e.v===180).length, c140 = t.filter(e=>!e.bust && e.v>=140 && e.v<180).length, c100 = t.filter(e=>!e.bust && e.v>=100 && e.v<140).length;

function memberStats(m, side, w, team){
  const own = (m.tlog||[]).filter(e=>e.k==="leg" ? e.p===side : !(e.p===side && e.w!==undefined && e.w!==w));
  const base = m.base==="medley" || is01(m.game) || isCricket(m.game);

  }
  if(isCO(m.game)){
    const c = own.filter(e=>e.p===side && e.w===w && e.k==="co"), fin = c.filter(e=>e.co);
    const darts = c.reduce((a,e)=>a+(e.co ? e.darts : 3),0);

  }

function breakdown(m){
  const T = m.tlog || [], names = m.players.map(p=>p.name), out = [];
  const keys = []; T.forEach(e=>{ const k = e.s+"-"+e.l; if(!keys.includes(k)) keys.push(k); });
  keys.forEach(k=>{
    const [s,l] = k.split("-"), E = T.filter(e=>e.s+"-"+e.l===k);
    const legEnd = E.find(e=>e.k==="leg");
    const head = oneGame(m.game) ? "Turn by turn" : `${m.opts.sets>1?`Set ${s}, `:""}Leg ${l}${legEnd?` · won by ${names[legEnd.p]} (${legEnd.darts} darts)`:""}`;
    const lines = names.map((n,i)=>{
      const t = E.filter(e=>e.p===i && ["01","cr","ki","hv","rg"].includes(e.k));
      const v = t.map(e=> e.k==="01" ? (e.bust ? "B" : e.co ? `✓${e.v}` : e.v)
        : e.k==="cr" ? e.marks

    : `${m.players[o.winner].name} won` + (!oneGame(m.base||m.game) ? (m.opts.sets>1 ? ` ${m.players.map(p=>p.sets).join("–")} in sets` : ` ${m.players.map(p=>p.legsTotal).join("–")} in legs`) : "");
  const stats = m.players.map((p,i)=>playerStats(m,i));

/* ---- career ---- */
function mergeCareer(c, raws){

  c.teamGames = (c.teamGames||0) + fin.filter(r=>r.team).length; c.teamWins = (c.teamWins||0) + raws.filter(r=>r.team && r.won).length;
  raws.forEach(r=>{

      ["darts","pts","c180","c140","c100","co","dd","legs","legsWon"].forEach(k=>x[k]=(x[k]||0)+(a[k]||0));

    let d = ""; games.forEach((g,gi)=>{ if(keep[gi]) d += detailFor(g,gi); });
    const dropped = keep.some(k=>!k);
    return h + SEC("Player performance") + perf + (counts ? SEC("Match counts") + counts : "")
      + SEC("Game detail") + (d || "") + (dropped ? `<p style="color:#777;font-size:12px">Some turn-by-turn tables were left out to keep this email under the size limit.</p>` : "")
      + car + `</div>`;
  };
  const keep = games.map(()=>true);
  let html = build(keep);
  const limit = MAILER ? 95000 : 47000;
  for(let k=0; k<games.length && html.length>limit; k++){ keep[k] = false; html = build(keep); }
  return html;
}

const MAILER = { url:"https://script.google.com/macros/s/AKfycbyh3MbZoUEEioxAzvw2vdATfYbrH5AFs8S3c1Q7e99JD1_82lnlPUZdtQTxP6Tm-D3f/exec", key:"769qx9qX9g1IYu9KV0MA5uUO" };
const canEmail = () => !!(MAILER || EMAILJS);
async function sendEmail(to, subject, html){
  if(MAILER){
    const r = await fetch(MAILER.url, { method:"POST", body: JSON.stringify({ key:MAILER.key, to, subject, html }) });
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || "send failed");
    return;
  }
  const r = await fetch("https://api.emailjs.com/api/v1.0/email/send", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ service_id:EMAILJS.serviceId, template_id:EMAILJS.templateId, user_id:EMAILJS.publicKey, template_params:{ to_email:to, subject, report_html:html } }) });
  if(!r.ok) throw new Error(await r.text());
}

function abandonMatch(keep){
  if(!match) return;

    const rec = buildRecord(match);
    const s = loadLocalSession() || { id: match.id, started: Date.now(), games: [] };
    s.games = s.games.filter(g=>g.id!==rec.id).concat([rec]); saveLocalSession(s);
  }

async function endSession(){
  dialog = null;

  summaryHtml = games.length ? reportHtml(games, null, null) : `<p>No finished games in this session yet.</p>`;
  dialog = "summary"; screen = "home"; render();

    msg("Saving stats and sending emails…");
    const r = await deliver(games, null, s.id);
    msg(r.failed.length ? `Couldn't email ${r.failed.join(", ")}` : r.sent.length ? `Results emailed to ${r.sent.join(", ")}` : canEmail() ? "No player emails on this phone" : "Stats saved");

async function onlineSessionEnded(code){

    stopListening(); online = null; remoteClaims = {};

    try{ localStorage.removeItem(ONLINE_KEY); }catch(e){}
    if(r.sent.length || r.failed.length) msg(r.failed.length ? `Couldn't email ${r.failed.join(", ")}` : `Results emailed to ${r.sent.join(", ")}`);

let user = null;            // firebase auth user
let account = null;         // { name, email, guests:{gid:{name,email}} }
let mode = "local";         // "local" | "online" on the setup screen
let authTab = "login", authBusy = false, authMsg = "";
let editing = null;         // { key|null, name, email, forRow } guest/me editor
let confirmAct = null;      // { text, run } generic confirm dialog
let accountRef = null;
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e).trim());
const meKey = () => user ? `u:${user.uid}` : null;
function people(){
  if(!user || !account) return [];
  const list = [{ key: meKey(), name: account.name || "Me", email: user.email, me:true }];
  Object.entries(account.guests || {}).forEach(([gid,g])=>list.push({ key:`g:${user.uid}:${gid}`, gid, name:g.name, email:g.email||"" }));
  return list;
}
const personByKey = k => people().find(p=>p.key===k) || null;
const ownsKey = k => !!user && (k===meKey() || String(k).startsWith(`g:${user.uid}:`));
function basePath(k){ const [t,uid,gid] = k.split(":"); return t==="u" ? `users/${uid}` : `users/${uid}/guests/${gid}`; }
function authError(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-email")) return "That email address doesn't look right.";
  if(c.includes("user-not-found") || c.includes("wrong-password") || c.includes("invalid-credential") || c.includes("invalid-login")) return "Wrong email or password.";
  if(c.includes("email-already-in-use")) return "There's already an account with that email. Log in instead.";
  if(c.includes("weak-password")) return "Use a password with at least 6 characters.";
  if(c.includes("too-many-requests")) return "Too many tries. Wait a minute and try again.";
  if(c.includes("network")) return "No connection. Check your internet and try again.";
  if(c.includes("operation-not-allowed")) return "That sign-in method isn't switched on in Firebase yet.";
  if(c.includes("unauthorized-domain")) return "This website isn't approved for Google sign-in yet. Add it under Authorized domains in Firebase.";
  if(c.includes("account-exists-with-different-credential")) return "That email already has an account. Log in with your email and password.";
  return "Something went wrong. Try again.";
}
async function startAuth(){
  try{ await fbInit(); }catch(e){ screen = "auth"; authMsg = "Couldn't reach the online service. Check your connection."; render(); return; }
  firebase.auth().onAuthStateChanged(async u=>{
    user = u;
    if(accountRef){ accountRef.off(); accountRef = null; }
    if(!u){ account = null; screen = "auth"; render(); return; }
    accountRef = fb.ref(`users/${u.uid}`);
    accountRef.on("value", snap=>{
      const v = snap.val() || {};
      account = { name: v.name || u.displayName || u.email.split("@")[0], guests: v.guests || {} };
      if(!v.name) accountRef.child("name").set(account.name);
      if(screen==="loading" || screen==="auth") screen = "home";
      if(screen!=="game") render();
    });
    const so = savedOnline();
    if(so) fb.ref(`games/${so.code}/session/ended`).get().then(s=>{ if(s && s.val()) onlineSessionEnded(so.code); }).catch(()=>{});
  });
}
async function doAuth(kind){
  const email = (document.getElementById("au-email")||{}).value || "", pass = (document.getElementById("au-pass")||{}).value || "";
  const name = ((document.getElementById("au-name")||{}).value || "").trim();
  if(kind==="forgot"){
    if(!validEmail(email)){ authMsg = "Type your email above first."; render(); return; }
    try{ await firebase.auth().sendPasswordResetEmail(email.trim()); authMsg = "Check your email for a link to reset your password."; }
    catch(e){ authMsg = authError(e); }
    render(); return;
  }
  if(kind==="signup" && !name){ authMsg = "Enter your name."; render(); return; }
  authBusy = true; authMsg = ""; render();
  try{
    if(kind==="signup"){
      const cred = await firebase.auth().createUserWithEmailAndPassword(email.trim(), pass);
      await cred.user.updateProfile({ displayName:name });
      await fb.ref(`users/${cred.user.uid}`).update({ name, created: Date.now() });
    } else await firebase.auth().signInWithEmailAndPassword(email.trim(), pass);
  }catch(e){ authMsg = authError(e); }
  authBusy = false; render();
}
async function googleLogin(){
  authBusy = true; authMsg = ""; render();
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt:"select_account" });
  try{ await firebase.auth().signInWithPopup(prov); }
  catch(e){
    const c = (e && e.code) || "";
    if(c.includes("popup-blocked") || c.includes("operation-not-supported")){ try{ await firebase.auth().signInWithRedirect(prov); return; }catch(e2){ authMsg = authError(e2); } }
    else if(!c.includes("popup-closed") && !c.includes("cancelled-popup")) authMsg = authError(e);
  }
  authBusy = false; render();
}
async function saveEditing(){
  const e = editing; if(!e || !user) return;
  const name = ((document.getElementById("ed-name")||{}).value || "").trim();
  const email = ((document.getElementById("ed-email")||{}).value || "").trim();
  if(!name){ msg("Enter a name"); return; }
  if(email && !validEmail(email)){ msg("That email address doesn't look right"); return; }
  let key = e.key;
  try{
    if(key===meKey()){ await fb.ref(`users/${user.uid}/name`).set(name); user.updateProfile({ displayName:name }).catch(()=>{}); }
    else if(key){ await fb.ref(basePath(key)).update({ name, email }); }
    else { const r = fb.ref(`users/${user.uid}/guests`).push(); await r.set({ name, email, created: Date.now() }); key = `g:${user.uid}:${r.key}`; account.guests[r.key] = { name, email }; }
  }catch(err){ msg("Couldn't save. Check your connection."); return; }
  if(e.forRow!==undefined && e.forRow!==null){ setLink(e.forRow, key, name); }
  if(e.forJoin!==undefined && e.forJoin!==null && joinState){ joinState.links[e.forJoin] = key; }
  editing = null; dialog = joinState ? "join" : null; render();
}
function setLink(i, key, name){
  settings.links = settings.links || [];
  settings.links.forEach((k,j)=>{ if(key && k===key && j!==i) settings.links[j] = null; });
  settings.links[i] = key || null;
  if(key) settings.players[i] = name || (personByKey(key)||{}).name || settings.players[i];
  save();
}

async function historyFor(key){
  const s = await fb.ref(`${basePath(key)}/history`).get();
  return Object.entries(s.val() || {}).map(([sid,h])=>Object.assign({ sid }, h)).sort((a,b)=>b.date-a.date);
}
async function careerFor(key){ const h = await historyFor(key); return mergeCareer(null, h.flatMap(x=>x.raws||[])); }
async function showCareer(key){
  const p = personByKey(key);
  try{ const h = await historyFor(key); careerView = { key, name: p ? p.name : "", career: h.length ? mergeCareer(null, h.flatMap(x=>x.raws||[])) : null, history: h }; }

function askConfirm(text, button, run){ confirmAct = { text, button, run }; dialog = "confirm"; render(); }

const sleep = ms => new Promise(r=>setTimeout(r,ms));
let sending = false;
/* save stats + send reports for every player this account owns (the account holder and their guests) */
async function deliver(games, sentRef, sid){
  if(sending || !games.length || !user) return { sent:[], failed:[] };
  sending = true;
  const sent = [], failed = [];
  try{
    const who = g => g.members || g.players;
    const keys = [...new Set(games.flatMap(g=>who(g).map(p=>p.pid)).filter(k=>k && ownsKey(k)))];
    for(const key of keys){
      const person = personByKey(key); if(!person) continue;
      const mine = games.map(g=>({ g, p:who(g).find(p=>p.pid===key) })).filter(x=>x.p);
      await fb.ref(`${basePath(key)}/history/${sid}`).set(JSON.parse(JSON.stringify({ date: games[0].date,
        games: mine.map(x=>({ title:x.g.title, won:!!x.p.raw.won, place:x.p.place })), raws: mine.map(x=>x.p.raw) })));
      let career = null; try{ career = await careerFor(key); }catch(e){}
      const flag = key.replace(/[.#$\[\]\/:]/g,"_");
      if(sentRef){ const s = await sentRef.child(flag).get(); if(s.exists()) continue; await sentRef.child(flag).set(true); }
      if(canEmail() && person.email){
        try{ await sendEmail(person.email, `Darts results: ${games.length} game${games.length===1?"":"s"}`, reportHtml(games, key, career)); sent.push(person.name); }
        catch(e){ failed.push(person.name); }
        await sleep(1100);
      }
    }
  } finally { sending = false; }
  return { sent, failed };
}
