<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Darts Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Scoreboard look: black field, red active-player bar, white score panel; keypad docked at the bottom for thumbs. */
:root{
  --bg:#0b0b0c;
  --panel:#18181b;
  --panel-2:#2a2a2f;
  --line:#3a3a42;
  --chalk:#f2f0ea;
  --muted:#9a9aa3;
  --red:#c8102e;
  --red-dark:#6f0a19;
  --green:#0d6b35;
  --gold:#d9c21a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- setup ---------- */
.wrap{max-width:620px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:10px}
h1 .ring{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--red) 0 22%,var(--green) 23% 40%,var(--chalk) 41% 58%,#000 59% 100%);flex:none;border:1px solid var(--line)}
.label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 0;min-width:64px;padding:12px 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:20px}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.seg.small button{font-size:17px;padding:10px 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:22px;font-weight:600}
.stepper output{min-width:42px;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:14px}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:12px;font:inherit;font-size:17px}
.prow .x{width:44px;height:44px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-size:20px}
.ghost{padding:12px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.primary{padding:16px;border-radius:10px;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.secondary{padding:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.resume{border-color:var(--gold)}
.resume strong{color:var(--gold);font-family:var(--display);font-size:20px}

/* ---------- game shell ---------- */
#app{height:100%}
.game{max-width:620px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}
.game > *{flex:none}
.game > .board{flex:1 1 auto;min-height:60px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;padding:8px 8px 6px;border-bottom:2px solid var(--chalk)}
.hdr.many{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.side{display:flex;flex-direction:column;min-width:0}
.nmbar{background:transparent;color:var(--muted);font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;text-align:center;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.active .nmbar{background:var(--red);color:#fff}
.scorebox{display:flex;align-items:center;gap:6px;padding:2px 8px;min-height:84px}
.side.R .scorebox{flex-direction:row-reverse}
.side.active .scorebox{background:#ececec;color:#111}
.stk{display:flex;flex-direction:column;gap:2px;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:34px}
.side.R .stk{text-align:right}
.stk .avg{color:var(--red)}
.side.active .stk .avg{color:var(--red)}
.big{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.many .big{font-size:52px}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.rnd{min-width:58px;height:58px;padding:0 8px;border-radius:10px;background:linear-gradient(#d4142f,#8e0b1f);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:42px;color:#fff;box-shadow:0 2px 0 #4a0610}
.mode{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);letter-spacing:.04em;text-align:center}
.roundline{display:flex;justify-content:center;gap:12px;align-items:center;padding:6px;font-family:var(--display);font-weight:700;font-size:18px}
.roundline .mode{font-size:16px}
.board{flex:1;overflow-y:auto;min-height:0;position:relative}

/* 01 history */
.hist{width:100%;border-collapse:collapse;font-family:var(--display);font-variant-numeric:tabular-nums;table-layout:fixed}
.hist td{padding:3px 6px;text-align:center;font-size:24px;font-weight:600}
.hist td.sc{color:var(--muted);font-size:20px}
.hist td.lf{font-weight:700}
.hist td.rn{width:64px;color:var(--muted);font-size:20px;border-left:3px solid #8c8c93;border-right:3px solid #8c8c93}
.hist td.bust{color:var(--red);font-size:18px;font-weight:700;letter-spacing:.04em}
.hist tr.start td{color:var(--muted)}
.hist th{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist td.cell{font-size:22px}
.hist td.cell small{display:block;color:var(--muted);font-size:15px;line-height:1}

/* cricket grid */
.cg{display:grid;gap:6px 6px;padding:10px 8px;align-items:center}
.cg .mk{display:grid;place-items:center;height:52px}
.cg .mk svg{width:40px;height:40px}
.cg .lbl{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum{height:56px;border-radius:8px;background:linear-gradient(#d4142f,#8e0b1f);color:#fff;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;
  box-shadow:0 2px 0 #4a0610;text-shadow:0 0 8px rgba(255,255,255,.35)}
.cmod{height:38px;border-radius:6px;background:linear-gradient(#d4142f,#8e0b1f);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 2px 0 #4a0610}
.cg .dead{opacity:.3}
.cg .pts{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}

/* killer */
.kl{display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kr.play{grid-template-columns:minmax(0,1fr) 50px 68px 50px}
.kr.active{border-color:var(--red);box-shadow:inset 5px 0 0 var(--red);background:#241316}
.kr.out{opacity:.35}
.kinfo{display:flex;flex-direction:column;gap:4px;min-width:0;padding-left:4px}
.kname{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ksub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid #6a6a72}
.pip.on{background:var(--gold);border-color:var(--gold)}
.skull{width:36px;height:40px;vertical-align:middle;margin-left:4px;filter:drop-shadow(0 0 4px rgba(255,90,0,.7))}
.skull circle{filter:drop-shadow(0 0 2px #ff0000)}
.kchip{font-size:13px;font-weight:700;letter-spacing:.08em;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;vertical-align:middle}
.kchip.out{background:#55555c}
.knum{font-family:var(--display);font-weight:800;font-size:36px;min-width:56px;text-align:center;color:var(--gold)}
.pad.np{grid-template-columns:repeat(5,1fr)}
.pad.np .k{height:44px;font-size:28px}
.pad.np .bullk{grid-column:span 5;background:linear-gradient(#11793d,#0a4f27);color:#fff;border-color:#0a4f27}

/* halve-it */
.ht{width:100%;border-collapse:collapse;font-family:var(--display);font-variant-numeric:tabular-nums;table-layout:fixed}
.ht th{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);padding:8px 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht th.on{color:#fff;box-shadow:inset 0 -3px 0 var(--red)}
.ht td{text-align:center;padding:4px;font-size:24px;font-weight:700;border-bottom:1px solid #222227}
.ht td small{display:block;font-size:14px;color:var(--muted);font-weight:600;line-height:1}
.ht td small i{font-style:normal}
.ht td small.half{color:#ff3b4f;font-size:16px}
.ht td.rt,.ht th.rt{width:84px;text-align:left;padding-left:10px;font-size:20px;color:var(--muted)}
.ht tr.cur td{background:#241316}
.ht tr.cur td.rt{color:var(--gold);box-shadow:inset 4px 0 0 var(--red)}
.ht td.now{box-shadow:inset 0 0 0 2px var(--gold)}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mods button{height:40px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.mods button[data-hm="1"][aria-pressed="true"]{background:var(--chalk);color:#111}
.mods button[data-hm="2"][aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.mods button[data-hm="3"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.pad.big3{grid-template-columns:repeat(3,1fr)}
.pad.p3{grid-template-columns:repeat(3,1fr)}
.pad.big2{grid-template-columns:repeat(2,1fr)}
.pad.big3 .k,.pad.big2 .k{height:76px;font-size:36px;line-height:1}
.pad.big2 .k{font-size:26px}
.pad .k small{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.8}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{padding:10px 4px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:#fff;box-shadow:inset 0 -3px 0 var(--red)}
.seg.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.seg.games button{font-size:18px;min-width:0}
.rulesbtn{align-self:flex-start;padding:8px 2px;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sheet.rules{max-height:85vh;overflow-y:auto}
.sheet.rules ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.45}
.atc{display:flex;flex-direction:column;gap:10px;padding:12px 10px}
.atc .pr{display:flex;flex-direction:column;gap:6px}
.atc .pn{font-weight:600}
.atc .pr.on .pn{color:#fff}
.atc .chips{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.atc .c{height:28px;border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--panel-2);color:var(--muted)}
.atc .c.done{background:var(--red);color:#fff}
.atc .c.next{box-shadow:inset 0 0 0 2px var(--gold);color:#fff}
.pad.p4{grid-template-columns:repeat(4,1fr)}
.pad.p4 .k{height:76px;font-size:24px;line-height:1.05}
.pad.p4 .k small{font-size:13px}

.dock{position:relative}
.dock.locked > :not(.lockmsg){opacity:.25;pointer-events:none}
.lockmsg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:#fff;text-align:center;padding:12px}
.codechip{font-family:var(--display);font-weight:800;font-size:16px;color:#fff;background:rgba(0,0,0,.3);border-radius:6px;padding:3px 8px;letter-spacing:.08em;vertical-align:middle}
.codebig{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.2em;text-align:center;color:var(--gold);line-height:1}
.claims{display:flex;flex-direction:column;gap:6px}
.claim{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:17px}
.claim.on{background:var(--red);border-color:var(--red);color:#fff}
.claim .cs{font-size:13px;opacity:.85;font-weight:500}

.pblock{display:flex;flex-direction:column;gap:4px}
.pblock .em{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:9px 12px;font:inherit;font-size:15px}
.jform{display:flex;flex-direction:column;gap:6px}
.jform input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:11px 12px;font:inherit;font-size:16px}
.sheet.wide{max-width:680px;max-height:88vh;overflow-y:auto}
.mailview{background:#fff;color:#111;border-radius:8px;padding:12px;overflow-x:auto}
.statlist{display:flex;flex-wrap:wrap;gap:8px}

/* cricket board fills the space between header and scorer, so all 7 targets show without scrolling */
.board.fit{display:flex;flex-direction:column}
.board.fit .cg{flex:1 1 auto;min-height:0;width:100%;max-width:560px;margin:0 auto;padding:8px;gap:5px 6px}
.board.fit .cg > *{min-height:0}
.board.fit .cnum{height:100%;max-height:64px;font-size:clamp(24px,5.2vh,46px);align-self:center;width:100%}
.board.fit .cmod{height:72%;max-height:44px;min-height:26px;font-size:clamp(16px,3vh,22px);align-self:center;width:100%}
.board.fit .mk{height:100%;max-height:56px}
.board.fit .mk svg{height:min(40px,80%);width:auto}
.board.fit > .hint{flex:none}

.wrap.narrow{max-width:520px}
.ghost.small{padding:8px 12px;font-size:14px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px;border-radius:12px;background:var(--red);color:#fff}
.choice b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.03em}
.choice span{opacity:.9;font-size:15px}
.choice.alt{background:var(--panel);border:1px solid var(--line)}
.choice.alt span{color:var(--muted)}
.aform{display:flex;flex-direction:column;gap:8px}
.aform label{font-size:14px;font-weight:600;color:var(--muted)}
.aform input,select.em,.jform select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:12px;font:inherit;font-size:16px;width:100%}
.amsg{background:var(--red-dark);border:1px solid var(--red);border-radius:8px;padding:10px 12px;font-size:15px}
.tabs.two{grid-template-columns:1fr 1fr}
.pcard .pname{font-family:var(--display);font-weight:800;font-size:24px}
.wrapbtns{flex-wrap:wrap}
.wrapbtns button{flex:1 1 auto;padding:10px 12px;font-size:16px}
.danger{color:#ff6b7a !important;border-color:#7a2430 !important}
.hlist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}

.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{padding:14px;border-radius:10px;background:#fff;color:#1f1f1f;font-weight:600;font-size:17px;border:1px solid #dadce0}

/* bar + entry + keypad */
.bar{display:grid;grid-template-columns:44px 1fr auto 44px;align-items:center;gap:8px;margin:0 6px;padding:6px 8px;border-radius:10px 10px 0 0;background:linear-gradient(#c8102e,#8e0b1f)}
.bar .ib{width:36px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:20px;font-weight:700;background:rgba(0,0,0,.25);color:#fff}
.bar .bt{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bs{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.dock{margin:0 6px 6px;background:#2b2b30;padding:6px;display:flex;flex-direction:column;gap:6px;border-radius:0 0 10px 10px}
.entry{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:6px}
.back{height:58px;border-radius:6px;background:linear-gradient(#e2cf1e,#b3a011);color:#111;font-family:var(--display);font-weight:800;font-size:26px;border:1px solid #f2e45a}
.miss{height:58px;border-radius:6px;background:linear-gradient(#8e0b1f,#5a0613);color:#fff;font-family:var(--display);font-weight:800;font-size:26px;border:1px solid #c8102e}
.disp{height:58px;border-radius:6px;background:#000;border:1px solid #5a5a62;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;overflow:hidden;
  font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.disp.typed{font-size:42px;color:#fff}
.disp.co{font-size:26px}
.disp .dart{font-size:24px;color:#fff;background:var(--panel-2);border-radius:5px;padding:0 6px}
.disp .dart.void{color:var(--muted);text-decoration:line-through}
.disp .dart.empty{color:#55555c;background:transparent;border:1px dashed #44444b;min-width:44px;text-align:center}
.disp .dart{min-width:44px;text-align:center}
.throwing{text-align:center;font-size:15px;color:var(--muted)}
.throwing .tname{color:#fff;font-weight:700;font-size:17px}
.throwing b{color:var(--gold)}
.miss{line-height:1}
.disp .muted{color:var(--muted);font-size:20px;font-weight:600}
.pad{display:grid;grid-template-columns:.8fr 1fr 1fr 1fr .8fr;gap:4px}
.pad button{height:50px;border-radius:4px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pad .q{font-size:28px;color:#d6d6dc;background:transparent}
.pad .k{font-size:34px;color:#111;background:linear-gradient(#f4f4f4,#bdbdc2);border:1px solid #8d8d93}
.pad .k.g{background:linear-gradient(#11793d,#0a4f27);color:#fff;border-color:#0a4f27}
.pad .k.r{background:linear-gradient(#a20d26,#5a0613);color:#fff;border-color:#5a0613}
.pad .enter{grid-column:span 2;font-size:26px;letter-spacing:.06em;background:linear-gradient(#11793d,#0a4f27);color:#fff;border:1px solid #0a4f27}
.pad button:active,.cnum:active,.cmod:active,.back:active,.miss:active{filter:brightness(1.25);transform:translateY(1px)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--red);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:32px;text-wrap:balance;line-height:1.1}
.sheet .bigl{font-family:var(--display);font-weight:700;font-size:22px;color:var(--gold)}
.stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.stats th,.stats td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats th{color:var(--muted);font-weight:500;font-size:13px}
.btns{display:flex;flex-direction:column;gap:8px}
.dchoice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dchoice button{height:64px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:34px}
.toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:60px;color:var(--gold);
  text-shadow:0 4px 24px #000;pointer-events:none;z-index:20;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.toast.bad{color:#ff3b4f}
.toast.msg{font-size:22px;font-weight:700;color:#fff;background:var(--red-dark);border:1px solid var(--red);padding:10px 16px;border-radius:10px;white-space:normal;max-width:90vw;text-align:center;animation-duration:2.2s}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.7)}12%{opacity:1;transform:translateX(-50%) scale(1.04)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media (max-width:380px){.big{font-size:56px}.nmbar{font-size:24px}.pad button{height:46px}.cnum{height:50px;font-size:40px}}
</style>

<body>
<div id="app"></div>
<script>
(() => {
"use strict";
const TARGETS = [20,19,18,17,16,15,25];
const CATS = [
  ["x01","X01",["601","501","301","101"]],
  ["cricket","Cricket",["cricket","cutthroat"]],
  ["party","Party",["killer","halveit","shanghai","baseball","golf"]],
  ["practice","Practice",["atc","bobs","countup"]]
];
const catOf = g => (CATS.find(c=>c[2].includes(g)) || CATS[0])[0];
const KEY = "dartsScorer.v2";
const app = document.getElementById("app");

let settings = { game:"501", inMode:"straight", outMode:"double", points:true, lives:3, shRounds:7, cuRounds:8, sets:1, legs:3, emails:[], players:["Home","Away"] };
let match = null, hist = [], screen = "setup", dialog = null, entry = "", pending = null, mod = 1;

/* ---------- storage ---------- */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({settings, match, hist:hist.slice(-60)})); }catch(e){} recordIfOver(); if(online && screen==="game") pushState(); }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if(d){ if(d.settings) settings = Object.assign(settings, d.settings); if(d.match){ match = d.match; hist = d.hist || []; } }
  }catch(e){}
}

/* ---------- online play (Firebase Realtime Database) ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC8Sr2pECf2HQO8fUOI8vSeaainMrXQUSs",
  authDomain: "darts-scorer-c9db4.firebaseapp.com",
  databaseURL: "https://darts-scorer-c9db4-default-rtdb.firebaseio.com",
  projectId: "darts-scorer-c9db4",
  storageBucket: "darts-scorer-c9db4.firebasestorage.app",
  messagingSenderId: "1060133831533",
  appId: "1:1060133831533:web:69c6586d7ed8fcff5b5064"
};
const ONLINE_KEY = "dartsScorer.online", ONLINE_HIST = 20;
let online = null;        // { code, rev }
let fb = null;            // firebase.database()
let gameRef = null;
let remoteClaims = {};    // player index -> device id
let joinState = null;     // { code, players, claims, pick:[] } while joining
const deviceId = (() => {
  try{ let d = localStorage.getItem("dartsScorer.device"); if(!d){ d = Math.random().toString(36).slice(2,10); localStorage.setItem("dartsScorer.device", d); } return d; }
  catch(e){ return Math.random().toString(36).slice(2,10); }
})();
const onlineAvailable = () => !!FIREBASE_CONFIG;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function fbInit(){
  if(fb) return fb;
  await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = firebase.database();
  return fb;
}
function newCode(){ const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = ""; for(let i=0;i<4;i++) c += A[Math.floor(Math.random()*A.length)]; return c; }
function myClaims(){ return Object.keys(remoteClaims).filter(k=>remoteClaims[k]===deviceId).map(Number); }
function isMyTurn(){ return !online || (match && myClaims().includes(match.cur)); }
function saveOnline(){ try{ if(online) localStorage.setItem(ONLINE_KEY, JSON.stringify({ code:online.code })); else localStorage.removeItem(ONLINE_KEY); }catch(e){} }
function savedOnline(){ try{ return JSON.parse(localStorage.getItem(ONLINE_KEY) || "null"); }catch(e){ return null; } }
function pushState(){
  if(!online || !fb || !match) return;
  online.rev = (online.rev||0) + 1;
  fb.ref(`games/${online.code}/state`).set({
    match: JSON.stringify(match), hist: JSON.stringify(hist.slice(-ONLINE_HIST)),
    rev: online.rev, by: deviceId, updated: firebase.database.ServerValue.TIMESTAMP
  }).catch(()=>msg("Couldn't send that. Check your connection and try again."));
}
function stopListening(){ if(gameRef){ gameRef.child("state").off(); gameRef.child("claims").off(); gameRef.child("session/ended").off(); gameRef = null; } }
function listen(){
  stopListening();
  gameRef = fb.ref(`games/${online.code}`);
  gameRef.child("state").on("value", snap=>{
    const d = snap.val(); if(!d || !online) return;
    if(d.by===deviceId && d.rev<=online.rev) return; // our own write coming back
    online.rev = Math.max(online.rev||0, d.rev||0);
    match = JSON.parse(d.match); hist = JSON.parse(d.hist || "[]"); entry = ""; pending = null;
    try{ localStorage.setItem(KEY, JSON.stringify({settings, match, hist})); }catch(e){}
    if(screen==="game") render();
  });
  gameRef.child("claims").on("value", snap=>{ remoteClaims = snap.val() || {}; if(screen==="game") render(); });
  const code = online.code;
  gameRef.child("session/ended").on("value", snap=>{ if(snap.val() && online && online.code===code) onlineSessionEnded(code); });
}
function goOffline(){ stopListening(); online = null; remoteClaims = {}; saveOnline(); }
async function hostOnline(){
  if(settings.game==="killer" && settings.players.length<2) return;
  try{ await fbInit(); }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  goOffline();
  let code = newCode();
  try{
    for(let k=0;k<6;k++){ const s = await fb.ref(`games/${code}/state`).get(); if(!s.exists()) break; code = newCode(); }
  }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  online = { code, rev:0, host:true };
  await preparePids();
  startMatch();            // builds the match and pushes it
  fb.ref(`games/${code}/session/host`).set(deviceId);
  remoteClaims = { 0: deviceId };
  await fb.ref(`games/${code}/claims/0`).set(deviceId);
  listen(); saveOnline(); dialog = "share"; render();
}
async function lookupGame(raw){
  const code = (raw||"").trim().toUpperCase();
  if(code.length!==4){ msg("Game codes are 4 characters"); return; }
  try{ await fbInit(); }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  let d;
  try{ const snap = await fb.ref(`games/${code}`).get(); d = snap.val(); }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  if(!d || !d.state){ msg(`No game found with code ${code}`); return; }
  const m = JSON.parse(d.state.match);
  if(d.session && d.session.ended){ msg("That game's session has already ended"); return; }
  joinState = { code, players: m.players.map(p=>p.name), claims: d.claims || {}, pick: [], links: {}, state: d.state };
  dialog = "join"; render();
}
async function confirmJoin(){
  const j = joinState; if(!j) return;
  goOffline();
  online = { code:j.code, rev:j.state.rev||0 };
  match = JSON.parse(j.state.match); hist = JSON.parse(j.state.hist || "[]");
  remoteClaims = Object.assign({}, j.claims);
  for(const i of j.pick){
    const key = j.links[i] || null, person = key ? personByKey(key) : null;
    match.players[i].name = person ? person.name : j.players[i]; match.players[i].pid = key;
    remoteClaims[i] = deviceId; await fb.ref(`games/${j.code}/claims/${i}`).set(deviceId);
  }
  listen(); saveOnline(); joinState = null; dialog = null; screen = "game"; entry = "";
  if(j.pick.length) save();
  render();
}
async function rejoinOnline(){
  const s = savedOnline(); if(!s) return;
  try{ await fbInit(); }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  try{
    const snap = await fb.ref(`games/${s.code}`).get(), d = snap.val();
    if(!d || !d.state){ msg("That online game has ended."); goOffline(); render(); return; }
    if(d.session && d.session.ended){ onlineSessionEnded(s.code); return; }
    online = { code:s.code, rev:d.state.rev||0, host: d.session && d.session.host===deviceId };
    match = JSON.parse(d.state.match); hist = JSON.parse(d.state.hist || "[]"); remoteClaims = d.claims || {};
  }catch(e){ msg("Couldn't reach the online service. Check your connection."); return; }
  listen(); screen = "game"; render();
}
function toggleClaim(i){
  if(!online) return;
  const owner = remoteClaims[i];
  if(owner && owner!==deviceId){ msg(`${match.players[i].name} is already playing on another device`); return; }
  const ref = fb.ref(`games/${online.code}/claims/${i}`);
  if(owner===deviceId){ delete remoteClaims[i]; ref.remove(); } else { remoteClaims[i] = deviceId; ref.set(deviceId); }
  render();
}
function claimRows(names, claims, mine){
  return names.map((n,i)=>{
    const owner = claims[i], isMine = mine.includes(i), other = owner && owner!==deviceId && !isMine;
    return `<button type="button" class="claim ${isMine?"on":""}" data-claim="${i}" ${other?"disabled":""}>
      <span>${esc(n)}</span><span class="cs">${isMine ? "This phone" : other ? "Another phone" : "Open"}</span></button>`;
  }).join("");
}
function onlineOverlay(){
  if(dialog==="join" && joinState){
    const j = joinState;
    return `<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="jh">
      <h2 id="jh">Join game ${esc(j.code)}</h2><div class="hint">Tap the player or players throwing on this phone. You can also join just to watch.</div>
      <div class="claims">${claimRows(j.players, j.claims, j.pick)}</div>
      ${j.pick.map(i=>`<div class="jform"><label class="label" for="jl-${i}">${esc(j.players[i])} is</label>
        <select id="jl-${i}" data-jl="${i}">${linkOptions(j.links[i]||"", true)}</select></div>`).join("")}
      ${j.pick.length ? `<div class="hint">Stats and the results email go to whoever you pick here.</div>` : ""}
      <div class="btns"><button type="button" class="primary" data-act="confirmJoin">${j.pick.length ? "Join game" : "Watch game"}</button>
      <button type="button" class="secondary" data-act="closeDlg">Cancel</button></div></div></div>`;
  }
  if(dialog==="share" && online && match){
    const link = location.href.split("#")[0];
    return `<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
      <h2 id="sh">Online game</h2>
      <div class="codebig">${esc(online.code)}</div>
      <div class="hint">Friends open <b>${esc(link)}</b>, tap Join, and enter this code.</div>
      <button type="button" class="secondary" data-act="copyInvite">Copy invite</button>
      <div class="label">Players on this phone</div>
      <div class="claims">${claimRows(match.players.map(p=>p.name), remoteClaims, myClaims())}</div>
      <div class="btns"><button type="button" class="primary" data-act="closeDlg">Done</button></div></div></div>`;
  }
  return "";
}

/* ---------- players, sessions, stats and emailed results ---------- */
const EMAILJS = { serviceId:"service_akr7m1u", templateId:"template_1heaox6", publicKey:"Knh8ECtjWb5JNZ_-k" };
const PROFILES_KEY = "dartsScorer.profiles", SESSION_KEY = "dartsScorer.session";
let ddAsk = null;           // { li, min, max } darts-at-double question for the last X01 turn
let summaryHtml = null;     // session summary shown on screen after ending
let careerView = null;      // { name, career } being shown
const recordedIds = new Set();
const profilesOn = () => onlineAvailable();
/* sessions: local ones live on this phone, online ones live with the game code */
function loadLocalSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){ return null; } }
function saveLocalSession(s){ try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){} }
function recordIfOver(){
  if(!profilesOn() || !match) return;
  const done = match.over && match.over.type==="match";
  if(done && !recordedIds.has(match.id)){
    const rec = buildRecord(match);
    recordedIds.add(match.id);
    if(online){ fb.ref(`games/${online.code}/session/games/${match.id}`).set(JSON.stringify(rec)); }
    else { const s = loadLocalSession() || { id: match.id, started: Date.now(), games: [] }; s.games = s.games.filter(g=>g.id!==rec.id).concat([rec]); saveLocalSession(s); }
  } else if(!done && recordedIds.has(match.id)){
    recordedIds.delete(match.id);
    if(online) fb.ref(`games/${online.code}/session/games/${match.id}`).remove();
    else { const s = loadLocalSession(); if(s){ s.games = s.games.filter(g=>g.id!==match.id); saveLocalSession(s); } }
  }
}

/* ---- stats ---- */
const r1 = n => Math.round(n*10)/10, r2 = n => Math.round(n*100)/100;
function placeOrder(m){
  const P = m.leg.p, n = m.players.length, g = m.game, idx = [...Array(n).keys()];
  if(!oneGame(g)) return idx.slice().sort((a,b)=>(m.players[b].sets-m.players[a].sets) || (m.players[b].legsTotal-m.players[a].legsTotal));
  if(g==="killer"){
    const outs = (m.tlog||[]).filter(e=>e.k==="out").map(e=>e.p);
    return idx.filter(i=>!outs.includes(i)).concat(outs.slice().reverse());
  }
  if(g==="atc") return idx.slice().sort((a,b)=>(P[b].pos-P[a].pos) || (P[a].darts-P[b].darts));
  if(g==="golf") return idx.slice().sort((a,b)=>P[a].total-P[b].total);
  if(g==="bobs") return idx.slice().sort((a,b)=>((P[a].out?1:0)-(P[b].out?1:0)) || (P[b].turns-P[a].turns) || (P[b].total-P[a].total));
  return idx.slice().sort((a,b)=>P[b].total-P[a].total);
}
function playerStats(m, i){
  const g = m.game, T = (m.tlog||[]).filter(e=>e.p===i), pl = m.players[i], P = m.leg.p[i];
  const legsWon = (m.tlog||[]).filter(e=>e.k==="leg" && e.p===i);
  const raw = { game:g, won:false };
  const rows = [];
  if(is01(g)){
    const t = T.filter(e=>e.k==="01");
    const darts = t.reduce((a,e)=>a+(e.co?e.darts:3),0), pts = t.reduce((a,e)=>a+(e.bust?0:e.v),0);
    const byLeg = {}; t.forEach(e=>{ const k=e.s+"-"+e.l; (byLeg[k]=byLeg[k]||[]).push(e); });
    let f9p=0, f9d=0; Object.values(byLeg).forEach(a=>a.slice(0,3).forEach(e=>{ f9p += e.bust?0:e.v; f9d += e.co?e.darts:3; }));
    const c180 = t.filter(e=>!e.bust && e.v===180).length, c140 = t.filter(e=>!e.bust && e.v>=140 && e.v<180).length, c100 = t.filter(e=>!e.bust && e.v>=100 && e.v<140).length;
    const hi = Math.max(0,...t.filter(e=>!e.bust).map(e=>e.v)), cos = t.filter(e=>e.co), hiCo = Math.max(0,...cos.map(e=>e.v));
    const dd = t.reduce((a,e)=>a+(e.dd||0),0), best = legsWon.length ? Math.min(...legsWon.map(e=>e.darts)) : null;
    rows.push(["3-dart avg", darts ? r1(pts/darts*3) : 0], ["First 9 avg", f9d ? r1(f9p/f9d*3) : 0], ["Legs won", legsWon.length]);
    if(m.opts.sets>1) rows.push(["Sets won", pl.sets]);
    rows.push(["180s", c180], ["140+", c140], ["100+", c100], ["Highest score", hi], ["Highest checkout", hiCo || "–"], ["Best leg", best ? best+" darts" : "–"]);
    if(m.opts.outMode==="double") rows.push(["Checkout %", dd ? Math.round(cos.length/dd*100)+"% ("+cos.length+"/"+dd+")" : "–"]);
    rows.push(["Darts thrown", darts]);
    raw.x01 = { darts, pts, c180, c140, c100, hi, hiCo, best, co:cos.length, dd, legs: new Set((m.tlog||[]).filter(e=>e.k==="leg").map(e=>e.s+"-"+e.l)).size, legsWon:legsWon.length };
  } else if(isCricket(g)){
    const t = T.filter(e=>e.k==="cr");
    const darts = t.reduce((a,e)=>a+e.d.length,0), marks = t.reduce((a,e)=>a+e.marks,0);
    rows.push(["MPR", darts ? r2(marks/darts*3) : 0], ["Legs won", legsWon.length]);
    if(m.opts.sets>1) rows.push(["Sets won", pl.sets]);
    rows.push(["Total marks", marks], ["5+ mark turns", t.filter(e=>e.marks>=5).length], ["Best turn", Math.max(0,...t.map(e=>e.marks))+" marks"], ["Darts thrown", darts]);
    raw.cr = { darts, marks, legsWon:legsWon.length };
  } else if(g==="killer"){
    rows.push(["Lives taken", P.taken], ["Darts thrown", P.darts]);
    raw.score = P.taken;
  } else if(g==="halveit"){
    const t = T.filter(e=>e.k==="hv");
    rows.push(["Final score", P.total], ["Times halved", t.filter(e=>e.halved).length], ["Best round", Math.max(0,...t.map(e=>e.score))], ["Darts thrown", P.darts]);
    raw.score = P.total;
  } else if(g==="atc"){
    rows.push(["Reached", P.pos>=ATC_T.length ? "Finished" : (ATC_T[P.pos]===25?"Bull":ATC_T[P.pos])], ["Darts thrown", P.darts]);
    raw.score = P.pos>=ATC_T.length ? P.darts : null; raw.lower = true;
  } else {
    const lbl = g==="golf" ? "Strokes" : g==="baseball" ? "Runs" : "Final score";
    rows.push([lbl, P.out ? `Out (${P.total})` : P.total], ["Darts thrown", P.darts]);
    raw.score = P.out ? null : P.total; raw.lower = g==="golf";
  }
  return { rows, raw };
}
function breakdown(m){
  const T = m.tlog || [], names = m.players.map(p=>p.name), out = [];
  const keys = []; T.forEach(e=>{ const k = e.s+"-"+e.l; if(!keys.includes(k)) keys.push(k); });
  keys.forEach(k=>{
    const [s,l] = k.split("-"), E = T.filter(e=>e.s+"-"+e.l===k);
    const legEnd = E.find(e=>e.k==="leg");
    const head = oneGame(m.game) ? "Turn by turn" : `${m.opts.sets>1?`Set ${s}, `:""}Leg ${l}${legEnd?` · won by ${names[legEnd.p]} (${legEnd.darts} darts)`:""}`;
    const lines = names.map((n,i)=>{
      const t = E.filter(e=>e.p===i && ["01","cr","ki","hv","rg"].includes(e.k));
      const v = t.map(e=> e.k==="01" ? (e.bust ? "B" : e.co ? `✓${e.v}` : e.v)
        : e.k==="cr" ? e.marks
        : e.k==="ki" ? e.d.join(" ")
        : e.k==="hv" ? (e.halved ? "½" : "+"+e.score)
        : e.tag);
      const sep = (m.game==="killer" || m.game==="atc") ? " | " : " ";
      const outE = E.find(e=>e.k==="out" && e.p===i);
      return `${n}: ${v.join(sep) || "–"}${outE ? " (out)" : ""}`;
    });
    out.push({ head, lines });
  });
  return out;
}
function buildRecord(m){
  const order = placeOrder(m), o = m.over || {};
  const winners = o.tie ? o.tie : [o.winner];
  const result = o.tie ? `Tie: ${o.tie.map(i=>m.players[i].name).join(" & ")}`
    : `${m.players[o.winner].name} won` + (!oneGame(m.game) ? (m.opts.sets>1 ? ` ${m.players.map(p=>p.sets).join("–")} in sets` : ` ${m.players.map(p=>p.legsTotal).join("–")} in legs`) : "");
  const stats = m.players.map((p,i)=>playerStats(m,i));
  stats.forEach((st,i)=>{ st.raw.won = winners.includes(i); st.raw.place = order.indexOf(i)+1; });
  stats.forEach((st,i)=>{ if(oneGame(m.game)) st.raw.darts = m.leg.p[i].darts; });
  return { id:m.id, game:m.game, opts:m.opts, title:gameName(m.game, m.opts), date:m.started||Date.now(), end:Date.now(), result, tlog:m.tlog||[],
    players: m.players.map((p,i)=>({ name:p.name, pid:p.pid||null, place: order.indexOf(i)+1, rows: stats[i].rows, raw: stats[i].raw })),
    breakdown: breakdown(m) };
}

/* ---- career ---- */
function mergeCareer(c, raws){
  c = c || {};
  c.matches = (c.matches||0) + raws.length; c.wins = (c.wins||0) + raws.filter(r=>r.won).length;
  raws.forEach(r=>{
    if(r.x01){ const x = c.x01 = c.x01 || {}; const a = r.x01;
      ["darts","pts","c180","c140","c100","co","dd","legs","legsWon"].forEach(k=>x[k]=(x[k]||0)+(a[k]||0));
      x.hi = Math.max(x.hi||0, a.hi||0); x.hiCo = Math.max(x.hiCo||0, a.hiCo||0);
      if(a.best) x.best = x.best ? Math.min(x.best, a.best) : a.best; }
    if(r.cr){ const x = c.cr = c.cr || {}; ["darts","marks","legsWon"].forEach(k=>x[k]=(x[k]||0)+(r.cr[k]||0)); }
    const gm = (c.games = c.games || {})[r.game] = (c.games||{})[r.game] || {};
    gm.played = (gm.played||0)+1; gm.won = (gm.won||0)+(r.won?1:0);
    if(r.score!==undefined && r.score!==null) gm.best = gm.best===undefined ? r.score : (r.lower ? Math.min(gm.best, r.score) : Math.max(gm.best, r.score));
  });
  c.updated = Date.now();
  return c;
}
function careerRows(c){
  if(!c) return [];
  const rows = [["Matches played", c.matches||0], ["Matches won", c.wins||0]];
  if(c.x01 && c.x01.darts){ const x = c.x01;
    rows.push(["X01 average", r1(x.pts/x.darts*3)], ["X01 legs won", x.legsWon||0], ["180s", x.c180||0], ["140+", x.c140||0], ["100+", x.c100||0], ["Highest score", x.hi||0], ["Highest checkout", x.hiCo||"–"], ["Best leg", x.best ? x.best+" darts" : "–"]);
    if(x.dd) rows.push(["Checkout %", Math.round(x.co/x.dd*100)+"%"]); }
  if(c.cr && c.cr.darts) rows.push(["Cricket MPR", r2(c.cr.marks/c.cr.darts*3)], ["Cricket legs won", c.cr.legsWon||0]);
  Object.keys(c.games||{}).filter(g=>!is01(g) && !isCricket(g)).forEach(g=>{ const x = c.games[g];
    rows.push([`${NAMES[g]||g}`, `${x.won||0} won of ${x.played||0}${x.best!==undefined ? ` · best ${x.best}` : ""}`]); });
  return rows;
}
async function updateCareer(pid, name, raws){
  await fbInit();
  let result = null;
  await fb.ref(`players/${pid}`).transaction(cur=>{ cur = cur || {}; cur.name = name; cur.career = mergeCareer(cur.career, raws); result = cur.career; return cur; });
  return result;
}

const H = s => esc(s);
/* ---- recap report (email + on-screen) ---- */
const NAVY = "#1f3a5f", RED = "#b3122a";
const fmtTime = t => new Date(t).toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
const fmtDur = ms => { const m = Math.max(0, Math.round(ms/60000)); return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; };
const parseDart = l => { if(!l || l==="Miss") return {n:0,m:0}; if(l==="Bull") return {n:25,m:2}; if(l==="25") return {n:25,m:1};
  const m = l[0]==="T" ? 3 : l[0]==="D" ? 2 : 1; return { n: +(m>1 ? l.slice(1) : l), m }; };
const crHit = d => { const h = d.map(parseDart).filter(x=>x.n>=15); return h.length ? h.map(x=>x.n===25 ? (x.m===2?"DB":"SB") : (x.m===3?"T":x.m===2?"D":"S")+x.n).join(", ") : "∅"; };
function legsOf(rec){
  const T = rec.tlog || [], keys = [];
  T.forEach(e=>{ const k = e.s+"-"+e.l; if(!keys.includes(k)) keys.push(k); });
  return keys.map(k=>{
    const E = T.filter(e=>e.s+"-"+e.l===k), [s,l] = k.split("-").map(Number);
    const turns = E.filter(e=>["01","cr","ki","hv","rg"].includes(e.k));
    const end = E.find(e=>e.k==="leg");
    return { s, l, E, turns, winner: end ? end.p : null, starter: turns.length ? turns[0].p : null };
  });
}
function legPlayerStats(rec, leg, i){
  const t = leg.turns.filter(e=>e.p===i);
  if(is01(rec.game)){
    const darts = t.reduce((a,e)=>a+(e.co?e.darts:3),0), pts = t.reduce((a,e)=>a+(e.bust?0:e.v),0);
    const left = t.length ? t[t.length-1].left : +rec.game;
    return { darts, pts, avg: darts ? pts/darts*3 : 0, score: left, rounds: t.length };
  }
  if(isCricket(rec.game)){
    const darts = t.reduce((a,e)=>a+e.d.length,0), marks = t.reduce((a,e)=>a+e.marks,0);
    const last = leg.turns.filter(e=>e.pts).slice(-1)[0];
    return { darts, marks, avg: darts ? marks/darts*3 : 0, score: last ? last.pts[i] : 0, rounds: t.length };
  }
  return { darts:0, avg:0, score:"", rounds:t.length };
}
const TH = (txt, extra="") => `<th bgcolor="${NAVY}" style="color:#fff;padding:5px 6px;font-weight:normal;${extra}">${txt}</th>`;
const TD = (txt, extra="") => `<td style="padding:3px 6px;${extra}">${txt}</td>`;
const TBL = inner => `<table cellspacing="0" style="border-collapse:collapse;font-size:13px;width:100%;margin:6px 0 14px">${inner}</table>`;
const SEC = t => `<div style="font-size:19px;font-weight:bold;margin:22px 0 4px;padding-bottom:4px;border-bottom:3px solid ${RED}">${t}</div>`;
function gameType(rec){ return is01(rec.game) ? rec.game : NAMES[rec.game] || rec.game; }

function reportHtml(games, forPid, career){
  games = games.slice().sort((a,b)=>a.date-b.date);
  const start = games.length ? Math.min(...games.map(g=>g.date)) : Date.now(), end = games.length ? Math.max(...games.map(g=>g.end||g.date)) : Date.now();
  const names = [...new Set(games.flatMap(g=>g.players.map(p=>p.name)))];
  const legsAll = games.map(g=>legsOf(g));
  const totalLegs = legsAll.reduce((a,L)=>a+L.length,0);
  const totalDarts = games.reduce((a,g)=>a+g.players.reduce((b,p)=>b+(p.raw.darts||(p.raw.x01&&p.raw.x01.darts)||(p.raw.cr&&p.raw.cr.darts)||0),0),0);

  /* aggregate per player */
  const agg = {}; names.forEach(n=>agg[n] = { wins:0, games:0, legs:0, pts:0, d01:0, marks:0, dcr:0 });
  games.forEach(g=>g.players.forEach(p=>{ const a = agg[p.name]; a.games++; if(p.raw.won) a.wins++;
    if(p.raw.x01){ a.pts += p.raw.x01.pts; a.d01 += p.raw.x01.darts; a.legs += p.raw.x01.legsWon; }
    if(p.raw.cr){ a.marks += p.raw.cr.marks; a.dcr += p.raw.cr.darts; a.legs += p.raw.cr.legsWon; } }));
  const tot = Object.values(agg).reduce((t,a)=>{ ["pts","d01","marks","dcr","legs"].forEach(k=>t[k]+=a[k]); return t; }, {pts:0,d01:0,marks:0,dcr:0,legs:0});
  const avg = (p,d) => d ? r2(p/d*3).toFixed(2) : "–";

  let h = `<div style="font-family:Arial,Helvetica,sans-serif;color:#111;max-width:700px">`;
  h += `<div style="text-align:center;font-size:26px;font-weight:bold;margin:4px 0 10px">Match Report</div>`;
  h += `<table style="font-size:14px;width:100%;margin-bottom:8px"><tr>
    <td><b>Date:</b> ${H(new Date(start).toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short", year:"numeric"}))}<br><b>Start:</b> ${fmtTime(start)}<br><b>End:</b> ${fmtTime(end)}</td>
    <td><b>Length:</b> ${fmtDur(end-start)}<br><b>Players:</b> ${names.length}</td>
    <td><b>Games:</b> ${games.length}<br><b>Legs:</b> ${totalLegs}<br><b>Darts:</b> ${totalDarts}</td></tr></table>`;
  if(forPid){
    const mine = games.map(g=>g.players.find(p=>p.pid===forPid)).filter(Boolean);
    if(mine.length) h += `<div style="background:#eef2f7;border-left:4px solid ${NAVY};padding:8px 10px;margin:6px 0">Your night: <b>${mine.length}</b> game${mine.length===1?"":"s"}, <b>${mine.filter(p=>p.raw.won).length}</b> won.</div>`;
  }

  /* summary */
  h += SEC("Summary");
  h += TBL(`<tr>${TH("Player","text-align:left")}${TH("Wins")}${TH("Legs")}${TH("'01 Points")}${TH("Darts")}${TH("3DA")}${TH("Marks")}${TH("Darts")}${TH("MPR")}</tr>`
    + names.map((n,k)=>{ const a = agg[n]; return `<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(H(n),"font-weight:bold")}${TD(a.wins,"text-align:center")}${TD(a.legs,"text-align:center")}${TD(a.pts||"–","text-align:right")}${TD(a.d01||"–","text-align:right")}${TD(avg(a.pts,a.d01),"text-align:right")}${TD(a.marks||"–","text-align:right")}${TD(a.dcr||"–","text-align:right")}${TD(avg(a.marks,a.dcr),"text-align:right")}</tr>`; }).join("")
    + `<tr style="border-top:2px solid ${NAVY}">${TD("All games","font-size:12px")}${TD(games.length,"text-align:center")}${TD(totalLegs,"text-align:center")}${TD(tot.pts||"–","text-align:right")}${TD(tot.d01||"–","text-align:right")}${TD(avg(tot.pts,tot.d01),"text-align:right")}${TD(tot.marks||"–","text-align:right")}${TD(tot.dcr||"–","text-align:right")}${TD(avg(tot.marks,tot.dcr),"text-align:right")}</tr>`);

  /* leg-by-leg grid */
  let grid = "";
  games.forEach((g,gi)=>{
    const L = legsAll[gi], pn = g.players.map(p=>p.name);
    if(!is01(g.game) && !isCricket(g.game)){
      grid += `<tr bgcolor="#fff" style="border-top:2px solid #ccd">${TD(`<b>${gi+1}</b>`)}${TD(H(gameType(g)))}${TD(g.players.map(p=>`${p.raw.won?"★ ":""}${H(p.name)}: ${H(p.rows[0][1])}`).join(" &nbsp;·&nbsp; "),"")}</tr>`;
      return;
    }
    L.forEach((leg,li)=>{
      const cells = pn.map((n,i)=>{ const st = legPlayerStats(g, leg, i);
        const mark = (leg.starter===i ? `<span style="color:${RED}">♦</span>` : "") + (leg.winner===i ? `<span style="color:${RED}">★</span>` : "");
        return `${mark} ${H(n)} <b style="color:${leg.winner===i?RED:"#111"}">${st.score}</b> <span style="color:#666">(${(st.avg||0).toFixed(2)}, ${st.darts}d)</span>`; }).join(" &nbsp;|&nbsp; ");
      grid += `<tr bgcolor="${li%2?"#f3f5f8":"#fff"}" ${li===0?'style="border-top:2px solid #ccd"':""}>${TD(`<b>${gi+1}.${g.opts && g.opts.sets>1 ? leg.s+"."+leg.l : leg.l}</b>`)}${TD(H(gameType(g)))}${TD(cells)}</tr>`;
    });
  });
  h += SEC("Leg by leg");
  h += `<div style="font-size:12px;color:#555">♦ threw first · ★ won the leg · numbers are score left (cricket: points), then 3-dart average or MPR and darts thrown</div>`;
  h += TBL(`<tr>${TH("Leg","text-align:left")}${TH("Game","text-align:left")}${TH("Result","text-align:left")}</tr>${grid}`);

  /* game detail */
  let detail = "";
  const detailFor = (g, gi) => {
    let out = "";
    const pn = g.players.map(p=>p.name), L = legsAll[gi];
    if(!L.length) return "";
    L.forEach(leg=>{
      const per = pn.map((_,i)=>leg.turns.filter(e=>e.p===i));
      const rounds = Math.max(...per.map(a=>a.length));
      const label = oneGame(g.game) ? `Game ${gi+1} · ${H(g.title)}` : `Game ${gi+1}.${g.opts && g.opts.sets>1 ? leg.s+"."+leg.l : leg.l} · ${H(g.title)}`;
      const sts = pn.map((_,i)=>legPlayerStats(g, leg, i));
      let rows = "";
      if(is01(g.game)) rows += `<tr bgcolor="#eef2f7">${TD("","color:#888")}${pn.map(()=>TD("")+TD(g.game,"text-align:right;font-weight:bold")).join("")}</tr>`;
      for(let r=0;r<rounds;r++){
        rows += `<tr bgcolor="${r%2?"#f6f7f9":"#fff"}">${TD(r+1,"color:#888;text-align:center")}${per.map(a=>{ const e = a[r];
          if(!e) return TD("")+TD("");
          if(e.k==="01"){
            const turn = e.bust ? `<span style="color:${RED}">Bust</span>` : e.v;
            const style = e.co ? `color:#fff;background:${RED};font-weight:bold;text-align:right` : e.v>=100 && !e.bust ? "text-align:right;font-weight:bold" : "text-align:right";
            return TD(turn + (e.co ? ` <span style="font-size:11px">DO(${e.darts})</span>` : ""), "text-align:right") + TD(e.left, style);
          }
          if(e.k==="cr") return TD(H(crHit(e.d)) + (e.marks>=5 ? ` <b style="color:${RED}">${e.marks}M</b>` : ""), "font-size:12px") + TD(e.pts ? e.pts[e.p] : "", "text-align:right");
          if(e.k==="ki") return TD(H(e.d.join(" ")), "font-size:12px") + TD("");
          if(e.k==="hv") return TD(e.halved ? `<span style="color:${RED}">½</span>` : "+"+e.score, "text-align:right") + TD(e.total, "text-align:right;font-weight:bold");
          return TD(H(e.tag), "font-size:12px") + TD(e.total!==undefined ? e.total : "", "text-align:right;font-weight:bold");
        }).join("")}</tr>`;
      }
      const outs = leg.E.filter(e=>e.k==="out").map(e=>`${H(pn[e.p])} out${e.why?` (${H(e.why)})`:""}`);
      const foot = (is01(g.game) || isCricket(g.game)) ? `<tr bgcolor="#eef2f7">${TD(is01(g.game)?"3DA":"MPR","font-size:11px;color:#555")}${sts.map(st=>TD(`${st.darts} darts`,"font-size:12px;color:#555")+TD((st.avg||0).toFixed(2),"text-align:right;font-weight:bold")).join("")}</tr>` : "";
      out += `<div style="background:#3d4651;color:#fff;padding:6px 8px;margin-top:12px;font-weight:bold">${label}${leg.winner!==null?` <span style="float:right">★ ${H(pn[leg.winner])}</span>`:""}</div>`;
      out += TBL(`<tr>${TH("Rnd")}${pn.map((n,i)=>TH(`${leg.starter===i?"♦ ":""}${H(n)}`,"text-align:left")+TH(is01(g.game)?"Left":isCricket(g.game)?"Pts":g.game==="halveit"?"Total":"", "text-align:right")).join("")}</tr>${rows}${foot}`);
      if(outs.length) out += `<div style="font-size:12px;color:${RED};margin:-8px 0 8px">${outs.join(" · ")}</div>`;
    });
    return out;
  };

  /* performance + counts */
  const turns01 = games.filter(g=>is01(g.game)).flatMap(g=>(g.tlog||[]).filter(e=>e.k==="01").map(e=>Object.assign({ name:g.players[e.p].name, gid:g.id }, e)));
  const turnsCr = games.filter(g=>isCricket(g.game)).flatMap(g=>(g.tlog||[]).filter(e=>e.k==="cr").map(e=>Object.assign({ name:g.players[e.p].name }, e)));
  const leader = (arr, f) => { if(!arr.length) return null; const best = Math.max(...arr.map(f)); if(!(best>0)) return null; const who = arr.filter(e=>f(e)===best).map(e=>e.name);
    const c = {}; who.forEach(w=>c[w]=(c[w]||0)+1); return `${best} &nbsp; ${Object.keys(c).map(w=>`${H(w)}${c[w]>1?` ×${c[w]}`:""}`).join(", ")}`; };
  let perf = "";
  const lead = [];
  if(turns01.length){
    const ht = leader(turns01.filter(e=>!e.bust), e=>e.v), hdo = leader(turns01.filter(e=>e.co), e=>e.v);
    if(ht) lead.push(["'01 high turn", ht]); if(hdo) lead.push(["'01 high checkout", hdo]);
  }
  if(turnsCr.length){
    const hm = leader(turnsCr, e=>e.marks); if(hm) lead.push(["Cricket high turn (marks)", hm]);
  }
  if(lead.length) perf += TBL(`<tr>${TH("Leaders","text-align:left")}${TH("","text-align:left")}</tr>` + lead.map((r,k)=>`<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(r[0])}${TD(r[1])}</tr>`).join(""));
  perf += TBL(`<tr>${TH("Game","text-align:left")}${TH("Player","text-align:left")}${TH("Place")}${TH("Key stats","text-align:left")}</tr>` + games.map((g,gi)=>g.players.map((p,k)=>
    `<tr bgcolor="${gi%2?"#f3f5f8":"#fff"}" ${k===0?'style="border-top:2px solid #ccd"':""}>${TD(k===0?`<b>${gi+1}</b> ${H(gameType(g))}`:"")}${TD(`${p.raw.won?"★ ":""}${H(p.name)}`)}${TD(p.place,"text-align:center")}${TD(p.rows.slice(0,4).map(r=>`${H(r[0])}: <b>${H(r[1])}</b>`).join(" · "),"font-size:12px")}</tr>`).join("")).join(""));

  let counts = "";
  if(turns01.length){
    const pl = [...new Set(turns01.map(e=>e.name))];
    counts += `<div style="font-weight:bold;margin-top:10px">Checkout performance</div>`;
    counts += TBL(`<tr>${TH("Player","text-align:left")}${TH("First 9")}${TH("Avg finish")}${TH("Checkouts")}${TH("Darts at double")}${TH("CO%")}</tr>` + pl.map((n,k)=>{
      const t = turns01.filter(e=>e.name===n), cos = t.filter(e=>e.co), dd = t.reduce((a,e)=>a+(e.dd||0),0);
      const byLeg = {}; t.forEach(e=>{ const key = e.s+"-"+e.l+"-"+(e.gid||""); (byLeg[key]=byLeg[key]||[]).push(e); });
      let fp=0, fd=0; Object.values(byLeg).forEach(a=>a.slice(0,3).forEach(e=>{ fp+=e.bust?0:e.v; fd+=e.co?e.darts:3; }));
      return `<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(H(n))}${TD(fd?(fp/fd*3).toFixed(2):"–","text-align:center")}${TD(cos.length?(cos.reduce((a,e)=>a+e.v,0)/cos.length).toFixed(1):"–","text-align:center")}${TD(cos.length,"text-align:center")}${TD(dd||"–","text-align:center")}${TD(dd?Math.round(cos.length/dd*100)+"%":"–","text-align:center")}</tr>`; }).join(""));
    const B = [[100,119],[120,139],[140,159],[160,179],[180,180]];
    counts += `<div style="font-weight:bold;margin-top:10px">'01 100+ turns</div>`;
    counts += TBL(`<tr>${TH("Player","text-align:left")}${TH("Count")}${TH("High")}${B.map(b=>TH(b[0]===180?"180":`${b[0]}-${b[1]}`)).join("")}</tr>` + pl.map((n,k)=>{
      const t = turns01.filter(e=>e.name===n && !e.bust && e.v>=100);
      return `<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(H(n))}${TD(t.length,"text-align:center")}${TD(t.length?Math.max(...t.map(e=>e.v)):"–","text-align:center")}${B.map(b=>TD(t.filter(e=>e.v>=b[0]&&e.v<=b[1]).length||"–","text-align:center")).join("")}</tr>`; }).join(""));
  }
  if(turnsCr.length){
    const pl = [...new Set(turnsCr.map(e=>e.name))];
    counts += `<div style="font-weight:bold;margin-top:10px">Cricket 5M+ turns</div>`;
    counts += TBL(`<tr>${TH("Player","text-align:left")}${TH("Count")}${TH("5M+ %")}${[5,6,7,8,9].map(m=>TH(m+"M")).join("")}</tr>` + pl.map((n,k)=>{
      const t = turnsCr.filter(e=>e.name===n), hi = t.filter(e=>e.marks>=5);
      return `<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(H(n))}${TD(hi.length,"text-align:center")}${TD(t.length?Math.round(hi.length/t.length*100)+"%":"–","text-align:center")}${[5,6,7,8,9].map(m=>TD(t.filter(e=>e.marks===m).length||"–","text-align:center")).join("")}</tr>`; }).join(""));
    counts += `<div style="font-weight:bold;margin-top:10px">Bulls &amp; marksman counts</div>`;
    counts += TBL(`<tr>${TH("Player","text-align:left")}${TH("All bulls")}${TH("Double bulls")}${TH("Triples")}${TH("Hat tricks")}</tr>` + pl.map((n,k)=>{
      const t = turnsCr.filter(e=>e.name===n), ds = t.flatMap(e=>e.d.map(parseDart));
      const bulls = ds.filter(x=>x.n===25).reduce((a,x)=>a+x.m,0), dbs = ds.filter(x=>x.n===25&&x.m===2).length, tr = ds.filter(x=>x.m===3).length;
      const hats = t.filter(e=>e.d.length===3 && e.d.every(l=>parseDart(l).n===25)).length;
      return `<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(H(n))}${TD(bulls||"–","text-align:center")}${TD(dbs||"–","text-align:center")}${TD(tr||"–","text-align:center")}${TD(hats||"–","text-align:center")}</tr>`; }).join(""));
  }

  const car = career ? SEC("Your career totals") + TBL(careerRows(career).map((r,k)=>`<tr bgcolor="${k%2?"#f3f5f8":"#fff"}">${TD(H(r[0]))}${TD(H(r[1]),"text-align:right;font-weight:bold")}</tr>`).join("")) : "";
  const build = keep => {
    let d = ""; games.forEach((g,gi)=>{ if(keep[gi]) d += detailFor(g,gi); });
    const dropped = keep.some(k=>!k);
    return h + SEC("Player performance") + perf + (counts ? SEC("Match counts") + counts : "")
      + SEC("Game detail") + (d || "") + (dropped ? `<p style="color:#777;font-size:12px">Some turn-by-turn tables were left out to keep this email under the size limit.</p>` : "")
      + car + `</div>`;
  };
  const keep = games.map(()=>true);
  let html = build(keep);
  for(let k=0; k<games.length && html.length>47000; k++){ keep[k] = false; html = build(keep); }
  return html;
}

async function sendEmail(to, subject, html){
  const r = await fetch("https://api.emailjs.com/api/v1.0/email/send", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ service_id:EMAILJS.serviceId, template_id:EMAILJS.templateId, user_id:EMAILJS.publicKey, template_params:{ to_email:to, subject, report_html:html } }) });
  if(!r.ok) throw new Error(await r.text());
}
async function endSession(){
  dialog = null;
  if(online){
    await fb.ref(`games/${online.code}/session/ended`).set(Date.now());
    return; // every phone reacts to "ended" in watchSession
  }
  const s = loadLocalSession(); saveLocalSession(null);
  const games = s ? s.games : [];
  summaryHtml = games.length ? reportHtml(games, null, null) : `<p>No finished games in this session yet.</p>`;
  dialog = "summary"; screen = "home"; render();
  if(games.length){
    msg("Saving stats and sending emails…");
    const r = await deliver(games, null, s.id);
    msg(r.failed.length ? `Couldn't email ${r.failed.join(", ")}` : r.sent.length ? `Results emailed to ${r.sent.join(", ")}` : EMAILJS ? "No player emails on this phone" : "Stats saved");
  }
}

    if(r.sent.length || r.failed.length) msg(r.failed.length ? `Couldn't email ${r.failed.join(", ")}` : `Results emailed to ${r.sent.join(", ")}`);

const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e).trim());
const meKey = () => user ? `u:${user.uid}` : null;
function people(){
  if(!user || !account) return [];
  const list = [{ key: meKey(), name: account.name || "Me", email: user.email, me:true }];
  Object.entries(account.guests || {}).forEach(([gid,g])=>list.push({ key:`g:${user.uid}:${gid}`, gid, name:g.name, email:g.email||"" }));
  return list;
}
const personByKey = k => people().find(p=>p.key===k) || null;
const ownsKey = k => !!user && (k===meKey() || String(k).startsWith(`g:${user.uid}:`));
function basePath(k){ const [t,uid,gid] = k.split(":"); return t==="u" ? `users/${uid}` : `users/${uid}/guests/${gid}`; }
function authError(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-email")) return "That email address doesn't look right.";
  if(c.includes("user-not-found") || c.includes("wrong-password") || c.includes("invalid-credential") || c.includes("invalid-login")) return "Wrong email or password.";
  if(c.includes("email-already-in-use")) return "There's already an account with that email. Log in instead.";
  if(c.includes("weak-password")) return "Use a password with at least 6 characters.";
  if(c.includes("too-many-requests")) return "Too many tries. Wait a minute and try again.";
  if(c.includes("network")) return "No connection. Check your internet and try again.";
  if(c.includes("operation-not-allowed")) return "That sign-in method isn't switched on in Firebase yet.";
  if(c.includes("unauthorized-domain")) return "This website isn't approved for Google sign-in yet. Add it under Authorized domains in Firebase.";
  if(c.includes("account-exists-with-different-credential")) return "That email already has an account. Log in with your email and password.";
  return "Something went wrong. Try again.";
}
async function startAuth(){
  try{ await fbInit(); }catch(e){ screen = "auth"; authMsg = "Couldn't reach the online service. Check your connection."; render(); return; }
  firebase.auth().onAuthStateChanged(async u=>{
    user = u;
    if(accountRef){ accountRef.off(); accountRef = null; }
    if(!u){ account = null; screen = "auth"; render(); return; }
    accountRef = fb.ref(`users/${u.uid}`);
    accountRef.on("value", snap=>{
      const v = snap.val() || {};
      account = { name: v.name || u.displayName || u.email.split("@")[0], guests: v.guests || {} };
      if(!v.name) accountRef.child("name").set(account.name);
      if(screen==="loading" || screen==="auth") screen = "home";
      if(screen!=="game") render();
    });
    const so = savedOnline();
    if(so) fb.ref(`games/${so.code}/session/ended`).get().then(s=>{ if(s && s.val()) onlineSessionEnded(so.code); }).catch(()=>{});
  });
}
async function doAuth(kind){
  const email = (document.getElementById("au-email")||{}).value || "", pass = (document.getElementById("au-pass")||{}).value || "";
  const name = ((document.getElementById("au-name")||{}).value || "").trim();
  if(kind==="forgot"){
    if(!validEmail(email)){ authMsg = "Type your email above first."; render(); return; }
    try{ await firebase.auth().sendPasswordResetEmail(email.trim()); authMsg = "Check your email for a link to reset your password."; }
    catch(e){ authMsg = authError(e); }
    render(); return;
  }
  if(kind==="signup" && !name){ authMsg = "Enter your name."; render(); return; }
  authBusy = true; authMsg = ""; render();
  try{
    if(kind==="signup"){
      const cred = await firebase.auth().createUserWithEmailAndPassword(email.trim(), pass);
      await cred.user.updateProfile({ displayName:name });
      await fb.ref(`users/${cred.user.uid}`).update({ name, created: Date.now() });
    } else await firebase.auth().signInWithEmailAndPassword(email.trim(), pass);
  }catch(e){ authMsg = authError(e); }
  authBusy = false; render();
}
async function googleLogin(){
  authBusy = true; authMsg = ""; render();
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt:"select_account" });
  try{ await firebase.auth().signInWithPopup(prov); }
  catch(e){
    const c = (e && e.code) || "";
    if(c.includes("popup-blocked") || c.includes("operation-not-supported")){ try{ await firebase.auth().signInWithRedirect(prov); return; }catch(e2){ authMsg = authError(e2); } }
    else if(!c.includes("popup-closed") && !c.includes("cancelled-popup")) authMsg = authError(e);
  }
  authBusy = false; render();
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
let sending = false;
/* save stats + send reports for every player this account owns (the account holder and their guests) */
async function deliver(games, sentRef, sid){
  if(sending || !games.length || !user) return { sent:[], failed:[] };
  sending = true;
  const sent = [], failed = [];
  try{
    const keys = [...new Set(games.flatMap(g=>g.players.map(p=>p.pid)).filter(k=>k && ownsKey(k)))];
    for(const key of keys){
      const person = personByKey(key); if(!person) continue;
      const mine = games.map(g=>({ g, p:g.players.find(p=>p.pid===key) })).filter(x=>x.p);
      await fb.ref(`${basePath(key)}/history/${sid}`).set(JSON.parse(JSON.stringify({ date: games[0].date,
        games: mine.map(x=>({ title:x.g.title, won:!!x.p.raw.won, place:x.p.place })), raws: mine.map(x=>x.p.raw) })));
      let career = null; try{ career = await careerFor(key); }catch(e){}
      const flag = key.replace(/[.#$\[\]\/:]/g,"_");
      if(sentRef){ const s = await sentRef.child(flag).get(); if(s.exists()) continue; await sentRef.child(flag).set(true); }
      if(EMAILJS && person.email){
        try{ await sendEmail(person.email, `Darts results: ${games.length} game${games.length===1?"":"s"}`, reportHtml(games, key, career)); sent.push(person.name); }
        catch(e){ failed.push(person.name); }
        await sleep(1100);
      }
    }
  } finally { sending = false; }
  return { sent, failed };
}
