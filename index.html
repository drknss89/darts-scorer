/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const firstTo = n => Math.floor(n/2) + 1;
const is01 = g => /^\d+$/.test(g);
const NAMES = { cricket:"Cricket", cutthroat:"Cut-Throat", killer:"Killer", halveit:"Halve-It", shanghai:"Shanghai", baseball:"Baseball", golf:"Golf", atc:"Around the Clock", bobs:"Bob's 27", countup:"Count-Up" };
const shortName = g => NAMES[g] || g;
const RG = ["shanghai","baseball","golf","atc","bobs","countup"];
const isRG = g => RG.includes(g);
const isCricket = g => g==="cricket" || g==="cutthroat";
const oneGame = g => g==="killer" || g==="halveit" || isRG(g);
const ATC_T = [...Array(20).keys()].map(k=>k+1).concat([25]);
const HALVE = [20,"EVEN",19,"ODD",18,"TRIPLE",17,"DOUBLE",16,"CHOICE",15,"BULL"];
const halveLabel = t => typeof t==="number" ? String(t) : t.charAt(0)+t.slice(1).toLowerCase();
function dartLabel(n,m){ if(n===0) return "Miss"; if(n===25) return m===2 ? "Bull" : "25"; return (m===3?"T":m===2?"D":"") + n; }
function gameName(g, o){
  if(g==="cricket") return o.points ? "Cricket" : "Cricket · No points";
  if(g==="killer") return `Killer · ${o.lives} lives`;
  if(g==="halveit") return "Halve-It";
  if(g==="cutthroat") return "Cut-Throat Cricket";
  if(g==="shanghai") return `Shanghai · ${o.shRounds} rounds`;
  if(g==="countup") return `Count-Up · ${o.cuRounds} rounds`;
  if(isRG(g)) return NAMES[g];
  return `${g} · ${o.inMode==="double"?"Double in":"Straight in"}, ${o.outMode==="double"?"double out":"straight out"}`;
}
const POSSIBLE = (() => { const d=[0,25,50]; for(let i=1;i<=20;i++) d.push(i,2*i,3*i);
  const s=new Set(); for(const a of d) for(const b of d) for(const c of d) s.add(a+b+c); return s; })();

/* ---------- checkout suggestions ---------- */
const ALL = (() => { const a=[]; for(let i=20;i>=1;i--) a.push({l:"T"+i,v:3*i}); a.push({l:"Bull",v:50}); a.push({l:"25",v:25});
  for(let i=20;i>=1;i--) a.push({l:""+i,v:i}); for(let i=20;i>=1;i--) a.push({l:"D"+i,v:2*i}); return a; })();
const DOUBLES = [20,16,18,12,10,8,14,6,4,2,19,17,15,13,11,9,7,5,3,1].map(i=>({l:"D"+i,v:2*i})).concat([{l:"Bull",v:50}]);
function oneDart(r){ if(r<=0) return null; if(r<=20) return ""+r; if(r===25) return "25"; if(r===50) return "Bull";
  if(r%3===0 && r<=60) return "T"+r/3; if(r%2===0 && r<=40) return "D"+r/2; return null; }
function checkout(s, left, dbl){
  if(s<=0 || s>180 || left<1) return null;
  const fins = dbl ? DOUBLES : ALL;
  if(!dbl){ const a = oneDart(s); if(a) return [a]; }
  for(const f of fins) if(f.v===s) return [f.l];
  if(left<2) return null;
  for(const f of fins){ const a = oneDart(s-f.v); if(a) return [a,f.l]; }
  if(left<3) return null;
  for(const f of fins) for(const a of ALL){ const b = oneDart(s-f.v-a.v); if(b) return [a.l,b,f.l]; }
  return null;
}

/* ---------- match engine ---------- */
function newLeg(){
  const g = match.game;
  const p = match.players.map(() => is01(g)
    ? { score:+g, isIn: match.opts.inMode==="straight", darts:0, turns:0 }
    : g==="halveit"
    ? { total:0, darts:0, turns:0, hist:[] }
    : isRG(g)
    ? { total: g==="bobs" ? 27 : 0, darts:0, turns:0, hist:[], out:false, pos:0 }
    : g==="killer"
    ? { num:null, lives:0, out:false, darts:0, turns:0, taken:0, last:null }
    : { marks:{20:0,19:0,18:0,17:0,16:0,15:0,25:0}, points:0, darts:0, hits:0, turns:0, last:null });
  return { p, log:[], phase: g==="killer" ? "pick" : "play", round:0 };
}
function tl(e){ if(!match.tlog) match.tlog = []; e.s = match.setNo; e.l = match.legNo; match.tlog.push(e); return match.tlog.length-1; }
function startMatch(keep){
  const names = keep ? keep.map(p=>p.name) : settings.players.map((n,i)=>n.trim() || `Player ${i+1}`);
  const pids = keep ? keep.map(p=>p.pid||null) : (settings.pids || []).slice(0, names.length);
  match = {
    game: settings.game,
    opts: { inMode:settings.inMode, outMode:settings.outMode, points: settings.game==="cutthroat" ? true : settings.points, lives:settings.lives, shRounds:settings.shRounds, cuRounds:settings.cuRounds,
      cutthroat: settings.game==="cutthroat",
      sets: oneGame(settings.game) ? 1 : settings.sets, legs: oneGame(settings.game) ? 1 : settings.legs },
    players: names.map((name,i) => ({ name, pid: pids[i] || null, sets:0, legs:0, legsTotal:0, cDarts:0, cScore:0 })),
    setNo:1, legNo:1, legStarter:0, cur:0, turn:[], turnMarks:0, over:null,
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), started: Date.now(), tlog: []
  };
  match.leg = newLeg();
  hist = []; entry = ""; pending = null; screen = "game"; save(); render();
}
function snapshot(){ hist.push(JSON.stringify(match)); if(hist.length>400) hist.shift(); match.by = deviceId; }
function undo(){ if(!hist.length) return; match = JSON.parse(hist.pop()); entry = ""; pending = null; save(); render(); }
function nextPlayer(){
  const n = match.players.length;
  for(let k=0;k<n;k++){
    match.cur = (match.cur+1) % n;
    if((match.game!=="killer" && match.game!=="bobs") || !match.leg.p[match.cur].out) return;
  }
}

/* killer: throw for numbers, then dart-by-dart */
function pickNumber(n){
  const L = match.leg;
  if(L.p.some(q=>q.num===n)){ msg(`${n===25?"Bull":n} is taken. Throw again.`); return; }
  snapshot();
  L.p[match.cur].num = n;
  advancePick(); save(); render();
}
function advancePick(){
  const L = match.leg, n = match.players.length;
  for(let k=0;k<n;k++){ const i = (match.legStarter+k) % n; if(L.p[i].num===null){ match.cur = i; return; } }
  L.phase = "play"; match.cur = match.legStarter;
}
function randomPick(){
  const used = match.leg.p.map(q=>q.num);
  const free = [...Array(20).keys()].map(k=>k+1).concat([25]).filter(n=>!used.includes(n));
  pickNumber(free[Math.floor(Math.random()*free.length)]);
}
function reuseNumbers(){
  snapshot();
  match.leg.p.forEach((q,i)=>q.num = match.lastNums[i]);
  advancePick(); save(); render();
}
function killerDart(n, m){
  if(!match || match.over || match.leg.phase!=="play") return;
  snapshot();
  const L = match.leg, idx = match.cur, p = L.p[idx], max = match.opts.lives;
  p.darts++;
  let counted = false;
  const o = n ? L.p.findIndex(q=>q.num===n && !q.out) : -1;
  if(o>=0 && o!==idx && (p.lives!==max || L.p[o].turns===0)){ { const prev = hist.pop(); match.by = JSON.parse(prev).by; } p.darts--; return; }
  if(o===idx){
    counted = true;
    if(p.lives===max){
      p.lives = -1; p.out = true; tl({ k:"out", p:idx, why:"hit own number" }); toast(`${match.players[idx].name} killed themselves!`, true);
    } else if(p.lives + m > max){
      p.lives = -1; p.out = true; tl({ k:"out", p:idx, why:`went over ${max}` }); toast(`${match.players[idx].name} went over ${max}. Out!`, true);
    } else {
      p.lives += m;
      if(p.lives===max) toast("KILLER!");
    }
  } else if(o>=0 && p.lives===max){
    counted = true;
    const q = L.p[o]; q.lives -= m; p.taken += m;
    if(q.lives<0){ q.out = true; tl({ k:"out", p:o, by:idx }); toast(`${match.players[o].name} is out!`, true); }
  }
  match.turn.push({ n, m, counted });
  const alive = L.p.map((q,i)=>i).filter(i=>!L.p[i].out);
  if(alive.length===1){
    const w = alive[0];
    p.turns++; p.last = match.turn.map(d=>dartLabel(d.n,d.m)); tl({ k:"ki", p:idx, d:p.last });
    endLeg(w, { darts:L.p[w].darts });
  } else if(p.out || match.turn.length>=3){
    p.turns++; p.last = match.turn.map(d=>dartLabel(d.n,d.m)); tl({ k:"ki", p:idx, d:p.last });
    match.turn = []; nextPlayer();
  }
  save(); render();
}

/* 01: whole-turn score entry */
function submitScore(v){
  if(!match || match.over) return;
  if(match.game==="halveit") return halveTotal(v);
  if(match.game==="countup") return countupTotal(v);
  entry = "";
  const L = match.leg, i = match.cur, p = L.p[i], rem = p.score, dbl = match.opts.outMode==="double";
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  if(!p.isIn && v===1){ msg("Double in: the lowest starting score is 2"); render(); return; }
  if(v===rem){
    if(dbl && !checkout(rem,3,true)){ msg(`${rem} can't be finished on a double in 3 darts`); render(); return; }
    let min = 1; while(min<3 && !checkout(rem,min,dbl)) min++;
    if(min===3){ finish(3); return; }
    pending = { score:rem, opts:[1,2,3].filter(d=>d>=min) }; render(); return;
  }
  snapshot();
  p.darts += 3; p.turns++;
  let li;
  if(v>rem || (dbl && rem-v===1)){
    L.log.push({ i, v:0, left:rem, bust:true }); toast("Bust", true);
    li = tl({ k:"01", p:i, v:0, bust:true, start:rem, left:rem });
  } else {
    p.score -= v; if(v>0) p.isIn = true;
    L.log.push({ i, v, left:p.score });
    li = tl({ k:"01", p:i, v, start:rem, left:p.score });
    if(v===180) toast("180!"); else if(v>=140) toast(v+"!");
  }
  if(dbl && rem<=50 && checkout(rem,3,true) && profilesOn()) ddAsk = { li, max:3, min:0 };
  nextPlayer(); save(); render();
}
function finish(darts){
  const L = match.leg, i = match.cur, p = L.p[i];
  snapshot();
  const co = p.score;
  p.darts += darts; p.turns++; L.log.push({ i, v:co, left:0 }); p.score = 0; p.isIn = true;
  pending = null;
  const li = tl({ k:"01", p:i, v:co, start:co, left:0, co:true, darts });
  if(match.opts.outMode==="double" && profilesOn()) ddAsk = { li, max:darts, min:1 };
  endLeg(i, { checkout:co, darts:p.darts });
  save(); render();
}

/* cricket: dart-by-dart */
function throwDart(n, m){
  if(!match || match.over) return;
  snapshot();
  const L = match.leg, idx = match.cur, p = L.p[idx];
  p.darts++;
  let counted = false, win = false;
  if(TARGETS.includes(n)){
    const cur = p.marks[n], need = 3-cur, extra = Math.max(0, m-need);
    p.marks[n] = Math.min(3, cur+m);
    let scored = 0;
    const open = L.p.filter((o,i)=>i!==idx && o.marks[n]<3);
    if(extra && match.opts.points && open.length){
      scored = extra;
      if(match.opts.cutthroat) open.forEach(o=>o.points += extra*n); else p.points += extra*n;
    }
    const add = Math.min(m,need) + scored;
    p.hits += add; match.turnMarks += add; counted = add > 0;
    const closed = TARGETS.every(t=>p.marks[t]===3);
    if(closed && (!match.opts.points || L.p.every((o,i)=>i===idx || (match.opts.cutthroat ? p.points<=o.points : p.points>=o.points)))) win = true;
  }
  match.turn.push({n, m, counted});
  if(win){ p.turns++; p.last = cricketSummary(); tl({ k:"cr", p:idx, marks:match.turnMarks, d:p.last.darts, pts:L.p.map(q=>q.points) }); endLeg(idx, { darts:p.darts }); }
  else if(match.turn.length>=3) endCricketTurn();
  save(); render();
}
/* halve-it */
function halveTarget(){ return HALVE[match.leg.round]; }
function dartValue(n,m){ return n===25 ? 25*m : n*m; }
function dartCounts(d, t, choice){
  if(d.n===0) return false;
  if(typeof t==="number") return d.n===t;
  if(t==="TRIPLE") return d.m===3;
  if(t==="DOUBLE") return d.m===2;
  if(t==="BULL") return d.n===25;
  if(t==="CHOICE") return d.n===choice;
  return true; // EVEN / ODD: every dart adds to the total
}
function halveScore(darts, t, choice){
  const total = darts.filter(d=>dartCounts(d,t,choice)).reduce((a,d)=>a+dartValue(d.n,d.m),0);
  if(t==="EVEN") return total>0 && total%2===0 ? total : 0;
  if(t==="ODD") return total%2===1 ? total : 0;
  return total;
}
function pickChoice(n){
  snapshot(); match.choice = n; save(); render();
}
function halveDart(n, m){
  if(!match || match.over) return;
  const t = halveTarget();
  if(t==="CHOICE" && !match.choice) return;
  snapshot();
  const p = match.leg.p[match.cur];
  p.darts++;
  const d = { n, m };
  d.counted = t==="EVEN" || t==="ODD" ? n>0 : dartCounts(d, t, match.choice);
  match.turn.push(d);
  if(match.turn.length>=3) endHalveTurn();
  mod = 1; save(); render();
}
function halveTotal(v){
  entry = "";
  if(!["EVEN","ODD"].includes(halveTarget())) return;
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  snapshot();
  match.leg.p[match.cur].darts += 3; match.turn = [];
  const t = halveTarget();
  const sc = t==="EVEN" ? (v>0 && v%2===0 ? v : 0) : (v%2===1 ? v : 0);
  endHalveTurn(sc); save(); render();
}
function endHalveTurn(override){
  const L = match.leg, i = match.cur, p = L.p[i], t = halveTarget();
  const sc = override!==undefined ? override : halveScore(match.turn, t, match.choice);
  const before = p.total;
  if(sc>0) p.total += sc; else { p.total = Math.ceil(p.total/2); toast("Halved!", true); }
  p.hist.push({ score:sc, halved:sc===0, total:p.total, before, choice: t==="CHOICE" ? match.choice : null });
  tl({ k:"hv", p:i, r:L.round, score:sc, halved:sc===0, total:p.total });
  p.turns++; match.turn = []; match.choice = null;
  nextPlayer();
  if(match.cur===match.legStarter){
    L.round++;
    if(L.round>=HALVE.length){ finishHalve(); return; }
  }
}
function finishHalve(){
  const L = match.leg, best = Math.max(...L.p.map(q=>q.total));
  const winners = L.p.map((q,i)=>i).filter(i=>L.p[i].total===best);
  winners.forEach(w=>match.players[w].legsTotal++);
  match.over = { type:"match", winner:winners[0], tie: winners.length>1 ? winners : null, legScore: match.players.map(p=>p.legs), darts: L.p[winners[0]].darts };
  match.turn = [];
}
function halveLast(i){
  const h = match.leg.p[i].hist, last = h[h.length-1];
  if(!last) return "";
  return last.halved ? `<span class="avg">½</span>` : `<span>+${last.score}</span>`;
}
/* ---------- round games: shanghai, baseball, golf, around the clock, bob's 27, count-up ---------- */
function rgRounds(){
  const g = match.game, o = match.opts, seq = n => [...Array(n).keys()].map(k=>k+1);
  if(g==="shanghai") return seq(o.shRounds);
  if(g==="baseball" || g==="golf") return seq(9);
  if(g==="bobs") return seq(20).concat([25]);
  if(g==="countup") return seq(o.cuRounds);
  return null;
}
function rgTarget(){ const r = rgRounds(); return r ? r[Math.min(match.leg.round, r.length-1)] : ATC_T[Math.min(match.leg.p[match.cur].pos, ATC_T.length-1)]; }
function rgRowLabel(t){
  const g = match.game;
  if(g==="bobs") return t===25 ? "D-Bull" : "D"+t;
  if(g==="countup") return "R"+t;
  if(g==="golf") return "Hole "+t;
  if(g==="baseball") return "Inn "+t;
  return String(t);
}
const GOLF = { 2:{v:1,l:"Double",s:"Dbl"}, 3:{v:2,l:"Triple",s:"Trp"}, 1:{v:3,l:"Single",s:"Sgl"}, 0:{v:5,l:"Miss",s:"Miss"} };
function rgDart(n, m){
  if(!match || match.over) return;
  const g = match.game, L = match.leg, idx = match.cur, p = L.p[idx];
  snapshot();
  p.darts++;
  const t = rgTarget();
  if(g==="atc"){
    const hit = n>0;
    match.turn.push({ n:hit?t:0, m:1, counted:hit });
    if(hit){ p.pos++; if(p.pos>=ATC_T.length){ p.turns++; tl({ k:"rg", p:idx, tag: match.turn.map(d=>d.counted ? (d.n===25?"B":d.n) : "–").join(" ") }); match.turn=[]; finishRG([idx]); save(); render(); return; } }
  } else if(g==="golf"){
    match.turn.push({ n:m?t:0, m:m||1, counted:m>0, golf:GOLF[m] });
  } else {
    match.turn.push({ n, m:m||1, counted:n===t && n>0 });
  }
  if(match.turn.length>=3) rgEndTurn();
  save(); render();
}
function rgEndTurn(override){
  const g = match.game, L = match.leg, idx = match.cur, p = L.p[idx], t = rgTarget();
  let sc = 0, tag = "";
  if(g==="shanghai"){
    const hits = match.turn.filter(d=>d.n===t);
    sc = hits.reduce((a,d)=>a+t*d.m,0); tag = "+"+sc;
    const ms = new Set(hits.map(d=>d.m));
    if(ms.has(1) && ms.has(2) && ms.has(3)){
      p.total += sc; p.hist.push({score:sc,total:p.total,tag:"SHANGHAI"}); p.turns++; match.turn=[];
      tl({ k:"rg", p:idx, r:L.round, score:sc, tag:"SHANGHAI", total:p.total });
      toast("SHANGHAI!"); finishRG([idx], true); return;
    }
  } else if(g==="baseball"){ sc = match.turn.filter(d=>d.n===t).reduce((a,d)=>a+d.m,0); tag = sc ? `+${sc}` : "0"; }
  else if(g==="golf"){ const last = match.turn[match.turn.length-1]; sc = last.golf.v; tag = last.golf.l; }
  else if(g==="bobs"){
    const val = t===25 ? 50 : 2*t;
    sc = override>0 ? override*val : -val; tag = (sc>0?"+":"")+sc;
  }
  else if(g==="countup"){ sc = override; tag = "+"+sc; }
  if(g!=="atc"){
    p.total += sc;
    p.hist.push({ score:sc, total:p.total, tag });
    tl({ k:"rg", p:idx, r:L.round, score:sc, tag, total:p.total });
    if(g==="bobs" && p.total<0){ p.out = true; tl({ k:"out", p:idx }); toast(`${match.players[idx].name} is out!`, true); }
  } else tl({ k:"rg", p:idx, tag: match.turn.map(d=>d.counted ? (d.n===25?"B":d.n) : "–").join(" ") });
  p.turns++; match.turn = [];
  const alive = L.p.filter(q=>!q.out);
  if(!alive.length){ finishRG(); return; }
  nextPlayer();
  const r = rgRounds();
  if(r && alive.every(q=>q.turns>L.round)){
    L.round++;
    if(L.round>=r.length){ finishRG(); return; }
  }
}
function rgRest(){
  if(!match || match.over) return;
  if(match.game==="golf"){ if(match.turn.length){ snapshot(); rgEndTurn(); save(); render(); } return; }
  const left = 3 - match.turn.length;
  for(let k=0;k<left;k++) rgDart(0,0);
}
function bobsHits(h){
  if(!match || match.over) return;
  snapshot(); match.leg.p[match.cur].darts += 3; match.turn = [];
  rgEndTurn(h); save(); render();
}
function countupTotal(v){
  entry = "";
  if(!POSSIBLE.has(v)){ msg(`${v} can't be scored with 3 darts`); render(); return; }
  snapshot(); match.leg.p[match.cur].darts += 3; match.turn = [];
  if(v===180) toast("180!");
  rgEndTurn(v); save(); render();
}
function finishRG(winners, instant){
  const g = match.game, L = match.leg, P = L.p;
  if(!winners){
    const idx = P.map((q,i)=>i);
    if(g==="golf"){ const b = Math.min(...P.map(q=>q.total)); winners = idx.filter(i=>P[i].total===b); }
    else if(g==="bobs"){
      const alive = idx.filter(i=>!P[i].out);
      if(alive.length){ const b = Math.max(...alive.map(i=>P[i].total)); winners = alive.filter(i=>P[i].total===b); }
      else { const b = Math.max(...P.map(q=>q.turns)); winners = idx.filter(i=>P[i].turns===b); }
    }
    else { const b = Math.max(...P.map(q=>q.total)); winners = idx.filter(i=>P[i].total===b); }
  }
  winners.forEach(w=>match.players[w].legsTotal++);
  match.over = { type:"match", winner:winners[0], tie: winners.length>1 ? winners : null, legScore: match.players.map(p=>p.legs), darts:P[winners[0]].darts, instant:!!instant };
  match.turn = [];
}
function rgLast(i){
  const P = match.leg.p[i];
  if(match.game==="atc") return `<span>${P.darts}d</span>`;
  if(P.out) return `<span class="avg">OUT</span>`;
  const h = P.hist[P.hist.length-1];
  return h ? `<span class="${h.score<0?"avg":""}">${esc(h.tag)}</span>` : "";
}
function cricketSummary(){ return { darts: match.turn.map(d=>dartLabel(d.n,d.m)), marks: match.turnMarks }; }
function endCricketTurn(){
  const p = match.leg.p[match.cur];
  p.turns++; p.last = cricketSummary();
  tl({ k:"cr", p:match.cur, marks:match.turnMarks, d:p.last.darts, pts:match.leg.p.map(q=>q.points) });
  if(match.turnMarks>=5) toast(match.turnMarks+" marks!");
  match.turn = []; match.turnMarks = 0; nextPlayer();
}
function cricketRest(){
  if(!match || match.over) return;
  const left = 3 - match.turn.length, fn = match.game==="killer" ? killerDart : match.game==="halveit" ? halveDart : throwDart;
  for(let k=0;k<left;k++) fn(0,1);
}

/* legs, sets, match */
function endLeg(w, info){
  const L = match.leg;
  tl({ k:"leg", p:w, darts: L.p[w].darts });
  match.players.forEach((pl,i)=>{
    pl.cDarts += L.p[i].darts;
    pl.cScore += is01(match.game) ? (+match.game - L.p[i].score) : match.game==="killer" ? L.p[i].taken : L.p[i].hits;
  });
  if(match.game==="killer") match.lastNums = L.p.map(q=>q.num);
  const pl = match.players[w];
  pl.legs++; pl.legsTotal++;
  const result = Object.assign({ type:"leg", winner:w, legScore: match.players.map(p=>p.legs) }, info);
  if(pl.legs >= firstTo(match.opts.legs)){
    pl.sets++; result.type = "set"; result.setScore = match.players.map(p=>p.sets);
    match.players.forEach(p=>p.legs=0);
    if(pl.sets >= firstTo(match.opts.sets)) result.type = "match";
  }
  match.over = result; match.turn = []; match.turnMarks = 0;
}
function nextLeg(){
  if(!match.over || match.over.type==="match") return;
  snapshot();
  if(match.over.type==="set"){ match.setNo++; match.legNo = 1; } else match.legNo++;
  match.legStarter = (match.legStarter+1) % match.players.length;
  match.cur = match.legStarter; match.leg = newLeg(); match.over = null;
  save(); render();
}

/* ---------- stats ---------- */
function avgFor(i){
  const pl = match.players[i], P = match.leg.p[i], live = !match.over;
  const darts = pl.cDarts + (live ? P.darts : 0);
  if(match.game==="killer") return pl.cScore + (live ? P.taken : 0);
  if(match.game==="halveit") return P.total;
  if(match.game==="atc") return P.pos>=ATC_T.length ? `${P.darts} darts` : `${P.pos}/21`;
  if(match.game==="bobs" && P.out) return "Out";
  if(isRG(match.game)) return P.total;
  const score = pl.cScore + (live ? (is01(match.game) ? (+match.game - P.score) : P.hits) : 0);
  return darts ? score/darts*3 : 0;
}
const avgText = i => oneGame(match.game) ? String(avgFor(i)) : avgFor(i).toFixed(is01(match.game) ? 1 : 2);

/* ---------- toasts ---------- */
function toast(text, bad){ const t=document.createElement("div"); t.className="toast"+(bad?" bad":""); t.textContent=text; document.body.appendChild(t); setTimeout(()=>t.remove(),1200); }
function msg(text){ const t=document.createElement("div"); t.className="toast msg"; t.textContent=text; document.body.appendChild(t); setTimeout(()=>t.remove(),2300); }

/* ---------- rules ---------- */
function rulesFor(g, o){
  const lives = o.lives || 3;
  if(is01(g)) return [
    `Everyone starts on ${g}. Each turn you throw 3 darts and their total comes off your score.`,
    o.inMode==="double" ? "Double in: your score doesn't start dropping until you hit a double. That double and everything after it counts." : "Straight in: every dart counts from the first throw.",
    o.outMode==="double" ? "Double out: you must finish on exactly 0, and the last dart must be a double (the bull counts as a double)." : "Straight out: finish on exactly 0 with any dart.",
    o.outMode==="double" ? "Bust: go below 0, land on exactly 1, or reach 0 without a double, and the turn scores nothing." : "Bust: go below 0 and the turn scores nothing.",
    "First to 0 wins the leg. Win the most legs to take the set, and the most sets to take the match."
  ];
  if(g==="cricket") return [
    "The numbers in play are 15 through 20 and the bull. Hit a number 3 times to close it: a single is 1 mark, a double 2, a triple 3. Outer bull is 1 mark, inner bull 2.",
    o.points ? "Once you've closed a number, extra hits score its value as points for you, as long as at least one opponent hasn't closed it yet." : "No points: extra hits on a closed number don't score.",
    o.points ? "Close all 7 targets with at least as many points as everyone else to win." : "First to close all 7 targets wins."
  ];
  if(g==="cutthroat") return [
    "Marks work like Cricket: close 15 through 20 and the bull by hitting each 3 times.",
    "Once you've closed a number, extra hits add points to every opponent who hasn't closed it. Points are bad in this game.",
    "Close all 7 targets with points equal to or lower than everyone else to win. Lowest score wins."
  ];
  if(g==="killer") return [
    "Each player throws for a number at the start of the game (1–20 or the bull). No two players can share one.",
    `Every hit on your own number builds lives: a single is 1, a double 2, a triple 3. Single and double bull both count for the bull.`,
    `Land on exactly ${lives} lives to become a killer. Going over ${lives} knocks you out, killer or not.`,
    "Killers attack by hitting other players' numbers, taking 1, 2 or 3 lives. A killer can't attack a player who hasn't had their first turn yet.",
    `A killer who hits their own number is out. Drop below ${lives} and you lose killer status until you build back up.`,
    "You're out once you're taken below 0 lives (a player on 2 lives needs 3 hits to be out). Last player standing wins."
  ];
  if(g==="halveit") return [
    "12 rounds, in order: 20, Even, 19, Odd, 18, Triple, 17, Double, 16, Choice, 15, Bull. Everyone starts on 0.",
    "Number rounds: score what you hit on that number (single, double or triple).",
    "Even and Odd: your whole 3-dart total counts if it's even (or odd).",
    "Triple and Double: any triple (or any double) scores its value.",
    "Choice: call a number before you throw. Only that number counts.",

  if(g==="shanghai") return [
    `${o.shRounds} rounds. Round 1 aims at 1, round 2 at 2, and so on up to ${o.shRounds}.`,
    "Only the round's number scores: a single is face value, a double twice that, a triple three times.",
    "Hit a single, a double and a triple of the number in one turn (a Shanghai) and you win on the spot.",
    "Otherwise the highest total after the last round wins."
  ];
  if(g==="baseball") return [
    "9 innings. Inning 1 aims at 1, inning 2 at 2, and so on up to 9.",
    "Each hit on the inning's number scores runs: a single is 1, a double 2, a triple 3.",
    "Most runs after 9 innings wins. Equal runs end as a tie."
  ];
  if(g==="golf") return [
    "9 holes. Hole 1 aims at 1, hole 2 at 2, and so on up to 9.",
    "Throw up to 3 darts per hole. Your last dart is your score: double 1, triple 2, single 3, miss 5.",
    "You can stop after any dart to keep that score, so a double on your first dart is worth keeping.",
    "Lowest total after 9 holes wins."
  ];
  if(g==="atc") return [
    "Hit 1 through 20 in order, then the bull.",
    "A single, double or triple of your target all count, and move you on to the next number.",
    "First to hit the bull wins. On your own, try to finish in as few darts as you can."
  ];
  if(g==="bobs") return [
    "A doubles drill. Everyone starts on 27.",
    "21 rounds: D1, D2 and so on up to D20, then the double bull. Throw 3 darts at the round's double.",
    "Each hit adds the double's value (a hit on D5 adds 10, double bull adds 50).",
    "Miss with all 3 darts and you lose the double's value instead.",
    "Drop below 0 and you're out. Highest score at the end wins."
  ];
  if(g==="countup") return [
    `${o.cuRounds} rounds of 3 darts. Add up everything you score.`,
    "Highest total wins. A good way to practise scoring on the treble 20."
  ];
  return [];
}

function modeText(){
  const o = match.opts;
  if(match.game==="killer") return `${o.lives} LIVES`;
  if(match.game==="cutthroat") return "CUT-THROAT";
  if(isRG(match.game)){
    if(match.game==="countup") return "ANY";
    const t = rgTarget();
    if(match.game==="bobs") return t===25 ? "D-BULL" : "D"+t;
    if(match.game==="atc") return t===25 ? "BULL" : String(t);
    return match.game==="golf" ? "HOLE" : match.game==="baseball" ? "INNING" : "TARGET";
  }
  if(match.game==="halveit"){ const t = HALVE[Math.min(match.leg.round,11)]; return t==="CHOICE" && match.choice ? `CHOICE: ${match.choice===25?"BULL":match.choice}` : String(t); }
  if(!is01(match.game)) return o.points ? "PTS" : "NO PTS";
  return (o.inMode==="double"?"DI":"SI") + (o.outMode==="double"?" · DO":" · SO");
}
function roundNo(){ if(isRG(match.game)){ const r = rgRounds(); return r ? Math.min(match.leg.round, r.length-1)+1 : match.leg.p[match.cur].turns+1; }
  return match.game==="halveit" ? Math.min(match.leg.round,11)+1 : match.leg.p[match.cur].turns + 1; }
function L_round(){ return match.leg.phase==="pick" ? "Throw for numbers" : `Round ${roundNo()}`; }
function bigValue(i){

  if(isRG(match.game)) return P.out ? "–" : P.total;

function render01Board(){
  const L = match.leg, n = match.players.length, start = +match.game;
  const per = match.players.map((_,i)=>L.log.filter(e=>e.i===i));
  const rounds = Math.max(0, ...per.map(a=>a.length));
  const cell = e => !e ? ["",""] : e.bust ? [`<td class="bust">BUST</td>`, `<td class="lf">${e.left}</td>`] : [`<td class="sc">${e.v}</td>`, `<td class="lf">${e.left}</td>`];
  if(n===2){
    let rows = `<tr class="start"><td class="sc"></td><td class="lf">${start}</td><td class="rn"></td><td class="sc"></td><td class="lf">${start}</td></tr>`;
    for(let r=0;r<rounds;r++){
      const a = per[0][r], b = per[1][r];
      const [as, al] = a ? cell(a) : ["<td></td>","<td></td>"];
      const [bs, bl] = b ? cell(b) : ["<td></td>","<td></td>"];
      rows += `<tr>${as}${al}<td class="rn">${r+1}</td>${bs}${bl}</tr>`;
    }
    return `<table class="hist">${rows}</table>`;
  }
  let head = `<tr><th style="width:44px">Rnd</th>${match.players.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr>`;
  let rows = `<tr class="start"><td class="rn" style="width:44px"></td>${match.players.map(()=>`<td class="cell">${start}</td>`).join("")}</tr>`;
  for(let r=0;r<rounds;r++){
    rows += `<tr><td class="rn">${r+1}</td>${per.map(a=>{ const e=a[r]; if(!e) return "<td></td>";
      return `<td class="cell"><small>${e.bust?"BUST":e.v}</small>${e.left}</td>`; }).join("")}</tr>`;
  }
  return `<table class="hist">${head}${rows}</table>`;
}
function renderCricketBoard(){
  const L = match.leg, n = match.players.length;

  const dis = match.over ? "disabled" : "";
  let html = "";
  if(n>2){
    html += left.map(i=>`<div class="lbl">${esc(match.players[i].name)}</div>`).join("") + `<div></div><div></div><div></div>` +
            right.map(i=>`<div class="lbl">${esc(match.players[i].name)}</div>`).join("");
  }
  for(const t of TARGETS){
    const dead = L.p.every(p=>p.marks[t]===3) ? "dead" : "";
    html += left.map(i=>`<div class="mk ${dead}">${MARK[L.p[i].marks[t]]}</div>`).join("");
    html += `<button type="button" class="cmod ${dead}" data-n="${t}" data-m="2" ${dis}>D</button>`;
    html += `<button type="button" class="cnum ${dead}" data-n="${t}" data-m="1" ${dis}>${t===25?"B":t}</button>`;
    html += t===25 ? `<div></div>` : `<button type="button" class="cmod ${dead}" data-n="${t}" data-m="3" ${dis}>T</button>`;
    html += right.map(i=>`<div class="mk ${dead}">${MARK[L.p[i].marks[t]]}</div>`).join("");
  }
  const lasts = match.players.map((pl,i)=>{ const l=L.p[i].last; return l ? `${esc(pl.name)}: ${esc(l.darts.join(" "))} (${l.marks} mk)` : ""; }).filter(Boolean);
  return `<div class="cg" style="grid-template-columns:${cols};grid-template-rows:${n>2?"auto ":""}repeat(7,minmax(34px,1fr))">${html}</div>
    ${lasts.length?`<div class="hint" style="padding:0 12px 10px;text-align:center">${lasts.join(" · ")}</div>`:""}`;
}

function pips(lives, max){

}
function renderKillerBoard(){

    const p = L.p[i], pl = match.players[i], active = i===match.cur && !match.over;

    const thrower = L.p[match.cur], throwerKiller = thrower.lives===max && !thrower.out;

    return `<div class="kr play ${active?"active":""} ${p.out?"out":""}">${info}
      <button type="button" class="cmod" data-kn="${p.num}" data-m="2" ${off} aria-label="${bull?"Double bull":"Double "+p.num}">D</button>
      <button type="button" class="cnum" data-kn="${p.num}" data-m="1" ${off}>${bull?"B":p.num}</button>

/* ---------- events ---------- */
app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  const d = b.dataset;
  if(d.claim!==undefined){
    const i = +d.claim;
    if(dialog==="join" && joinState){
      const owner = joinState.claims[i]; if(owner && owner!==deviceId) return;
      if(joinState.pick.includes(i)){ joinState.pick = joinState.pick.filter(x=>x!==i); delete joinState.links[i]; }
      else { joinState.pick = joinState.pick.concat([i]); if(!Object.values(joinState.links).includes(meKey())) joinState.links[i] = meKey(); }
      render();
    } else toggleClaim(i);
    return;
  }
  if(d.dd!==undefined){ answerDD(+d.dd); return; }
  if(d.career){ showCareer(d.career); return; }
  if(d.tab){ authTab = d.tab; authMsg = ""; render(); return; }
  if(d.edit){ const p = personByKey(d.edit); editing = { key:d.edit, name:p.name, email:p.email }; dialog = "edit"; render(); return; }
  if(d.reset){ const p = personByKey(d.reset); askConfirm(`This deletes every saved session for ${p.name}. Their stats start again from zero.`, "Reset stats", async()=>{ await fb.ref(`${basePath(d.reset)}/history`).remove(); msg(`${p.name}'s stats were reset`); }); return; }
  if(d.del){ const p = personByKey(d.del); askConfirm(`This deletes ${p.name} and all of their stats.`, "Delete player", async()=>{ await fb.ref(basePath(d.del)).remove(); msg(`${p.name} was deleted`); }); return; }
  if(d.delhist){ const key = careerView.key, sid = d.delhist; askConfirm("This removes that session's games from these stats.", "Remove session", async()=>{ await fb.ref(`${basePath(key)}/history/${sid}`).remove(); await showCareer(key); }); return; }
  if(online && screen==="game" && match){
    const free = ["quit","rules","closeRules","closeDlg","toSetup","share","copyInvite","nextLeg","rematch","undo","endConfirm","endSession","closeSummary","nextGame","doConfirm","cancelEdit","home"];
    if(d.act==="undo" || (d.act==="back" && !entry)){
      if(match.by!==deviceId){ msg("Only the phone that entered the last score can undo it"); return; }
    } else if(!free.includes(d.act) && !match.over && !isMyTurn()){ msg(`It's ${match.players[match.cur].name}'s turn`); return; }
  }
  if(d.set){ settings[d.set] = d.set==="points" ? d.val==="true" : ["lives","shRounds","cuRounds"].includes(d.set) ? +d.val : d.val; save(); render(); return; }
  if(d.cat){ const c = CATS.find(x=>x[0]===d.cat); if(catOf(settings.game)!==d.cat) settings.game = c[2][0]; save(); render(); return; }
  if(d.rg!==undefined){ rgDart(+d.rg, +d.m); return; }
  if(d.bobs!==undefined){ bobsHits(+d.bobs); return; }
  if(d.pick){ pickNumber(+d.pick); return; }
  if(d.kn!==undefined){ killerDart(+d.kn, +d.m); return; }
  if(d.hm){ mod = +d.hm; render(); return; }
  if(d.hd!==undefined){ halveDart(+d.hd, d.hmm ? +d.hmm : mod); return; }
  if(d.ch){ pickChoice(+d.ch); return; }
  if(d.step){ settings[d.step] = Math.min(15, Math.max(1, settings[d.step] + +d.d)); save(); render(); return; }
  if(d.rm){ settings.players.splice(+d.rm,1); (settings.links||[]).splice(+d.rm,1); save(); render(); return; }
  if(d.digit!==undefined){ if(entry.length<3 && !(entry==="" && d.digit==="0")) entry += d.digit; render(); return; }
  if(d.score!==undefined){ submitScore(+d.score); return; }
  if(d.fin){ finish(+d.fin); return; }
  if(d.n!==undefined){ throwDart(+d.n, +d.m); return; }
  switch(d.act){
    case "addp": settings.players.push(`Player ${settings.players.length+1}`); (settings.links = settings.links || [])[settings.players.length-1] = null; save(); render();
      setTimeout(()=>{ const el=document.getElementById(`pl-${settings.players.length-1}`); if(el){ el.focus(); el.select(); } },0); break;
    case "start": goOffline(); preparePids().then(()=>startMatch()); break;
    case "startNext": { const keep = match.players.map(p=>({ name:p.name, pid:p.pid })); startMatch(keep); break; }
    case "backToGame": screen = "game"; render(); break;
    case "nextGame": dialog = null; screen = "setup"; render(); break;
    case "endConfirm": dialog = "endConfirm"; render(); break;
    case "endSession": endSession(); break;
    case "closeSummary": dialog = null; summaryHtml = null; screen = profilesOn() ? "home" : "setup"; render(); break;
    case "resume": goOffline(); screen = "game"; render(); break;
    case "forgot": doAuth("forgot"); break;
    case "google": googleLogin(); break;
    case "logout": askConfirm("You'll need your email and password to log back in.", "Log out", async()=>{ goOffline(); await firebase.auth().signOut(); }); break;
    case "home": dialog = null; screen = "home"; render(); break;
    case "modeLocal": mode = "local"; goOffline(); screen = "setup"; if(!(settings.links||[]).some(Boolean) && meKey()) setLink(0, meKey()); render(); break;
    case "modeOnline": mode = "online"; screen = "setup"; if(!(settings.links||[]).some(Boolean) && meKey()) setLink(0, meKey()); render(); break;
    case "players": screen = "players"; render(); break;
    case "newGuest": editing = { key:null, name:"", email:"" }; dialog = "edit"; render(); break;
    case "cancelEdit": editing = null; dialog = joinState ? "join" : null; render(); break;
    case "doConfirm": { const c = confirmAct; confirmAct = null; dialog = null; render(); if(c) Promise.resolve(c.run()).catch(()=>msg("Couldn't do that. Check your connection.")).then(()=>render()); break; }
    case "host": hostOnline(); break;
    case "join": { const el = document.getElementById("joincode"); lookupGame(el ? el.value : ""); break; }
    case "confirmJoin": confirmJoin(); break;
    case "rejoin": rejoinOnline(); break;
    case "forget": goOffline(); render(); break;
    case "share": dialog = "share"; render(); break;
    case "copyInvite": {
      const text = `Join my darts game: ${location.href.split("#")[0]} (code ${online ? online.code : ""})`;
      try{ navigator.clipboard.writeText(text).then(()=>msg("Invite copied"), ()=>msg(text)); }catch(err){ msg(text); }
      break;
    }
    case "undo": undo(); break;
    case "back": if(entry){ entry = entry.slice(0,-1); render(); } else undo(); break;
    case "enter": if(entry) submitScore(+entry); break;
    case "crest": if(isRG(match.game)) rgRest(); else cricketRest(); break;
    case "rules": dialog = "rules"; render(); break;
    case "closeRules": dialog = screen==="game" ? "quit" : null; render(); break;
    case "rand": randomPick(); break;
    case "reuse": reuseNumbers(); break;
    case "cancelFin": pending = null; render(); break;
    case "nextLeg": nextLeg(); break;
    case "quit": dialog = "quit"; render(); break;
    case "closeDlg": dialog = null; render(); break;
    case "toSetup": dialog = null; screen = profilesOn() ? "home" : "setup"; stopListening(); online = null; remoteClaims = {}; render(); break;
    case "rematch": {
      const pv = match;
      Object.assign(settings, { game:pv.game, inMode:pv.opts.inMode, outMode:pv.opts.outMode, points:pv.opts.points, lives:pv.opts.lives||3, sets:pv.opts.sets, legs:pv.opts.legs, players:pv.players.map(p=>p.name) });
      startMatch(); break;
    }
  }
});
app.addEventListener("input", e=>{
  const t = e.target, d = t.dataset;
  if(d.pl===undefined) return;
  settings.players[+d.pl] = t.value;
  save();
});
app.addEventListener("change", e=>{
  const t = e.target, d = t.dataset;
  if(d.link!==undefined){
    const i = +d.link;
    if(t.value==="new"){ editing = { key:null, name:"", email:"", forRow:i }; dialog = "edit"; render(); return; }
    setLink(i, t.value || null); render(); return;
  }
  if(d.jl!==undefined && joinState){
    const i = +d.jl;
    if(t.value==="new"){ editing = { key:null, name:"", email:"", forJoin:i }; dialog = "edit"; render(); return; }
    Object.keys(joinState.links).forEach(k=>{ if(t.value && joinState.links[k]===t.value && +k!==i) delete joinState.links[k]; });
    joinState.links[i] = t.value || null; render();
  }
});
app.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="authform") doAuth(authTab==="signup" ? "signup" : "login");
  if(e.target.id==="editform") saveEditing();
});
document.addEventListener("keydown", e=>{
  if(screen!=="game" || !match || dialog || e.target.tagName==="INPUT") return;
  if((e.ctrlKey||e.metaKey) && e.key==="z"){ e.preventDefault(); if(!online || match.by===deviceId) undo(); return; }
  if(online && !isMyTurn()) return;
  const totalEntry = is01(match.game) || match.game==="countup" || (match.game==="halveit" && ["EVEN","ODD"].includes(halveTarget()));
  if(!totalEntry || match.over || pending) return;
  if(/^[0-9]$/.test(e.key)){ if(entry.length<3 && !(entry==="" && e.key==="0")) entry += e.key; render(); }
  else if(e.key==="Backspace"){ entry = entry.slice(0,-1); render(); }
  else if(e.key==="Enter" && entry){ submitScore(+entry); }
});

load();
if(profilesOn()){ screen = "loading"; render(); startAuth(); }
else render();
})();
</script>
</body>
</html>
